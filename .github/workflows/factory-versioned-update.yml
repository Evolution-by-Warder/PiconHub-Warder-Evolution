name: Factory versioned update
on:
  push:
    branches: [factory-update-v0.2.0]
    paths:
      - 'factory/app/.factory-version.json'
  workflow_dispatch:
    inputs:
      version:
        description: 'Version (e.g. 0.2.3)'
        required: true
        type: string
permissions:
  contents: write
concurrency:
  group: warder-factory-release
  cancel-in-progress: false
jobs:
  package-and-release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: factory-update-v0.2.0
          fetch-depth: 0
      - name: Verify Factory-only source and version
        shell: bash
        env:
          VERSION: ${{ inputs.version || '0.2.8' }}
        run: |
          set -euo pipefail
          [[ "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]] || exit 1
          test -f factory/app/engine.py
          test -f factory/app/factory_launcher.py
          test -f factory/app/.factory-version.json
          test -f factory/app/templates/picons/black-sablona.png
          test -f factory/app/templates/picons/white-sablona.png
          python - <<'PY'
          import json,os
          from pathlib import Path
          version=json.loads(Path('factory/app/.factory-version.json').read_text())['version']
          assert version == 'factory-v'+os.environ['VERSION'], (version,os.environ['VERSION'])
          PY
      - name: Install tkinter for headless engine imports
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y python3-tk
      - name: Test and package Factory
        shell: bash
        env:
          VERSION: ${{ inputs.version || '0.2.8' }}
        run: |
          set -euo pipefail
          python -m pip install -r factory/app/requirements-runtime.txt
          (cd factory/app && python -m unittest discover -p 'test_*.py')
          python - <<'PY'
          import os,zipfile
          from pathlib import Path
          version=os.environ['VERSION']
          assert version == '0.2.8', version
          root=Path('factory/app')
          output=Path(f'warder-picon-factory-{version}.zip')
          with zipfile.ZipFile(output,'w',compression=zipfile.ZIP_DEFLATED) as archive:
              for file in sorted(root.rglob('*')):
                  if file.is_file() and '__pycache__' not in file.parts and '.pytest_cache' not in file.parts:
                      archive.write(file,file.relative_to(root))
          assert output.stat().st_size>0
          with zipfile.ZipFile(output) as archive:
              assert archive.testzip() is None
              assert 'engine.py' in archive.namelist()
              assert 'templates/picons/black-sablona.png' in archive.namelist()
              assert 'templates/picons/white-sablona.png' in archive.namelist()
          PY
      - name: Publish release and verify asset
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ inputs.version || '0.2.8' }}
        run: |
          set -euo pipefail
          tag="factory-v$VERSION"
          asset="warder-picon-factory-$VERSION.zip"
          if gh release view "$tag" >/dev/null 2>&1; then
            echo "Release already exists; refusing to overwrite it" >&2
            exit 1
          fi
          gh release create "$tag" "$asset" --repo "$GITHUB_REPOSITORY" --target factory-update-v0.2.0 --prerelease --title "$tag" --notes "WARDER PICON FACTORY $tag"
          gh release download "$tag" --repo "$GITHUB_REPOSITORY" --pattern "$asset" --dir /tmp/verify
          cmp "$asset" "/tmp/verify/$asset"
      - name: Update manifest only after release verification
        shell: bash
        env:
          VERSION: ${{ inputs.version || '0.2.8' }}
        run: |
          set -euo pipefail
          python - <<'PY'
          import hashlib,json,os
          from pathlib import Path
          v=os.environ['VERSION']
          assert v == '0.2.8', v
          file=Path(f'warder-picon-factory-{v}.zip')
          manifest={'schema':1,'version':f'factory-v{v}','url':f'https://github.com/{os.environ["GITHUB_REPOSITORY"]}/releases/download/factory-v{v}/{file.name}','size':file.stat().st_size,'sha256':hashlib.sha256(file.read_bytes()).hexdigest()}
          path=Path('factory/update/manifest.json')
          path.parent.mkdir(parents=True,exist_ok=True)
          path.write_text(json.dumps(manifest,indent=2)+'\n')
          PY
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add factory/update/manifest.json
          git commit -m "factory: publish update manifest v$VERSION"
          git push origin HEAD:factory-update-v0.2.0
