name: Stage verified Radio batch 23
on:
  push:
    branches: [work/warder-radio-world-batch23-20261106]
    paths: [.github/workflows/stage-radio-batch23.yml]

permissions:
  contents: write

jobs:
  stage:
    if: github.ref == 'refs/heads/work/warder-radio-world-batch23-20261106'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install Pillow==11.3.0
      - name: Verify and assemble Radio payload
        run: |
          root="$RUNNER_TEMP/warder-radio"
          mkdir -p "$root/de"
          base=https://raw.githubusercontent.com/Evolution-by-Warder/PiconHub-Warder-Evolution/e90a1fe3a2734b555f48f343284f9103530180fb
          curl -fsSL --retry 3 "$base/picons/IPTV-SK-CZ/catalog/global/search/2ae88890a953c2f68d3f20352ad56a7390645bd3ce189573dd94e50c8a65abfe.json.gz" -o "$root/world.gz"
          curl -fsSL --retry 3 "$base/picons/IPTV-DE/catalog/release.json" -o "$root/de.json"
          echo "084575899998c9b2883cb161a97379c4d3ae45b4458411f9ab1d24302a8cbd6e  $root/de.json" | sha256sum -c
          jq -r '.packages[][] | .url' "$root/de.json" | while IFS= read -r url; do
            curl -fsSL --retry 3 "$url" -o "$root/de/${url##*/}"
          done
          python picons/radio-world/prepare_country_packs.py picons/radio-world/staging/batch-23 "$root/world.gz" "$root/de.json" "$root/de" "$root/candidate"
          python picons/radio-world/write_release_candidates.py "$root/candidate" payload
      - name: Commit only to the Radio work branch
        run: |
          test "$(git branch --show-current)" = work/warder-radio-world-batch23-20261106
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          for country in AR DE GB SE UA US; do
            git add -- "picons/IPTV-$country/packages"
          done
          git commit -m 'Stage Warder Radio batch 23 country ZIPs'
          python picons/radio-world/write_release_candidates.py "$RUNNER_TEMP/warder-radio/candidate" "$(git rev-parse HEAD)"
          for country in AR DE GB SE UA US; do
            git add -- "picons/IPTV-$country/catalog/release.json"
          done
          git rm -- .github/workflows/stage-radio-batch23.yml
          git commit -m 'Stage SHA-pinned Warder Radio downloader manifests'
          git push origin HEAD:refs/heads/work/warder-radio-world-batch23-20261106
