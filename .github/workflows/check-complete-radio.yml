name: Build complete radio directory candidate
on:
  push:
    branches: [radio-global-catalogue-20261103]
permissions:
  contents: read
jobs:
  snapshot:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: |
            picons/IPTV-SK-CZ/tools
            picons/IPTV-SK-CZ/bouquets
          sparse-checkout-cone-mode: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.14'
      - run: python -m unittest discover -s picons/IPTV-SK-CZ/tools -p 'test_*radio.py' -v
      - run: python picons/IPTV-SK-CZ/tools/fetch_complete_radio.py
      - run: python picons/IPTV-SK-CZ/tools/global_radio.py --output catalogue-data/compiled
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: complete-radio-sources
          path: catalogue-data
          retention-days: 7
