name: Warder whole-colour-logo protection
on:
  pull_request:
    paths:
      - tools/warder_brand_guard.py
      - tools/test_warder_brand_guard.py
      - plugin/artwork/QUALITY.md
      - '.github/workflows/**'
  push:
    branches: [main]
    paths:
      - tools/warder_brand_guard.py
      - tools/test_warder_brand_guard.py
      - plugin/artwork/QUALITY.md
      - .github/workflows/warder-brand-guard.yml
permissions:
  contents: read
jobs:
  whole-logo-regressions:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Read-only safety check for retired PiconHub publisher
        shell: bash
        run: |
          set -euo pipefail
          test ! -e .github/workflows/piconhub-0.1.41-download-fix.yml
          test -s .github/workflows/piconhub-plugin-core.yml
          test -s .github/workflows/warder-approved-scope-auto-merge.yml
          echo 'PASS: retired 0.1.41 workflow absent, current build and approved-scope protection retained'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install numpy pillow
      - run: PYTHONPATH=tools PYTHONDONTWRITEBYTECODE=1 python tools/test_warder_brand_guard.py
