name: Check supplemental radio integration
on:
  push:
    branches: [radio-laut-source-20261103]
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: picons/IPTV-SK-CZ
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Merger regression checks
        run: python -m unittest discover -s picons/IPTV-SK-CZ/tools -p 'test_*radio.py' -v
      - name: Refresh live sources without publishing
        run: |
          python picons/IPTV-SK-CZ/tools/update_world_radio.py
          python - <<'PY'
          import json
          from pathlib import Path
          root=Path('picons/IPTV-SK-CZ')
          report=json.loads((root/'catalog/world-radio-update.json').read_text())
          assert report['supplemental_sources']['laut.fm']['status']=='live', report
          assert report['total_stations'] <= 20000
          assert (root/'bouquets/userbouquet.warder.radio').stat().st_size <= 4*1024*1024
          print(json.dumps(report,ensure_ascii=False,indent=2))
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: supplemental-radio-live-check
          path: |
            picons/IPTV-SK-CZ/bouquets/userbouquet.warder.radio
            picons/IPTV-SK-CZ/catalog/world-radio-update.json
