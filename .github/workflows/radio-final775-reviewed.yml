name: Render verified final Radio artwork
on:
  push:
    branches: [work/radio-final775-reviewed-20261105]
    paths: [migration/radio-final775-reviewed-20261105/new-ready.json]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  render:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          ref: work/radio-final775-reviewed-20261105
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /tools/
            /plugin/artwork/templates/picons/
            /migration/radio-final-pass-20261105/
            /migration/radio-final775-reviewed-20261105/
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install Pillow==13.0.0
      - run: python tools/render_final_github.py
