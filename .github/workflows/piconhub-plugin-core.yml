name: PiconHub plugin core

on:
  push:
    branches: [plugin/futuristic-rebuild]
    paths: [plugin/src/**, plugin/tests/**, plugin/tools/**, .github/workflows/piconhub-plugin-core.yml]
  pull_request:
    paths: [plugin/src/**, plugin/tests/**, plugin/tools/**, .github/workflows/piconhub-plugin-core.yml]

permissions:
  contents: read

jobs:
  core:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: |
            plugin
            picons/DAB
            picons/IPTV-SK-CZ
      - uses: actions/setup-python@v5
        with:
          python-version: '3.9'
      - name: Test package selection and download integrity
        env:
          PYTHONPATH: plugin/src
        run: python3 -m unittest discover -s plugin/tests -v

      - name: Build development IPK
        run: python3 plugin/tools/build_ipk.py --output plugin/build --revision "$GITHUB_SHA"
      - name: Preserve development package
        uses: actions/upload-artifact@v4
        with:
          name: PiconHub-Warder-Evolution-development
          path: |
            plugin/build/*.ipk
            plugin/build/*.sha256
          retention-days: 90

  publish:
    needs: core
    if: github.event_name == 'push' && github.ref == 'refs/heads/plugin/futuristic-rebuild'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    concurrency:
      group: piconhub-plugin-release
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: plugin
      - uses: actions/setup-python@v5
        with:
          python-version: '3.9'
      - uses: actions/download-artifact@v4
        with:
          name: PiconHub-Warder-Evolution-development
          path: plugin/build
      - name: Publish verified numbered plugin release and update feed
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python3 plugin/tools/publish_plugin_release.py --output plugin/build --revision "$GITHUB_SHA"
