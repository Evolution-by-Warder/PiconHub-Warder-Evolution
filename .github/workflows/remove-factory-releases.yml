name: Remove retired Factory releases
on:
  push:
    branches: [plugin/futuristic-rebuild]
    paths:
      - .github/factory-removal.json
permissions:
  contents: read
jobs:
  cleanup:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: .github
      - uses: actions/setup-python@v5
        with:
          python-version: '3.9'
      - name: Test explicit release cleanup safeguards
        run: python3 -m unittest discover -s .github/tests -v
      - name: Remove listed Factory releases and retain receiver plugin releases
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python3 .github/scripts/cleanup_factory_releases.py
