name: Transfer pinned Italian manifest
on:
  push:
    branches: [work/italia-followup-manifest-20261124]
    paths: ['.github/workflows/italia-followup-manifest.yml']
permissions:
  contents: write
jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /plugin/src/Plugins/Extensions/WarderPiconHub/data/channel-manifest.json
      - name: Fetch exact candidate and validate
        run: |
          p=plugin/src/Plugins/Extensions/WarderPiconHub/data/channel-manifest.json
          curl --fail --silent --show-error --retry 2 'https://raw.githubusercontent.com/Evolution-by-Warder/FullHDGlass-Warder-Evolution/4b7933161256eb55076126f6722e5de72ac86b25/assets/warder/downloads/picons/channels/manifest.json' -o "$p"
          printf '%s  %s\n' '4541dea07b011d2cac2981c5b8203ebae7e363c85e481316a4cf6c0b04d9b6a6' "$p" | sha256sum -c -
          test "$(git hash-object "$p")" = 5f0c3a16ef39210c4e59ead880145df1f7c83b89
          python3 -c 'import json; m=json.load(open("plugin/src/Plugins/Extensions/WarderPiconHub/data/channel-manifest.json")); p=[x for x in m["packages"] if x["selector_id"]=="DTT_ITALIA"]; assert len(p)==9 and all(x["png_count"]==323 for x in p)'
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add "$p"
          git commit -m "Transfer exact Italian follow-up catalogue"
          git push origin HEAD:work/italia-followup-manifest-20261124
