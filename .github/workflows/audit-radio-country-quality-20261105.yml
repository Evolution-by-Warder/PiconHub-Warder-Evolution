name: Verify Warder radio country packages and coverage (5 collections)
on:
  push:
    branches: [audit/radio-country-quality-20261105]
    paths:
      - '.github/workflows/audit-radio-country-quality-20261105.yml'
      - 'tools/audit_radio_country_quality.py'
permissions:
  contents: write
jobs:
  quality:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          filter: blob:none
          fetch-depth: 0
          sparse-checkout: |
            picons/IPTV-SK-CZ
            picons/IPTV-AT
            picons/IPTV-DE
            picons/IPTV-HU
            picons/IPTV-PL
            tools/audit_radio_country_quality.py
            reports
            .github/workflows
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - name: Verify 45 real ZIPs, all file hashes, station counts and manifest invariants
        run: python3 tools/audit_radio_country_quality.py
      - name: Preserve immutable audit report
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add reports/radio-country-quality-20261105.json
          if ! git diff --cached --quiet; then
            git commit -m "Record full current Warder radio source and 45-archive integrity audit"
            git push origin HEAD:audit/radio-country-quality-20261105
          fi
