name: Publish verified IPTV SK CZ radio packages
on:
  push:
    branches: [radio/iptv-sk-cz-publish]
permissions:
  contents: write
concurrency:
  group: warder-iptv-radio-publication
  cancel-in-progress: false
jobs:
  publish:
    if: contains(github.event.head_commit.message, 'Publish IPTV SK/CZ payload')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.14'
      - run: python3 -m pip install --quiet Pillow
      - name: Verify all images and publish immutable downloads
        run: python3 picons/IPTV-SK-CZ/tools/publish_packages.py
