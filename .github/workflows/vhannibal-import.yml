name: Guarded Vhannibal picon import

on:
  push:
    branches:
      - vhannibal-import-20260914
  workflow_dispatch:

permissions:
  contents: write

jobs:
  import:
    if: github.event_name == 'workflow_dispatch' || github.event.head_commit.message != 'Import Vhannibal transparent picons by provider'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout import branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Download Vhannibal picon source
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/vhannibal-picons
          curl --fail --location --retry 3 --retry-delay 2 \
            --user-agent 'Mozilla/5.0 PiconHub-Warder-Evolution guarded-import' \
            --referer 'https://www.vhannibal.net/' \
            'https://www.vhannibal.net/download_setting.php?action=download&id=1' \
            --output /tmp/vhannibal-picons.zip
          unzip -tq /tmp/vhannibal-picons.zip
          unzip -qq /tmp/vhannibal-picons.zip -d /tmp/vhannibal-picons
          test "$(find /tmp/vhannibal-picons -type f -iname '*.png' | wc -l)" -gt 0

      - name: Fetch Vhannibal Motor service metadata
        shell: bash
        run: |
          set -euo pipefail
          git clone --depth 1 https://github.com/OpenVisionE2/Vhannibal-settings.git /tmp/vhannibal-settings
          test -s /tmp/vhannibal-settings/vhannibal.motor/lamedb

      - name: Classify and stage picons
        env:
          VHANNIBAL_PICON_DIR: /tmp/vhannibal-picons
          VHANNIBAL_LAMEDB: /tmp/vhannibal-settings/vhannibal.motor/lamedb
        run: python3 migration/vhannibal/import_vhannibal.py

      - name: Verify hierarchy
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import sys
          bad=[]
          for p in Path('picons').rglob('*.png'):
              rel=p.relative_to('picons').parts
              if len(rel) != 4 or rel[2] not in {'transparent','white','black'}:
                  bad.append(str(p))
          if bad:
              print('Invalid hierarchy entries:')
              print('\n'.join(bad[:100]))
              sys.exit(1)
          PY

      - name: Commit guarded import
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'PiconHub-Warder'
          git config user.email 'actions@users.noreply.github.com'
          git add picons migration/vhannibal/import-report.tsv migration/vhannibal/import-summary.txt
          if git diff --cached --quiet; then
            echo 'No staged changes.'
            exit 1
          fi
          git commit -m 'Import Vhannibal transparent picons by provider'
          git push origin HEAD:vhannibal-import-20260914
