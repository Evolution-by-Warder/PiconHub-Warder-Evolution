name: Render reviewed Radio logos after checkpoint10549
on:
  push:
    branches: [work/radio-reviewed-batch17-20261105]
    paths: [migration/radio-next-review-20261105/review-decisions.json]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  render:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: work/radio-reviewed-batch17-20261105
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install Pillow==13.0.0
      - run: |
          mkdir -p /tmp/radio-masters
          cp plugin/artwork/templates/picons/white-sablona.png /tmp/radio-masters/white.png
          cp plugin/artwork/templates/picons/black-sablona.png /tmp/radio-masters/black.png
      - name: Render all visually approved references from frozen source state
        run: python tools/prepare_selected_radio_review.py --root migration/radio-fast-logo-production-20261105 --selection migration/radio-next-review-20261105/selected-source-claim.json --decisions migration/radio-next-review-20261105/review-decisions.json --templates /tmp/radio-masters --renderer tools/review_selected_radio_logos.py
      - name: Save approved originals and PNG variants
        run: |
          git config user.name 'Warder Radio artwork'
          git config user.email 'radio-artwork@users.noreply.github.com'
          git add migration/radio-fast-logo-production-20261105
          if ! git diff --cached --quiet; then
            git commit -m 'Save next visually reviewed Radio logos and all nine PNG variants'
            git push origin HEAD:work/radio-reviewed-batch17-20261105
          fi
