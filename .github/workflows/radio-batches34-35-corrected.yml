name: Radio batches 34 and 35 corrected verified saved artwork
on:
  push:
    branches: [work/radio-batches34-35-corrected-20261107]
    paths:
      - .github/workflows/radio-batches34-35-corrected.yml
      - 'picons/radio-world/staging/batches-34-35-corrected/selection.json*'
      - picons/radio-world/staging/batches-34-35-corrected/configuration.json
permissions:
  contents: write
jobs:
  build:
    if: github.ref == 'refs/heads/work/radio-batches34-35-corrected-20261107'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: |
            picons/radio-world/tools
            picons/radio-world/staging/batches-34-35-corrected
      - uses: actions/checkout@v4
        with:
          repository: Evolution-by-Warder/Radio-Warder-Evolution
          ref: b7384bfdb55621beaf183ca6d40e9dedacaecdb9
          path: _radio
      - run: python3 -m pip install Pillow
      - name: Verify originals and preserve all earlier PNGs
        run: |
          set -eu
          stage=picons/radio-world/staging/batches-34-35-corrected
          mkdir "$RUNNER_TEMP/batch36-corrected"
          python3 picons/radio-world/tools/remove_held_artwork.py "$stage/configuration.json" build "$RUNNER_TEMP/batch36-corrected" "$RUNNER_TEMP/new-zips"
      - name: Save immutable country ZIPs and manifests on a working ref
        run: |
          set -eu
          stage=picons/radio-world/staging/batches-34-35-corrected
          scratch="$RUNNER_TEMP/radio36-corrected-payload"
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git fetch --depth=1 --no-tags origin 59a6f69c69b62ee1f4c1490f3a37ddff50d5bd4b
          git worktree add --detach "$scratch" FETCH_HEAD
          git -C "$scratch" sparse-checkout disable
          cp -R "$RUNNER_TEMP/new-zips/picons" "$scratch/"
          git -C "$scratch" add picons
          git -C "$scratch" commit -m 'Save verified batches 34 and 35 corrected Radio country ZIPs [skip ci]'
          payload=$(git -C "$scratch" rev-parse HEAD)
          python3 picons/radio-world/tools/remove_held_artwork.py "$stage/configuration.json" manifests "$RUNNER_TEMP/batch36-corrected" "$scratch" "$payload"
          git -C "$scratch" add picons
          git -C "$scratch" commit -m 'Pin batches 34 and 35 corrected Radio country manifests [skip ci]'
          manifest=$(git -C "$scratch" rev-parse HEAD)
          git -C "$scratch" push origin HEAD:refs/heads/work/radio-batches34-35-corrected-payload-20261107
          python3 picons/radio-world/tools/remove_held_artwork.py "$stage/configuration.json" index "$RUNNER_TEMP/batch36-corrected" "$scratch" "$payload" "$manifest"
          git add "$stage/countries.proposed.json" "$stage/proof.json"
          git commit -m 'Save batches 34 and 35 corrected candidate index and preservation proof [skip ci]'
          git push origin HEAD:refs/heads/work/radio-batches34-35-corrected-20261107
      - name: Replay the unchanged stable downloader on public immutable assets
        run: |
          set -eu
          stage=picons/radio-world/staging/batches-34-35-corrected
          python3 picons/radio-world/tools/replay_downloader.py --index "$stage/countries.proposed.json" --countries all-available --output "$stage/downloader-proof.json" --radio _radio --cache "$RUNNER_TEMP/http-cache"
          git add "$stage/downloader-proof.json"
          git commit -m 'Verify batches 34 and 35 corrected against stable Radio downloader [skip ci]'
          git push origin HEAD:refs/heads/work/radio-batches34-35-corrected-20261107
