name: Produce Radio picons from named broadcaster logos in large batches
on:
  push:
    branches: ['research/warder-world-radio-logo-alias-scan-20261104']
    paths: ['.github/workflows/radio-fast-logo-production-20261105.yml', 'migration/radio-fast-logo-production-20261105/build_radio_named_logos_fast.py']
permissions:
  contents: write
concurrency:
  group: radio-fast-logo-production-20261105
  cancel-in-progress: false
jobs:
  produce:
    runs-on: ubuntu-24.04
    timeout-minutes: 350
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: |
            migration/radio-fast-logo-production-20261105
            .github/workflows
      - uses: actions/checkout@v4
        with:
          ref: e90a1fe3a2734b555f48f343284f9103530180fb
          path: _radio_catalogue
          persist-credentials: false
          sparse-checkout: |
            picons/IPTV-SK-CZ/catalog/global
            plugin/artwork/templates/picons
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install --quiet Pillow==13.0.0 CairoSVG==2.8.2
      - run: sudo apt-get update -qq && sudo apt-get install -y -qq tesseract-ocr libcairo2
      - name: Record production worker identity
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
      - name: Produce all nine PNG variants and save progress every batch
        run: |
          python migration/radio-fast-logo-production-20261105/build_radio_named_logos_fast.py --catalogue _radio_catalogue/picons/IPTV-SK-CZ/catalog/global --masters _radio_catalogue/plugin/artwork/templates/picons --output migration/radio-fast-logo-production-20261105 --commit
      - name: Preserve completed files if interrupted
        if: always()
        run: |
          git add migration/radio-fast-logo-production-20261105
          if ! git diff --cached --quiet; then
            git commit -m "Preserve completed Radio picons and progress"
            git push origin HEAD:research/warder-world-radio-logo-alias-scan-20261104
          fi
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: radio-fast-picons-checkpoint
          retention-days: 90
          path: |
            migration/radio-fast-logo-production-20261105/discovery-journal.jsonl
            migration/radio-fast-logo-production-20261105/verified-ready.json
