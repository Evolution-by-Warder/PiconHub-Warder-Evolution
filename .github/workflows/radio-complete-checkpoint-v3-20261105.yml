name: Continue Radio with confirmed broadcaster pages and durable checkpoints
on:
  push:
    branches: ['review/radio-laut-large-batch04-20261105']
    paths: ['.github/workflows/radio-complete-checkpoint-v3-20261105.yml']
permissions:
  contents: write
  actions: write
concurrency:
  group: radio-complete-source-acquisition-v3-20261105
  cancel-in-progress: false
jobs:
  collect:
    runs-on: ubuntu-24.04
    timeout-minutes: 350
    steps:
      - name: Stop previous stalled source worker after its saved checkpoint
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh api --method POST repos/Evolution-by-Warder/PiconHub-Warder-Evolution/actions/runs/42025749544/cancel || true
      - uses: actions/checkout@v4
        with:
          sparse-checkout: |
            migration/radio-complete-20261105
            .github/workflows
      - uses: actions/checkout@v4
        with:
          ref: e90a1fe3a2734b555f48f343284f9103530180fb
          path: _radio_catalogue
          persist-credentials: false
          sparse-checkout: |
            picons/IPTV-SK-CZ/catalog/global
            plugin/artwork/templates/picons
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install --quiet Pillow==13.0.0
      - name: Install wordmark verification engine
        run: sudo apt-get update -qq && sudo apt-get install -y -qq tesseract-ocr
      - name: Record worker identity
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
      - name: Acquire originals and save progress every batch
        run: |
          cp migration/radio-complete-20261105/ready-references-after-batch05.json migration/radio-complete-20261105/ready-references.json
          python migration/radio-complete-20261105/collect_radio_sources_v3.py --catalogue _radio_catalogue/picons/IPTV-SK-CZ/catalog/global --masters _radio_catalogue/plugin/artwork/templates/picons --output migration/radio-complete-20261105 --commit
      - name: Preserve latest progress even if interrupted
        if: always()
        run: |
          git add migration/radio-complete-20261105
          if ! git diff --cached --quiet; then
            git commit -m "Preserve interrupted Radio source acquisition progress"
            git push origin HEAD:review/radio-laut-large-batch04-20261105
          fi
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: radio-complete-source-checkpoint-v3
          retention-days: 90
          path: |
            migration/radio-complete-20261105/source-acquisition.json
            migration/radio-complete-20261105/acquisition-journal.jsonl
            migration/radio-complete-20261105/candidate-sheets
