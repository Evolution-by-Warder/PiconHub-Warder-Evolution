name: Stage verified Radio batch 25
on:
  push:
    branches: [work/warder-radio-world-batch25-20261106]
    paths: [.github/workflows/stage-radio-batch25.yml]

permissions:
  contents: write

jobs:
  stage:
    if: github.ref == 'refs/heads/work/warder-radio-world-batch25-20261106'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install Pillow==11.3.0
      - name: Render and validate all Radio variants
        run: |
          root="$RUNNER_TEMP/warder-radio"
          mkdir -p "$root"
          base=https://raw.githubusercontent.com/Evolution-by-Warder/PiconHub-Warder-Evolution/e90a1fe3a2734b555f48f343284f9103530180fb
          curl -fsSL --retry 3 "$base/picons/IPTV-SK-CZ/catalog/global/search/2ae88890a953c2f68d3f20352ad56a7390645bd3ce189573dd94e50c8a65abfe.json.gz" -o "$root/world.gz"
          for style in white black; do
            curl -fsSL --retry 3 "$base/plugin/artwork/templates/picons/$style-sablona.png" -o "$root/$style.png"
          done
          mkdir -p picons/radio-world/staging/batch-25/originals
          jq -r '.source_inventory[] | [.sha256, .url] | @tsv' picons/radio-world/staging/batch-25/sources.json | while IFS= picons/radio-world/staging/batch-25 "$root/world.gz" "$root"
      - name: Save rendered picons to the Radio work branch
        run: |
          test "$(git branch --show-current)" = work/warder-radio-world-batch25-20261106
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- picons/radio-world/staging/batch-25/
          git rm -- .github/workflows/stage-radio-batch25.yml
          git commit -m 'Stage and verify 36 Warder Radio PNGs for batch 25'
          git push origin HEAD:refs/heads/work/warder-radio-world-batch25-20261106
\t' read -r digest url; do
            [[ "$digest" =~ ^[a-f0-9]{64}$ ]]
            [[ "$url" == https://*'/bot-imgs/radio-stations/'* ]]
            curl -fsSL --retry 3 --max-filesize 5000000 "$url" -o "picons/radio-world/staging/batch-25/originals/$digest.img"
            echo "$digest  picons/radio-world/staging/batch-25/originals/$digest.img" | sha256sum -c
          done
          python picons/radio-world/render_verified_batch.py picons/radio-world/staging/batch-25 "$root/world.gz" "$root"
      - name: Save rendered picons to the Radio work branch
        run: |
          test "$(git branch --show-current)" = work/warder-radio-world-batch25-20261106
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- picons/radio-world/staging/batch-25/*.zip picons/radio-world/staging/batch-25/manifest.json
          git rm -- .github/workflows/stage-radio-batch25.yml
          git commit -m 'Stage and verify 36 Warder Radio PNGs for batch 25'
          git push origin HEAD:refs/heads/work/warder-radio-world-batch25-20261106
