name: Verify public Radio Garden endpoints
on:
  push:
    branches: [radio-garden-source-check-20261103]
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: picons/IPTV-SK-CZ/tools/check_radio_garden.py
          sparse-checkout-cone-mode: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Check index, city/channel IDs, countries and stream redirects
        run: python picons/IPTV-SK-CZ/tools/check_radio_garden.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: radio-garden-read-only-check
          path: radio-garden-check.json
