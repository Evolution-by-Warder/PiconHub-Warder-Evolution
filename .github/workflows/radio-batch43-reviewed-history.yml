name: Radio batch 43-reviewed verified saved artwork
on:
  push:
    branches: [work/radio-world-batch43-reviewed-history-20261107]
    paths:
      - .github/workflows/radio-batch43-reviewed-history.yml
      - 'picons/radio-world/staging/batch-43-reviewed/selection.json*'
      - picons/radio-world/staging/batch-43-reviewed/configuration.json
permissions:
  contents: write
jobs:
  build:
    if: github.ref == 'refs/heads/work/radio-world-batch43-reviewed-history-20261107'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: |
            picons/radio-world/tools
            picons/radio-world/preparation/batch-43
            picons/radio-world/staging/visual-review-34-36
            picons/radio-world/staging/source-ledger-reviewed-20261107
            picons/radio-world/staging/batch-39-reviewed
            picons/radio-world/staging/batch-40-reviewed
            picons/radio-world/staging/batch-41-reviewed
            picons/radio-world/staging/batch-42-reviewed
            picons/radio-world/staging/batch-43-reviewed
      - uses: actions/checkout@v4
        with:
          repository: Evolution-by-Warder/Radio-Warder-Evolution
          ref: b7384bfdb55621beaf183ca6d40e9dedacaecdb9
          path: _radio
      - run: python3 -m pip install Pillow
      - name: Bootstrap approved141 source exports and technical quarantine
        env:
          PYTHONPYCACHEPREFIX: ${{ runner.temp }}/pycache43
        run: |
          set -euo pipefail
          test "$GITHUB_REF" = refs/heads/work/radio-world-batch43-reviewed-history-20261107
          stage=picons/radio-world/staging/batch-43-reviewed
          python3 -m py_compile "$stage/bootstrap43.py"
          python3 "$stage/bootstrap43.py"
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add "$stage/selection.json.gz" "$stage/visual-ledger.json.gz" "$stage/configuration.json" "$stage/preparation-proof.json" "$stage/bootstrap-proof.json" picons/radio-world/preparation/batch-43/prepare43.py
          if ! git diff --cached --quiet; then
            git commit -m 'Freeze exact141 source selection and technical quarantine [skip ci]'
            git push origin HEAD:refs/heads/work/radio-world-batch43-reviewed-history-20261107
          fi
      - run: python3 -m unittest discover -s picons/radio-world/tools -p test_visual_gate.py -v
      - name: Verify originals and preserve all earlier PNGs
        run: |
          set -eu
          stage=picons/radio-world/staging/batch-43-reviewed
          python3 -c 'from pathlib import Path; import sys; expected=["source-ledger-reviewed-20261107/visual-ledger.json.gz","visual-review-34-36/decisions.json.gz","batch-39-reviewed/visual-ledger.json.gz","batch-40-reviewed/visual-ledger.json.gz","batch-41-reviewed/visual-ledger.json.gz","batch-42-reviewed/visual-ledger.json.gz","batch-43-reviewed/visual-ledger.json.gz"]; actual=sys.argv[1:]; assert len(actual)==7 and set(actual)=={str(Path("picons/radio-world/staging")/p) for p in expected}; assert all(Path(p).is_file() for p in actual)' picons/radio-world/staging/source-ledger-reviewed-20261107/visual-ledger.json.gz picons/radio-world/staging/visual-review-34-36/decisions.json.gz picons/radio-world/staging/batch-39-reviewed/visual-ledger.json.gz picons/radio-world/staging/batch-40-reviewed/visual-ledger.json.gz picons/radio-world/staging/batch-41-reviewed/visual-ledger.json.gz picons/radio-world/staging/batch-42-reviewed/visual-ledger.json.gz picons/radio-world/staging/batch-43-reviewed/visual-ledger.json.gz
          python3 picons/radio-world/tools/visual_gate.py --ledger picons/radio-world/staging/source-ledger-reviewed-20261107/visual-ledger.json.gz --ledger picons/radio-world/staging/visual-review-34-36/decisions.json.gz --ledger picons/radio-world/staging/batch-39-reviewed/visual-ledger.json.gz --ledger picons/radio-world/staging/batch-40-reviewed/visual-ledger.json.gz --ledger picons/radio-world/staging/batch-41-reviewed/visual-ledger.json.gz --ledger picons/radio-world/staging/batch-42-reviewed/visual-ledger.json.gz --ledger "$stage/visual-ledger.json.gz" --selection "$stage/selection.json.gz"
          mkdir "$RUNNER_TEMP/batch43-reviewed"
          python3 picons/radio-world/tools/saved_artwork_import.py "$stage/configuration.json" build "$RUNNER_TEMP/batch43-reviewed" "$RUNNER_TEMP/new-zips"
      - name: Save immutable country ZIPs and manifests on a working ref
        run: |
          set -eu
          stage=picons/radio-world/staging/batch-43-reviewed
          scratch="$RUNNER_TEMP/radio43-payload"
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git fetch --depth=1 --no-tags origin 59a6f69c69b62ee1f4c1490f3a37ddff50d5bd4b
          git worktree add --detach "$scratch" FETCH_HEAD
          git -C "$scratch" sparse-checkout disable
          cp -R "$RUNNER_TEMP/new-zips/picons" "$scratch/"
          git -C "$scratch" add picons
          git -C "$scratch" commit -m 'Save verified batch 43-reviewed Radio country ZIPs [skip ci]'
          payload=$(git -C "$scratch" rev-parse HEAD)
          python3 picons/radio-world/tools/saved_artwork_import.py "$stage/configuration.json" manifests "$RUNNER_TEMP/batch43-reviewed" "$scratch" "$payload"
          git -C "$scratch" add picons
          git -C "$scratch" commit -m 'Pin batch 43-reviewed Radio country manifests [skip ci]'
          manifest=$(git -C "$scratch" rev-parse HEAD)
          git -C "$scratch" push origin HEAD:refs/heads/work/radio-world-batch43-reviewed-payload-20261107
          python3 picons/radio-world/tools/saved_artwork_import.py "$stage/configuration.json" index "$RUNNER_TEMP/batch43-reviewed" "$scratch" "$payload" "$manifest"
          git add "$stage/countries.proposed.json" "$stage/proof.json"
          git commit -m 'Save batch 43-reviewed candidate index and preservation proof [skip ci]'
          git push origin HEAD:refs/heads/work/radio-world-batch43-reviewed-history-20261107
      - name: Replay the unchanged stable downloader on public immutable assets
        run: |
          set -eu
          stage=picons/radio-world/staging/batch-43-reviewed
          codes=$(python3 -c 'import json; print(" ".join(json.load(open("'$stage'/proof.json"))["additions"]))')
          python3 picons/radio-world/tools/replay_downloader.py --index "$stage/countries.proposed.json" --countries all-available --output "$stage/downloader-proof.json" --radio _radio --cache "$RUNNER_TEMP/http-cache"
          curl --fail --retry 3 --location https://raw.githubusercontent.com/Evolution-by-Warder/PiconHub-Warder-Evolution/8180aa0df6e185efad120338bc53ca04bc5e492a/picons/radio-world/catalog/countries.json -o "$RUNNER_TEMP/production.json"
          python3 picons/radio-world/tools/audit_production_preservation.py --candidate "$stage/countries.proposed.json" --production "$RUNNER_TEMP/production.json" --output "$stage/production-preservation-proof.json"
          python3 -c 'from pathlib import Path; import sys; expected=["source-ledger-reviewed-20261107/visual-ledger.json.gz","visual-review-34-36/decisions.json.gz","batch-39-reviewed/visual-ledger.json.gz","batch-40-reviewed/visual-ledger.json.gz","batch-41-reviewed/visual-ledger.json.gz","batch-42-reviewed/visual-ledger.json.gz","batch-43-reviewed/visual-ledger.json.gz"]; actual=sys.argv[1:]; assert len(actual)==7 and set(actual)=={str(Path("picons/radio-world/staging")/p) for p in expected}; assert all(Path(p).is_file() for p in actual)' picons/radio-world/staging/source-ledger-reviewed-20261107/visual-ledger.json.gz picons/radio-world/staging/visual-review-34-36/decisions.json.gz picons/radio-world/staging/batch-39-reviewed/visual-ledger.json.gz picons/radio-world/staging/batch-40-reviewed/visual-ledger.json.gz picons/radio-world/staging/batch-41-reviewed/visual-ledger.json.gz picons/radio-world/staging/batch-42-reviewed/visual-ledger.json.gz picons/radio-world/staging/batch-43-reviewed/visual-ledger.json.gz
          python3 picons/radio-world/tools/visual_gate.py --ledger picons/radio-world/staging/source-ledger-reviewed-20261107/visual-ledger.json.gz --ledger picons/radio-world/staging/visual-review-34-36/decisions.json.gz --ledger picons/radio-world/staging/batch-39-reviewed/visual-ledger.json.gz --ledger picons/radio-world/staging/batch-40-reviewed/visual-ledger.json.gz --ledger picons/radio-world/staging/batch-41-reviewed/visual-ledger.json.gz --ledger picons/radio-world/staging/batch-42-reviewed/visual-ledger.json.gz --ledger "$stage/visual-ledger.json.gz" --index "$stage/countries.proposed.json" --selection "$stage/selection.json.gz"
          python3 -c 'from pathlib import Path; import sys; expected=["source-ledger-reviewed-20261107/visual-ledger.json.gz","visual-review-34-36/decisions.json.gz","batch-39-reviewed/visual-ledger.json.gz","batch-40-reviewed/visual-ledger.json.gz","batch-41-reviewed/visual-ledger.json.gz","batch-42-reviewed/visual-ledger.json.gz","batch-43-reviewed/visual-ledger.json.gz"]; actual=sys.argv[1:]; assert len(actual)==7 and set(actual)=={str(Path("picons/radio-world/staging")/p) for p in expected}; assert all(Path(p).is_file() for p in actual)' picons/radio-world/staging/source-ledger-reviewed-20261107/visual-ledger.json.gz picons/radio-world/staging/visual-review-34-36/decisions.json.gz picons/radio-world/staging/batch-39-reviewed/visual-ledger.json.gz picons/radio-world/staging/batch-40-reviewed/visual-ledger.json.gz picons/radio-world/staging/batch-41-reviewed/visual-ledger.json.gz picons/radio-world/staging/batch-42-reviewed/visual-ledger.json.gz picons/radio-world/staging/batch-43-reviewed/visual-ledger.json.gz
          python3 picons/radio-world/tools/visual_gate.py --ledger picons/radio-world/staging/source-ledger-reviewed-20261107/visual-ledger.json.gz --ledger picons/radio-world/staging/visual-review-34-36/decisions.json.gz --ledger picons/radio-world/staging/batch-39-reviewed/visual-ledger.json.gz --ledger picons/radio-world/staging/batch-40-reviewed/visual-ledger.json.gz --ledger picons/radio-world/staging/batch-41-reviewed/visual-ledger.json.gz --ledger picons/radio-world/staging/batch-42-reviewed/visual-ledger.json.gz --ledger "$stage/visual-ledger.json.gz" --index "$stage/countries.proposed.json"
          python3 -c 'from pathlib import Path; import sys; expected=["source-ledger-reviewed-20261107/visual-ledger.json.gz","visual-review-34-36/decisions.json.gz","batch-39-reviewed/visual-ledger.json.gz","batch-40-reviewed/visual-ledger.json.gz","batch-41-reviewed/visual-ledger.json.gz","batch-42-reviewed/visual-ledger.json.gz","batch-43-reviewed/visual-ledger.json.gz"]; actual=sys.argv[1:]; assert len(actual)==7 and set(actual)=={str(Path("picons/radio-world/staging")/p) for p in expected}; assert all(Path(p).is_file() for p in actual)' picons/radio-world/staging/source-ledger-reviewed-20261107/visual-ledger.json.gz picons/radio-world/staging/visual-review-34-36/decisions.json.gz picons/radio-world/staging/batch-39-reviewed/visual-ledger.json.gz picons/radio-world/staging/batch-40-reviewed/visual-ledger.json.gz picons/radio-world/staging/batch-41-reviewed/visual-ledger.json.gz picons/radio-world/staging/batch-42-reviewed/visual-ledger.json.gz picons/radio-world/staging/batch-43-reviewed/visual-ledger.json.gz
          python3 picons/radio-world/tools/audit_png_admission.py --ledger picons/radio-world/staging/source-ledger-reviewed-20261107/visual-ledger.json.gz --ledger picons/radio-world/staging/visual-review-34-36/decisions.json.gz --ledger picons/radio-world/staging/batch-39-reviewed/visual-ledger.json.gz --ledger picons/radio-world/staging/batch-40-reviewed/visual-ledger.json.gz --ledger picons/radio-world/staging/batch-41-reviewed/visual-ledger.json.gz --ledger picons/radio-world/staging/batch-42-reviewed/visual-ledger.json.gz --ledger "$stage/visual-ledger.json.gz" --index "$stage/countries.proposed.json" --production "$RUNNER_TEMP/production.json" --output "$stage/png-admission-proof.json"
          git add "$stage/downloader-proof.json" "$stage/production-preservation-proof.json" "$stage/png-admission-proof.json"
          git commit -m 'Verify batch 43-reviewed against stable Radio downloader [skip ci]'
          git push origin HEAD:refs/heads/work/radio-world-batch43-reviewed-history-20261107
