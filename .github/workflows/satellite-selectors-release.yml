name: PiconHub 0.1.43 satellite selector release
on:
  push:
    branches: [feature/satellite-selectors-20261104, main]
    paths: [.github/workflows/satellite-selectors-release.yml, docs/SATELLITE-SELECTORS-RELEASE.json, tools/test_satellite_backgrounds.py]
permissions:
  contents: read
concurrency:
  group: piconhub-satellite-selector-${{ github.ref }}
  cancel-in-progress: false
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /plugin/src/
            /plugin/tests/
            /plugin/tools/
            /plugin/update/
            /plugin/project.json
            /plugin/production.json
            /plugin/artwork/templates/picons/
            /picons/DAB/
            /picons/IPTV-SK-CZ/catalog/
            /picons/IPTV-SK-CZ/tools/
            /tools/
            /docs/
            /README.md
      - uses: actions/checkout@v4
        with:
          repository: Evolution-by-Warder/FullHDGlass-Warder-Evolution
          ref: 2cf0176d0cb98e726504b06d3d964d8fcb9fabc0
          path: .skin-source
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /source/package-root/usr/lib/enigma2/python/Plugins/Extensions/setupGlass17/plugin.py
            /source/package-root/usr/lib/enigma2/python/Plugins/Extensions/setupGlass17/warderPiconSync.py
      - uses: actions/setup-python@v5
        with:
          python-version: '3.9'
      - name: Test all native profiles, menus, packages and updater checks
        run: PYTHONPATH=plugin/src python -m unittest discover -s plugin/tests -v
      - name: Verify all satellite and provider backgrounds and both actual installers
        run: |
          python - <<'PYFETCH'
          import urllib.request
          from pathlib import Path
          Path('/tmp/satellite-manifest.json').write_bytes(urllib.request.urlopen('https://raw.githubusercontent.com/Evolution-by-Warder/FullHDGlass-Warder-Evolution/main/assets/warder/downloads/picons/channels/manifest.json').read())
          PYFETCH
          python tools/test_satellite_backgrounds.py --manifest /tmp/satellite-manifest.json --skin-root .skin-source --report reports/satellite-selectors-20261104/installation.json
      - name: Build identical complete IPKs twice
        run: |
          python plugin/tools/build_ipk.py --output plugin/build --revision "$GITHUB_SHA"
          cp plugin/build/enigma2-plugin-extensions-piconhub_0.1.43_all.ipk /tmp/first.ipk
          python plugin/tools/build_ipk.py --output plugin/build --revision "$GITHUB_SHA"
          cmp /tmp/first.ipk plugin/build/enigma2-plugin-extensions-piconhub_0.1.43_all.ipk
      - uses: actions/upload-artifact@v4
        with:
          name: piconhub-0.1.43-verified
          path: |
            plugin/build/*.ipk
            plugin/build/*.sha256
            reports/satellite-selectors-20261104/*.json
  publish:
    if: github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /plugin/
            /tools/publish-selector-release.py
            /docs/SATELLITE-SELECTORS-RELEASE.json
      - uses: actions/setup-python@v5
        with:
          python-version: '3.9'
      - uses: actions/download-artifact@v4
        with:
          name: piconhub-0.1.43-verified
          path: .release-artifacts
      - name: Place tested IPK at the configured path
        run: |
          mkdir -p plugin/build
          find .release-artifacts -name 'enigma2-plugin-extensions-piconhub_0.1.43_all.ipk' -exec cp '{}' plugin/build/ \;
      - name: Publish verified IPK and activate both stable feeds
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: python tools/publish-selector-release.py
      - uses: actions/upload-artifact@v4
        with:
          name: piconhub-0.1.43-production
          path: reports/satellite-selectors-20261104/production.json
