name: PiconHub 0.1.46 satellite selector release
on:
  push:
    branches: [main]
    paths: [.github/workflows/satellite-selectors-release.yml, docs/SATELLITE-SELECTORS-RELEASE.json, tools/test_satellite_backgrounds.py]
  pull_request:
    paths: [.github/workflows/satellite-selectors-release.yml, docs/SATELLITE-SELECTORS-RELEASE.json, plugin/src/**, plugin/tests/**, plugin/tools/**, plugin/update/**]
permissions:
  contents: read
concurrency:
  group: piconhub-satellite-selector-${{ github.ref }}
  cancel-in-progress: false
jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /plugin/src/
            /plugin/tests/
            /plugin/tools/
            /plugin/update/
            /plugin/project.json
            /plugin/production.json
            /plugin/artwork/templates/picons/
            /picons/DAB/
            /tools/
            /docs/
            /README.md
      - uses: actions/checkout@v4
        with:
          repository: Evolution-by-Warder/FullHDGlass-Warder-Evolution
          ref: 83793932914887e4c54724ff55b4c5d4f5002722
          path: .skin-source
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /source/package-root/usr/lib/enigma2/python/Plugins/Extensions/setupGlass17/plugin.py
            /source/package-root/usr/lib/enigma2/python/Plugins/Extensions/setupGlass17/warderPiconSync.py
            /tools/test_dtt_italia_clients.py
            /reports/dtt-italia-20261123/recipe.json
            /assets/warder/downloads/picons/channels/manifest.json
      - uses: actions/setup-python@v5
        with:
          python-version: '3.9'
      - name: Test all native profiles, menus, packages and updater checks
        run: PYTHONPATH=plugin/src python -m unittest discover -s plugin/tests -v
      - name: Verify all satellite and provider backgrounds and both actual installers
        run: |
          python tools/test_satellite_backgrounds.py --manifest .skin-source/assets/warder/downloads/picons/channels/manifest.json --skin-root .skin-source --report reports/piconhub-0.1.46-20261126/installation.json
      - name: Verify approved Italian catalogue and both installers
        run: |
          set -euo pipefail
          CHANNELS=assets/warder/downloads/picons/channels
          cmp ".skin-source/$CHANNELS/manifest.json" plugin/src/Plugins/Extensions/WarderPiconHub/data/channel-manifest.json
          python - <<'PYINDEX' > /tmp/italian-sparse-paths
          import json
          from pathlib import Path
          root = Path("assets/warder/downloads/picons/channels")
          packages = json.loads((Path(".skin-source") / root / "manifest.json").read_bytes())["packages"]
          for p in packages:
              if p["selector_id"] in {"DTT_ITALIA", "90E", "50W"}:
                  for url in p["parts"]:
                      print("/" + str(root / url.rsplit("/", 1)[-1]))
          PYINDEX
          git -C .skin-source sparse-checkout add --stdin < /tmp/italian-sparse-paths
          python .skin-source/tools/test_dtt_italia_clients.py --hub "$PWD" --channels ".skin-source/$CHANNELS" --report reports/piconhub-0.1.46-20261126/clients.json
      - name: Build identical complete IPKs twice
        run: |
          python plugin/tools/build_ipk.py --output plugin/build --revision "$GITHUB_SHA"
          cp plugin/build/enigma2-plugin-extensions-piconhub_0.1.46_all.ipk /tmp/first.ipk
          python plugin/tools/build_ipk.py --output plugin/build --revision "$GITHUB_SHA"
          cmp /tmp/first.ipk plugin/build/enigma2-plugin-extensions-piconhub_0.1.46_all.ipk
      - uses: actions/upload-artifact@v4
        with:
          name: piconhub-0.1.46-verified
          path: |
            plugin/build/*.ipk
            plugin/build/*.sha256
            reports/piconhub-0.1.46-20261126/*.json
  publish:
    if: github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /plugin/
            /tools/publish-selector-release.py
            /docs/SATELLITE-SELECTORS-RELEASE.json
      - uses: actions/setup-python@v5
        with:
          python-version: '3.9'
      - uses: actions/download-artifact@v4
        with:
          name: piconhub-0.1.46-verified
          path: .release-artifacts
      - name: Place tested IPK at the configured path
        run: |
          mkdir -p plugin/build
          find .release-artifacts -name 'enigma2-plugin-extensions-piconhub_0.1.46_all.ipk' -exec cp '{}' plugin/build/ \;
      - name: Publish verified IPK and activate both stable feeds
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: python tools/publish-selector-release.py
      - uses: actions/upload-artifact@v4
        with:
          name: piconhub-0.1.46-production
          path: reports/piconhub-0.1.46-20261126/production.json
