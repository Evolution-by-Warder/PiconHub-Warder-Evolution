# One-shot: inspect actual released CANAL+ SK/CZ ZIPs, then repair verified blank TV5MONDE *source* images only.
# Does not build IPKs or produce redundant ZIP archives. Main is changed only if a correction passes.
name: FastScan SK CZ production QA and safe source repair
on:
  push:
    branches: [audit/canal-fastscan-repair-20261117]
    paths:
      - .github/workflows/canal-fastscan-repair-20261117.yml
permissions:
  contents: write
concurrency:
  group: warder-canal-fastscan-20261117
  cancel-in-progress: false
jobs:
  verify-and-repair:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
          filter: blob:none
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /picons/23.5e/
            /.github/workflows/canal-fastscan-repair-20261117.yml
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install --quiet Pillow
      - name: Verify production ZIPs, FastScan service refs and safely repair blank source
        env:
          AUDIT_PAYLOAD: ""
        shell: bash
        run: |
          python - <<'PY'
          import os, base64, gzip
          code=gzip.decompress(base64.b64decode(os.environ['AUDIT_PAYLOAD']))
          if __import__('hashlib').sha256(code).hexdigest()!='3f81d55d4d4e11514389aab2115d9b6b9286b86a9148e4bf4764d7aede56f115':
              raise RuntimeError('Audit source checksum mismatch')
          context={'__name__':'__main__','__file__':'plugin/tools/canal_fastscan_repair_20261117.py'}
          exec(compile(code,'canal-fastscan-repair-20261117.py','exec'), context)
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: canal-fastscan-20261117-evidence
          path: reports/canal-fastscan-20261117/verification.json
          if-no-files-found: warn
          retention-days: 30
      - name: Publish verified corrections to source main (no IPK)
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "Warder verified picon repair"
          git config user.email "warder-picons@users.noreply.github.com"
          git add picons/23.5e/canal-plus-sk/transparent/1_0_1_1B03_3FE_1_C00000_0_0_0.png
          git add picons/23.5e/canal-plus-cz/transparent/1_0_1_1B03_3FE_1_C00000_0_0_0.png
          git add picons/23.5e/skylink/transparent/1_0_1_1B03_3FE_1_C00000_0_0_0.png
          git add reports/canal-fastscan-20261117/verification.json
          if git diff --cached --quiet; then
            echo 'No verified changes; production already covers all FastScan services. No commit and no new ZIP.'
            exit 0
          fi
          git diff --cached --check
          git commit -m 'Correct blank TV5MONDE source from verified production CANAL+ artwork'
          PATCH_SHA="$(git rev-parse HEAD)"
          git fetch origin main
          git switch -C canal-fastscan-approved origin/main
          git cherry-pick "$PATCH_SHA"
          git push origin HEAD:main
          echo "PUBLISHED_SOURCE_COMMIT=$(git rev-parse HEAD)"
