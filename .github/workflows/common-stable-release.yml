name: Common stable release PiconHub 0.1.40
on:
  push:
    branches: [release/common-stable-20261102]
permissions:
  contents: read
concurrency:
  group: common-stable-20261102
  cancel-in-progress: false
jobs:
  openpli:
    uses: ./.github/workflows/verify-openpli-compatibility.yml
  openatv:
    uses: ./.github/workflows/verify-openatv-compatibility.yml
  package:
    needs: [openpli, openatv]
    runs-on: ubuntu-latest
    timeout-minutes: 25
    permissions:
      contents: write
    env:
      PYTHONDONTWRITEBYTECODE: '1'
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.14'
      - name: Prepare authorized stable versions and history
        run: python compatibility/prepare-common-stable.py
      - name: Build stable IPK and execute shipped installation checks
        run: |
          python plugin/tools/build_ipk.py --output plugin/build --revision "$GITHUB_SHA"
          cp plugin/build/enigma2-plugin-extensions-piconhub_0.1.40_all.ipk /tmp/first-stable.ipk
          python plugin/tools/build_ipk.py --output plugin/build --revision "$GITHUB_SHA"
          cmp /tmp/first-stable.ipk plugin/build/enigma2-plugin-extensions-piconhub_0.1.40_all.ipk
          python compatibility/verify-packaged-install.py plugin/build/enigma2-plugin-extensions-piconhub_0.1.40_all.ipk --product piconhub --version 0.1.40 --report reports/common-stable/final-install.json
      - uses: actions/upload-artifact@v4
        with:
          name: PiconHub-0.1.40-final-package
          path: |
            plugin/build/enigma2-plugin-extensions-piconhub_0.1.40_all.ipk
            plugin/build/enigma2-plugin-extensions-piconhub_0.1.40_all.ipk.sha256
            reports/common-stable/*.json
          retention-days: 90
      - name: Publish immutable stable package
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          PACKAGE=plugin/build/enigma2-plugin-extensions-piconhub_0.1.40_all.ipk
          TAG=v0.1.40
          if gh release view "$TAG" >/dev/null 2>&1; then
            mkdir -p /tmp/immutable
            gh release download "$TAG" --pattern "$(basename "$PACKAGE")" --dir /tmp/immutable
            cmp "$PACKAGE" "/tmp/immutable/$(basename "$PACKAGE")"
          else
            gh release create "$TAG" "$PACKAGE" "$PACKAGE.sha256" --target "$GITHUB_SHA" --latest=false --title 'PiconHub 0.1.40' --notes-file docs/COMMON-STABLE-20261102.md
          fi
      - name: Verify public download, compare candidate runtime and stage production records
        run: python compatibility/activate-common-stable.py
      - name: Fast-forward main with release sources, records and verified feed
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          git fetch origin main
          EXPECTED=$(python -c 'import json; print(json.load(open("docs/COMMON-STABLE-20261102.json"))["expected_main"])')
          test "$(git rev-parse origin/main)" = "$EXPECTED"
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -u
          python - <<'PYADD'
          import subprocess
          paths=subprocess.check_output(['git','ls-files','--others','--exclude-standard','-z']).decode().split('\0')
          paths=[p for p in paths if p and not p.startswith(('upstream/','packages/test/','plugin/build/','plugin/dist/')) and p!='reports/common-stable/candidate.ipk']
          if paths:subprocess.run(['git','add','--']+paths,check=True)
          PYADD
          git commit -m 'Release PiconHub 0.1.40: verified common OpenPLi and OpenATV stable [skip ci]'
          git push origin HEAD:main
          gh release edit v0.1.40 --latest
