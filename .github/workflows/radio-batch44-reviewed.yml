          git fetch --depth=1 origin c9c734803e015b56436f2b0602445f46f3bef947
          git diff --exit-code c9c734803e015b56436f2b0602445f46f3bef947 -- picons/radio-world/catalog/countries.json 'picons/IPTV-*/catalog/release.json'
          git add "$stage/verification-proof.json" "$stage/production-preservation-proof.json" "$stage/candidate-preservation-proof.json" "$stage/png-admission-proof.json"
          git commit -m 'Verify staged batch82 admission and preservation inventories [skip ci]'
          git push origin HEAD:refs/heads/work/radio-world-batch38-contrast-pass1-history-20261107

      - name: Export verified build checkpoint
        id: checkpoint
        run: echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
  independent_readback:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.build.outputs.checkpoint }}
          sparse-checkout: |
            picons/radio-world/staging/batch-82-reviewed
      - uses: actions/checkout@v4
        with:
          repository: Evolution-by-Warder/Radio-Warder-Evolution
          ref: fe573248f3d9e0a8d21acf5696f44b4c02e6fdb7
          path: _radio
      - run: python3 -m pip install Pillow==13.0.0
      - name: Final actual GitHub ZIP audit and multipart downloader replay (legacy compatibility unchanged since80)
        run: |
          set -euo pipefail
          stage=picons/radio-world/staging/batch-82-reviewed
          python3 "$stage/helpers/independent_readback.py" "${{ needs.build.outputs.checkpoint }}" "$RUNNER_TEMP/http-cache"
          python3 "$stage/helpers/replay_downloader.py" --index "$stage/countries.proposed.json" --countries CH --radio _radio --cache "$RUNNER_TEMP/http-cache" --output "$stage/results/downloader-multipart-proof.json"
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add "$stage/results" "$stage/SHA256SUMS.txt"
          git commit -m 'PASS batch82 independent GitHub ZIP audit and multipart downloader; legacy80 proof retained [skip ci]'
          git push origin HEAD:refs/heads/work/radio-world-batch38-contrast-pass1-history-20261107
