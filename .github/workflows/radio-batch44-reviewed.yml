name: Radio batch46 verified staged additions
on:
  push:
    branches: [work/radio-world-batch38-contrast-pass1-history-20261107]
    paths: [.github/workflows/radio-batch44-reviewed.yml]
permissions:
  contents: write
concurrency:
  group: radio-batch46-existing-working-ref
  cancel-in-progress: false
jobs:
  build:
    if: github.ref == 'refs/heads/work/radio-world-batch38-contrast-pass1-history-20261107'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: |
            picons/radio-world/tools
            picons/radio-world/catalog
            picons/radio-world/staging
      - uses: actions/checkout@v4
        with:
          repository: Evolution-by-Warder/Radio-Warder-Evolution
          ref: b7384bfdb55621beaf183ca6d40e9dedacaecdb9
          path: _radio
      - run: python3 -m pip install Pillow==13.0.0
      - name: Verify source authority and previous candidate protection
        run: |
          set -euo pipefail
          stage=picons/radio-world/staging/batch-46-reviewed
          git fetch --depth=1 --no-tags origin 2db89afad0f414fe7c4b1a6a1a836382d47090d3
          python3 "$stage/helpers/verify46.py"
          python3 picons/radio-world/tools/visual_gate.py --ledger picons/radio-world/staging/source-ledger-reviewed-20261107/visual-ledger.json.gz --ledger picons/radio-world/staging/visual-review-34-36/decisions.json.gz --ledger picons/radio-world/staging/batch-39-reviewed/visual-ledger.json.gz --ledger picons/radio-world/staging/batch-40-reviewed/visual-ledger.json.gz --ledger picons/radio-world/staging/batch-41-reviewed/visual-ledger.json.gz --ledger picons/radio-world/staging/batch-42-reviewed/visual-ledger.json.gz --ledger picons/radio-world/staging/batch-43-reviewed/visual-ledger.json.gz --ledger picons/radio-world/staging/batch-44-reviewed/visual-ledger.json.gz --ledger picons/radio-world/staging/batch-45-reviewed/visual-ledger.json.gz --ledger picons/radio-world/staging/batch-46-reviewed/visual-ledger.json.gz --selection "$stage/selection.json.gz"
          git diff --exit-code 2db89afad0f414fe7c4b1a6a1a836382d47090d3 -- picons/radio-world/catalog/countries.json 'picons/IPTV-*/catalog/release.json'
      - name: Build only new country unions on existing payload ref
        run: python3 picons/radio-world/staging/batch-46-reviewed/helpers/build_existing_payload.py
      - name: Replay stable downloader and audit every prior approved PNG
        run: |
          set -euo pipefail
          stage=picons/radio-world/staging/batch-46-reviewed
          python3 picons/radio-world/tools/replay_downloader.py --index "$stage/countries.proposed.json" --countries all-available --output "$stage/downloader-proof.json" --radio _radio --cache "$RUNNER_TEMP/http-cache"
          curl --fail --retry 2 --location https://raw.githubusercontent.com/Evolution-by-Warder/PiconHub-Warder-Evolution/8180aa0df6e185efad120338bc53ca04bc5e492a/picons/radio-world/catalog/countries.json -o "$RUNNER_TEMP/production.json"
          python3 picons/radio-world/tools/audit_production_preservation.py --candidate "$stage/countries.proposed.json" --production "$RUNNER_TEMP/production.json" --output "$stage/production-preservation-proof.json"
          python3 "$stage/helpers/audit_candidate_preservation.py" --baseline "$stage/baseline.previous.json" --candidate "$stage/countries.proposed.json" --baseline-commit 9d5a3c4de8e5300dbcc485230ad11df588d7bdc8 --baseline-sha256 b921b0942816557ff7eed43348a0b17ebfcd5bcdedf580f3e50d4c34d05040c7 --expected-references 3111 --expected-pngs 28575 --output "$stage/candidate-preservation-proof.json"
          python3 picons/radio-world/tools/visual_gate.py --ledger picons/radio-world/staging/source-ledger-reviewed-20261107/visual-ledger.json.gz --ledger picons/radio-world/staging/visual-review-34-36/decisions.json.gz --ledger picons/radio-world/staging/batch-39-reviewed/visual-ledger.json.gz --ledger picons/radio-world/staging/batch-40-reviewed/visual-ledger.json.gz --ledger picons/radio-world/staging/batch-41-reviewed/visual-ledger.json.gz --ledger picons/radio-world/staging/batch-42-reviewed/visual-ledger.json.gz --ledger picons/radio-world/staging/batch-43-reviewed/visual-ledger.json.gz --ledger picons/radio-world/staging/batch-44-reviewed/visual-ledger.json.gz --ledger picons/radio-world/staging/batch-45-reviewed/visual-ledger.json.gz --ledger picons/radio-world/staging/batch-46-reviewed/visual-ledger.json.gz --index "$stage/countries.proposed.json" --selection "$stage/selection.json.gz"
          python3 picons/radio-world/tools/audit_png_admission.py --ledger picons/radio-world/staging/source-ledger-reviewed-20261107/visual-ledger.json.gz --ledger picons/radio-world/staging/visual-review-34-36/decisions.json.gz --ledger picons/radio-world/staging/batch-39-reviewed/visual-ledger.json.gz --ledger picons/radio-world/staging/batch-40-reviewed/visual-ledger.json.gz --ledger picons/radio-world/staging/batch-41-reviewed/visual-ledger.json.gz --ledger picons/radio-world/staging/batch-42-reviewed/visual-ledger.json.gz --ledger picons/radio-world/staging/batch-43-reviewed/visual-ledger.json.gz --ledger picons/radio-world/staging/batch-44-reviewed/visual-ledger.json.gz --ledger picons/radio-world/staging/batch-45-reviewed/visual-ledger.json.gz --ledger picons/radio-world/staging/batch-46-reviewed/visual-ledger.json.gz --index "$stage/countries.proposed.json" --production "$RUNNER_TEMP/production.json" --output "$stage/png-admission-proof.json"
          git diff --exit-code 2db89afad0f414fe7c4b1a6a1a836382d47090d3 -- picons/radio-world/catalog/countries.json 'picons/IPTV-*/catalog/release.json'
          git add "$stage/verification-proof.json" "$stage/downloader-proof.json" "$stage/production-preservation-proof.json" "$stage/candidate-preservation-proof.json" "$stage/png-admission-proof.json"
          git commit -m 'Verify staged batch46 with stable downloader and all prior PNGs [skip ci]'
          git push origin HEAD:refs/heads/work/radio-world-batch38-contrast-pass1-history-20261107
