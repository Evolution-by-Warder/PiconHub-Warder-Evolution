          python3 picons/radio-world/tools/audit_png_admission.py --ledger picons/radio-world/staging/source-ledger-reviewed-20261107/visual-ledger.json.gz --ledger picons/radio-world/staging/visual-review-34-36/decisions.json.gz --ledger picons/radio-world/staging/batch-39-reviewed/visual-ledger.json.gz --ledger picons/radio-world/staging/batch-40-reviewed/visual-ledger.json.gz --ledger picons/radio-world/staging/batch-41-reviewed/visual-ledger.json.gz --ledger picons/radio-world/staging/batch-42-reviewed/visual-ledger.json.gz --ledger picons/radio-world/staging/batch-43-reviewed/visual-ledger.json.gz --ledger picons/radio-world/staging/batch-44-reviewed/visual-ledger.json.gz --ledger picons/radio-world/staging/batch-45-reviewed/visual-ledger.json.gz --ledger picons/radio-world/staging/batch-46-reviewed/visual-ledger.json.gz --ledger picons/radio-world/staging/batch-47-reviewed/visual-ledger.json.gz --ledger picons/radio-world/staging/batch-48-reviewed/visual-ledger.json.gz --ledger picons/radio-world/staging/batch-49-reviewed/visual-ledger.json.gz --ledger picons/radio-world/staging/batch-50-reviewed/visual-ledger.json.gz --ledger picons/radio-world/staging/batch-51-reviewed/visual-ledger.json.gz --ledger picons/radio-world/staging/batch-52-reviewed/visual-ledger.json.gz --ledger picons/radio-world/staging/batch-53-reviewed/visual-ledger.json.gz --ledger picons/radio-world/staging/batch-54-reviewed/visual-ledger.json.gz --ledger picons/radio-world/staging/batch-55-reviewed/visual-ledger.json.gz --ledger picons/radio-world/staging/batch-56-reviewed/visual-ledger.json.gz --ledger picons/radio-world/staging/batch-57-reviewed/visual-ledger.json.gz --ledger picons/radio-world/staging/batch-58-reviewed/visual-ledger.json.gz --ledger picons/radio-world/staging/batch-59-reviewed/visual-ledger.json.gz --ledger picons/radio-world/staging/batch-60-reviewed/visual-ledger.json.gz --ledger picons/radio-world/staging/batch-61-reviewed/visual-ledger.json.gz --ledger picons/radio-