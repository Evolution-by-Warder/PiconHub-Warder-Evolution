name: Radio batch72 verified aliases and independent readback
on:
  push:
    branches: [work/radio-world-batch38-contrast-pass1-history-20261107]
    paths: [.github/workflows/radio-batch44-reviewed.yml]
permissions:
  contents: write
concurrency:
  group: radio-batch72-existing-working-ref
  cancel-in-progress: false
jobs:
  build:
    if: github.ref == 'refs/heads/work/radio-world-batch38-contrast-pass1-history-20261107'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    outputs:
      checkpoint: ${{ steps.checkpoint.outputs.sha }}
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: |
            picons/radio-world/tools
            picons/radio-world/catalog
            picons/radio-world/staging
      - uses: actions/checkout@v4
        with:
          repository: Evolution-by-Warder/Radio-Warder-Evolution
          ref: b7384bfdb55621beaf183ca6d40e9dedacaecdb9
          path: _radio
      - run: python3 -m pip install Pillow==13.0.0
      - name: Replay stable downloader and audit every prior approved PNG
        run: |
          set -euo pipefail
          stage=picons/radio-world/staging/batch-72-reviewed
          python3 picons/radio-world/tools/replay_downloader.py --index "$stage/countries.proposed.json" --countries CO --output "$stage/downloader-proof.json" --radio _radio --cache "$RUNNER_TEMP/http-cache"
          curl --fail --retry 2 --location https://raw.githubusercontent.com/Evolution-by-Warder/PiconHub-Warder-Evolution/59ec70708d4d05a28f17c741742c78451d4fc45b/picons/radio-world/catalog/countries.json -o "$RUNNER_TEMP/production.json"
          python3 "$stage/helpers/audit_candidate_preservation.py" --baseline "$RUNNER_TEMP/production.json" --candidate "$stage/countries.proposed.json" --baseline-commit 59ec70708d4d05a28f17c741742c78451d4fc45b --baseline-sha256 a70036892456d105ae2844a715f462eac1b87aef16769c57c7a9699b1cfac2b1 --expected-references 3417 --expected-pngs 31329 --output "$stage/production-preservation-proof.json"
          curl --fail --retry 2 --location https://raw.githubusercontent.com/Evolution-by-Warder/PiconHub-Warder-Evolution/8180aa0df6e185efad120338bc53ca04bc5e492a/picons/radio-world/catalog/countries.json -o "$RUNNER_TEMP/legacy-production.json"
          python3 "$stage/helpers/audit_candidate_preservation.py" --baseline "$stage/baseline.previous.json" --candidate "$stage/countries.proposed.json" --baseline-commit 4285f89879819b3195a18fe94c69581d4091a38f --baseline-sha256 a70036892456d105ae2844a715f462eac1b87aef16769c57c7a9699b1cfac2b1 --expected-references 3417 --expected-pngs 31329 --output "$stage/candidate-preservation-proof.json"
          python3 picons/radio-world/tools/visual_gate.py --ledger picons/radio-world/staging/source-ledger-reviewed-20261107/visual-ledger.json.gz --ledger picons/radio-world/staging/visual-review-34-36/decisions.json.gz --ledger picons/radio-world/staging/batch-39-reviewed/visual-ledger.json.gz --ledger picons/radio-world/staging/batch-40-reviewed/visual-ledger.json.gz --ledger picons/radio-world/staging/batch-41-reviewed/visual-ledger.json.gz --ledger picons/radio-world/staging/batch-42-reviewed/visual-ledger.json.gz --ledger picons/radio-world/staging/batch-43-reviewed/visual-ledger.json.gz --ledger picons/radio-world/staging/batch-44-reviewed/visual-ledger.json.gz --ledger picons/radio-world/staging/batch-45-reviewed/visual-ledger.json.gz --ledger picons/radio-world/staging/batch-46-reviewed/visual-ledger.json.gz --ledger picons/radio-world/staging/batch-47-reviewed/visual-ledger.json.gz --ledger picons/radio-world/staging/batch-48-reviewed/visual-ledger.json.gz --ledger picons/radio-world/staging/batch-49-reviewed/visual-ledger.json.gz --ledger picons/radio-world/staging/batch-50-reviewed/visual-ledger.json.gz --ledger picons/radio-world/staging/batch-51-reviewed/visual-ledger.json.gz --ledger picons/radio-world/staging/batch-52-reviewed/visual-ledger.json.gz --ledger picons/radio-world/staging/batch-53-reviewed/visual-ledger.json.gz --ledger picons/radio-world/staging/batch-54-reviewed/visual-ledger.json.gz --ledger picons/radio-world/staging/batch-55-reviewed/visual-ledger.json.gz --ledger picons/radio-world/staging/batch-56-reviewed/visual-ledger.json.gz --ledger picons/radio-world/staging/batch-57-reviewed/visual-ledger.json.gz --ledger picons/radio-world/staging/batch-58-reviewed/visual-ledger.json.gz --ledger picons/radio-world/staging/batch-59-reviewed/visual-ledger.json.gz --ledger picons/radio-world/staging/batch-60-reviewed/visual-ledger.json.gz --ledger picons/radio-world/staging/batch-61-reviewed/visual-ledger.json.gz --ledger picons/radio-world/staging/batch-62-reviewed/visual-ledger.json.gz --ledger picons/radio-world/staging/batch-63-reviewed/visual-ledger.json.gz --ledger picons/radio-world/staging/batch-64-reviewed/visual-ledger.json.gz --ledger picons/radio-world/staging/batch-65-reviewed/visual-ledger.json.gz --ledger picons/radio-world/staging/batch-66-reviewed/visual-ledger.json.gz --ledger picons/radio-world/staging/batch-67-reviewed/visual-ledger.json.gz --ledger picons/radio-world/staging/batch-68-reviewed/visual-ledger.json.gz --ledger picons/radio-world/staging/batch-69-reviewed/visual-ledger.json.gz --ledger picons/radio-world/staging/batch-70-reviewed/visual-ledger.json.gz --ledger picons/radio-world/staging/batch-71-reviewed/visual-ledger.json.gz --ledger picons/radio-world/staging/batch-72-reviewed/visual-ledger.json.gz --index "$stage/countries.proposed.json" --selection "$stage/selection.json.gz"
          python3 picons/radio-world/tools/audit_png_admission.py --ledger picons/radio-world/staging/source-ledger-reviewed-20261107/visual-ledger.json.gz --ledger picons/radio-world/staging/visual-review-34-36/decisions.json.gz --ledger picons/radio-world/staging/batch-39-reviewed/visual-ledger.json.gz --ledger picons/radio-world/staging/batch-40-reviewed/visual-ledger.json.gz --ledger picons/radio-world/staging/batch-41-reviewed/visual-ledger.json.gz --ledger picons/radio-world/staging/batch-42-reviewed/visual-ledger.json.gz --ledger picons/radio-world/staging/batch-43-reviewed/visual-ledger.json.gz --ledger picons/radio-world/staging/batch-44-reviewed/visual-ledger.json.gz --ledger picons/radio-world/staging/batch-45-reviewed/visual-ledger.json.gz --ledger picons/radio-world/staging/batch-46-reviewed/visual-ledger.json.gz --ledger picons/radio-world/staging/batch-47-reviewed/visual-ledger.json.gz --ledger picons/radio-world/staging/batch-48-reviewed/visual-ledger.json.gz --ledger picons/radio-world/staging/batch-49-reviewed/visual-ledger.json.gz --ledger picons/radio-world/staging/batch-50-reviewed/visual-ledger.json.gz --ledger picons/radio-world/staging/batch-51-reviewed/visual-ledger.json.gz --ledger picons/radio-world/staging/batch-52-reviewed/visual-ledger.json.gz --ledger picons/radio-world/staging/batch-53-reviewed/visual-ledger.json.gz --ledger picons/radio-world/staging/batch-54-reviewed/visual-ledger.json.gz --ledger picons/radio-world/staging/batch-55-reviewed/visual-ledger.json.gz --ledger picons/radio-world/staging/batch-56-reviewed/visual-ledger.json.gz --ledger picons/radio-world/staging/batch-57-reviewed/visual-ledger.json.gz --ledger picons/radio-world/staging/batch-58-reviewed/visual-ledger.json.gz --ledger picons/radio-world/staging/batch-59-reviewed/visual-ledger.json.gz --ledger picons/radio-world/staging/batch-60-reviewed/visual-ledger.json.gz --ledger picons/radio-world/staging/batch-61-reviewed/visual-ledger.json.gz --ledger picons/radio-world/staging/batch-62-reviewed/visual-ledger.json.gz --ledger picons/radio-world/staging/batch-63-reviewed/visual-ledger.json.gz --ledger picons/radio-world/staging/batch-64-reviewed/visual-ledger.json.gz --ledger picons/radio-world/staging/batch-65-reviewed/visual-ledger.json.gz --ledger picons/radio-world/staging/batch-66-reviewed/visual-ledger.json.gz --ledger picons/radio-world/staging/batch-67-reviewed/visual-ledger.json.gz --ledger picons/radio-world/staging/batch-68-reviewed/visual-ledger.json.gz --ledger picons/radio-world/staging/batch-69-reviewed/visual-ledger.json.gz --ledger picons/radio-world/staging/batch-70-reviewed/visual-ledger.json.gz --ledger picons/radio-world/staging/batch-71-reviewed/visual-ledger.json.gz --ledger picons/radio-world/staging/batch-72-reviewed/visual-ledger.json.gz --index "$stage/countries.proposed.json" --production "$RUNNER_TEMP/legacy-production.json" --output "$stage/png-admission-proof.json"
          git diff --exit-code 4285f89879819b3195a18fe94c69581d4091a38f -- picons/radio-world/catalog/countries.json 'picons/IPTV-*/catalog/release.json'
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add "$stage/verification-proof.json" "$stage/downloader-proof.json" "$stage/production-preservation-proof.json" "$stage/candidate-preservation-proof.json" "$stage/png-admission-proof.json"
          git commit -m 'Verify staged batch72 with stable downloader and all prior PNGs [skip ci]'
          git push origin HEAD:refs/heads/work/radio-world-batch38-contrast-pass1-history-20261107

      - name: Export verified build checkpoint
        id: checkpoint
        run: echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
  independent_readback:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.build.outputs.checkpoint }}
          sparse-checkout: |
            picons/radio-world/staging/batch-72-reviewed
      - run: python3 -m pip install Pillow==13.0.0
      - name: Download every new ZIP on an independent runner
        run: |
          set -euo pipefail
          stage=picons/radio-world/staging/batch-72-reviewed
          python3 "$stage/helpers/independent_readback.py" 72 "${{ needs.build.outputs.checkpoint }}"
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add "$stage/results/independent-postwrite-audit.json" "$stage/SHA256SUMS.txt"
          git commit -m 'Verify batch72 independent9 ZIP readback and preserved PNG bytes [skip ci]'
          git push origin HEAD:refs/heads/work/radio-world-batch38-contrast-pass1-history-20261107
