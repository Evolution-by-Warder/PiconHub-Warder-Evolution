name: Radio batch64 verified aliases and independent readback
on:
  push:
    branches: [work/radio-world-batch38-contrast-pass1-history-20261107]
    paths: [.github/workflows/radio-batch44-reviewed.yml]
permissions:
  contents: write
concurrency:
  group: radio-batch64-existing-working-ref
  cancel-in-progress: false
jobs:
  build:
    runs-on: ubuntu-latest
    outputs:
      checkpoint: ${{ github.sha }}
    steps:
      - run: echo 'Existing batch64 payload retained; only failed final aggregate audit is retried.'
  independent_readback:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.build.outputs.checkpoint }}
          sparse-checkout: |
            picons/radio-world/staging/batch-64-reviewed
      - run: python3 -m pip install Pillow==13.0.0
      - name: Download every new ZIP on an independent runner
        run: |
          set -euo pipefail
          stage=picons/radio-world/staging/batch-64-reviewed
          python3 "$stage/helpers/independent_readback.py" 64 "${{ needs.build.outputs.checkpoint }}"
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add "$stage/results/independent-postwrite-audit.json" "$stage/SHA256SUMS.txt"
          git commit -m 'Verify batch64 independent45 ZIP readback and preserved PNG bytes [skip ci]'
          git push origin HEAD:refs/heads/work/radio-world-batch38-contrast-pass1-history-20261107
