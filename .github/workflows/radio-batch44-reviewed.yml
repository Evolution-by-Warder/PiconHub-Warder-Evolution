name: Radio batch82 20 official1.FM Swiss references; multipart publication and independent audit
on:
  push:
    branches: [work/radio-world-batch38-contrast-pass1-history-20261107]
    paths: [.github/workflows/radio-batch44-reviewed.yml]
permissions:
  contents: write
concurrency:
  group: radio-batch82-existing-working-ref
  cancel-in-progress: false
jobs:
  build:
    if: github.ref == 'refs/heads/work/radio-world-batch38-contrast-pass1-history-20261107'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    outputs:
      checkpoint: ${{ steps.checkpoint.outputs.sha }}
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: |
            picons/radio-world/tools
            picons/radio-world/catalog
            picons/radio-world/staging
      - uses: actions/checkout@v4
        with:
          repository: Evolution-by-Warder/Radio-Warder-Evolution
          ref: fe573248f3d9e0a8d21acf5696f44b4c02e6fdb7
          path: _radio
      - run: python3 -m pip install Pillow==13.0.0
      - name: Save verified unchanged inputs before packaging
        run: |
          set -euo pipefail
          stage=picons/radio-world/staging/batch-82-reviewed
          python3 "$stage/helpers/prepare_inputs.py"
      - name: Build only new country unions on existing payload ref
        run: python3 picons/radio-world/staging/batch-82-reviewed/helpers/build_existing_payload.py
      - name: Verify admission and preservation against existing inventories
        run: |
          set -euo pipefail
          stage=picons/radio-world/staging/batch-82-reviewed
          curl --fail --retry 2 --location https://raw.githubusercontent.com/Evolution-by-Warder/PiconHub-Warder-Evolution/8180aa0df6e185efad120338bc53ca04bc5e492a/picons/radio-world/catalog/countries.json -o "$RUNNER_TEMP/production.json"
          curl --fail --retry 2 --location https://raw.githubusercontent.com/Evolution-by-Warder/PiconHub-Warder-Evolution/59ec70708d4d05a28f17c741742c78451d4fc45b/picons/radio-world/catalog/countries.json -o "$RUNNER_TEMP/current-production.json"
          python3 "$stage/helpers/audit_candidate_preservation.py" --baseline "$RUNNER_TEMP/current-production.json" --candidate "$stage/countries.proposed.json" --baseline-commit 59ec70708d4d05a28f17c741742c78451d4fc45b --baseline-sha256 a70036892456d105ae2844a715f462eac1b87aef16769c57c7a9699b1cfac2b1 --expected-references 3417 --expected-pngs 31329 --output "$stage/production-preservation-proof.json"
          python3 "$stage/helpers/audit_candidate_preservation.py" --baseline "$stage/baseline.previous.json" --candidate "$stage/countries.proposed.json" --baseline-commit c9c734803e015b56436f2b0602445f46f3bef947 --baseline-sha256 $(sha256sum "$stage/baseline.previous.json" | cut -d " " -f 1) --expected-references 3484 --expected-pngs 31932 --output "$stage/candidate-preservation-proof.json"
