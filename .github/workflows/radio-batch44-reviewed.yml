name: Radio batch 98 - recover draft packages and audit
on:
  push:
    branches: [work/radio-world-batch38-contrast-pass1-history-20261107]
    paths: [.github/workflows/radio-batch44-reviewed.yml]
permissions:
  contents: write
concurrency:
  group: radio-reviewed-working-ref
  cancel-in-progress: false
env:
  BATCH: "98"
  STAGE: picons/radio-world/staging/batch-98-reviewed
  PARENT: "3465fbe143564432fdfc8c68ac33df7e11f044b0"
jobs:
  build:
    if: github.ref == 'refs/heads/work/radio-world-batch38-contrast-pass1-history-20261107'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    outputs:
      checkpoint: ${{ steps.checkpoint.outputs.sha }}
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: |
            picons/radio-world/tools
            picons/radio-world/catalog
            picons/radio-world/staging
      - run: python3 -m pip install Pillow==13.0.0
      - name: Verify source bindings and save reviewed PNGs
        run: python3 "$STAGE/helpers/prepare_inputs.py" "$BATCH"
      - name: Save new country ZIPs and manifests on the payload branch
        run: python3 "$STAGE/helpers/build_existing_payload.py"
      - name: Check prior approved inventories and admission
        run: |
          set -euo pipefail
          url=https://raw.githubusercontent.com/Evolution-by-Warder/PiconHub-Warder-Evolution
          curl --fail --retry 2 "$url/8180aa0df6e185efad120338bc53ca04bc5e492a/picons/radio-world/catalog/countries.json" -o "$RUNNER_TEMP/production.json"
          curl --fail --retry 2 "$url/59ec70708d4d05a28f17c741742c78451d4fc45b/picons/radio-world/catalog/countries.json" -o "$RUNNER_TEMP/current-production.json"
          python3 "$STAGE/helpers/audit_candidate_preservation.py" --baseline "$RUNNER_TEMP/current-production.json" --candidate "$STAGE/countries.proposed.json" --baseline-commit 59ec70708d4d05a28f17c741742c78451d4fc45b --baseline-sha256 a70036892456d105ae2844a715f462eac1b87aef16769c57c7a9699b1cfac2b1 --expected-references 3417 --expected-pngs 31329 --output "$STAGE/production-preservation-proof.json"
          python3 "$STAGE/helpers/audit_candidate_preservation.py" --baseline "$STAGE/baseline.previous.json" --candidate "$STAGE/countries.proposed.json" --baseline-commit "$PARENT" --baseline-sha256 "e963ca02a3647bf2188f88447116e8bb757e16ab5fdebe06ef516760801947a2" --expected-references 4056 --expected-pngs 37080 --output "$STAGE/candidate-preservation-proof.json"
          ledgers=(--ledger picons/radio-world/staging/source-ledger-reviewed-20261107/visual-ledger.json.gz --ledger picons/radio-world/staging/visual-review-34-36/decisions.json.gz)
          for ((i=39; i<=BATCH; i++)); do
            ledgers+=(--ledger "picons/radio-world/staging/batch-$i-reviewed/visual-ledger.json.gz")
          done
          python3 picons/radio-world/tools/visual_gate.py "${ledgers[@]}" --selection "$STAGE/selection.json.gz" --index "$STAGE/countries.proposed.json"
          python3 picons/radio-world/tools/audit_png_admission.py "${ledgers[@]}" --production "$RUNNER_TEMP/production.json" --index "$STAGE/countries.proposed.json" --output "$STAGE/png-admission-proof.json"
          git fetch --depth=1 origin "$PARENT"
          git diff --exit-code "$PARENT" -- picons/radio-world/catalog/countries.json 'picons/IPTV-*/catalog/release.json'
          git add "$STAGE/"*proof.json
          git commit -m "Verify batch $BATCH admission and preservation [skip ci]"
          git push origin HEAD:refs/heads/work/radio-world-batch38-contrast-pass1-history-20261107
      - id: checkpoint
        run: echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
  independent_readback:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.build.outputs.checkpoint }}
          sparse-checkout: picons/radio-world/staging/batch-98-reviewed
      - uses: actions/checkout@v4
        with:
          repository: Evolution-by-Warder/Radio-Warder-Evolution
          ref: fe573248f3d9e0a8d21acf5696f44b4c02e6fdb7
          path: _radio
      - run: python3 -m pip install Pillow==13.0.0
      - name: Audit actual GitHub ZIPs and replay existing downloader
        env:
          BUILD_CHECKPOINT: ${{ needs.build.outputs.checkpoint }}
        run: |
          set -euo pipefail
          python3 "$STAGE/helpers/independent_readback.py" "$BATCH" "$BUILD_CHECKPOINT" "$RUNNER_TEMP/http-cache"
          mapfile -t countries < <(python3 -c 'import json, sys; print("\n".join(sorted({entry["country"] for entry in json.load(open(sys.argv[1]))["archives"]})))' "$STAGE/results/independent-postwrite-audit.json")
          python3 "$STAGE/helpers/replay_downloader.py" --index "$STAGE/countries.proposed.json" --countries "${countries[@]}" --radio _radio --cache "$RUNNER_TEMP/http-cache" --output "$STAGE/results/downloader-multipart-proof.json"
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add "$STAGE/results" "$STAGE/SHA256SUMS.txt"
          git commit -m "PASS batch $BATCH GitHub ZIP audit and downloader replay [skip ci]"
          git push origin HEAD:refs/heads/work/radio-world-batch38-contrast-pass1-history-20261107
