name: Radio batch71 verified aliases and independent readback
on:
  push:
    branches: [work/radio-world-batch38-contrast-pass1-history-20261107]
    paths: [.github/workflows/radio-batch44-reviewed.yml]
permissions:
  contents: write
concurrency:
  group: radio-batch71-existing-working-ref
  cancel-in-progress: false
jobs:
  build:
    if: github.ref == 'refs/heads/work/radio-world-batch38-contrast-pass1-history-20261107'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    outputs:
      checkpoint: ${{ steps.checkpoint.outputs.sha }}
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: |
            picons/radio-world/tools
            picons/radio-world/catalog
            picons/radio-world/staging
      - uses: actions/checkout@v4
        with:
          repository: Evolution-by-Warder/Radio-Warder-Evolution
          ref: b7384bfdb55621beaf183ca6d40e9dedacaecdb9
          path: _radio
      - run: python3 -m pip install Pillow==13.0.0
      - name: Resume saved and verified batch71 inputs
        run: test -f picons/radio-world/staging/batch-71-reviewed/source-readback-proof.json
      - name: Build only new country unions on existing payload ref
        run: python3 picons/radio-world/staging/batch-71-reviewed/helpers/build_existing_payload.py
      - name: Replay stable downloader and audit every prior approved PNG
        run: |
          set -euo pipefail
          stage=picons/radio-world/staging/batch-71-reviewed
          python3 picons/radio-world/tools/replay_downloader.py --index "$stage/countries.proposed.json" --countries GH GR ZA --output "$stage/downloader-proof.json" --radio _radio --cache "$RUNNER_TEMP/http-cache"
          curl --fail --retry 2 --location https://raw.githubusercontent.com/Evolution-by-Warder/PiconHub-Warder-Evolution/8180aa0df6e185efad120338bc53ca04bc5e492a/picons/radio-world/catalog/countries.json -o "$RUNNER_TEMP/production.json"
          python3 picons/radio-world/tools/audit_production_preservation.py --candidate "$stage/countries.proposed.json" --production "$RUNNER_TEMP/production.json" --output "$stage/production-preservation-proof.json"
          python3 "$stage/helpers/audit_candidate_preservation.py" --baseline "$stage/baseline.previous.json" --candidate "$stage/countries.proposed.json" --baseline-commit 59380d8ad18b6d97aac79ce4a52892611a95a57e --baseline-sha256 c1369ab91b7dc4b062c4b27bce765c6a4a0be8ac6ad5502ff9d68248e70d7ab6 --expected-references 3412 --expected-pngs 31284 --output "$stage/candidate-preservation-proof.json"
          python3 picons/radio-world/tools/visual_gate.py --ledger picons/radio-world/staging/source-ledger-reviewed-20261107/visual-ledger.json.gz --ledger picons/radio-world/staging/visual-review-34-36/decisions.json.gz --ledger picons/radio-world/staging/batch-39-reviewed/visual-ledger.json.gz --ledger picons/radio-world/staging/batch-40-reviewed/visual-ledger.json.gz --ledger picons/radio-world/staging/batch-41-reviewed/visual-ledger.json.gz --ledger picons/radio-world/staging/batch-42-reviewed/visual-ledger.json.gz --ledger picons/radio-world/staging/batch-43-reviewed/visual-ledger.json.gz --ledger picons/radio-world/staging/batch-44-reviewed/visual-ledger.json.gz --ledger picons/radio-world/staging/batch-45-reviewed/visual-ledger.json.gz --ledger picons/radio-world/staging/batch-46-reviewed/visual-ledger.json.gz --ledger picons/radio-world/staging/batch-47-reviewed/visual-ledger.json.gz --ledger picons/radio-world/staging/batch-48-reviewed/visual-ledger.json.gz --ledger picons/radio-world/staging/batch-49-reviewed/visual-ledger.json.gz --ledger picons/radio-world/staging/batch-50-reviewed/visual-ledger.json.gz --ledger picons/radio-world/staging/batch-51-reviewed/visual-ledger.json.gz --ledger picons/radio-world/staging/batch-52-reviewed/visual-ledger.json.gz --ledger picons/radio-world/staging/batch-53-reviewed/visual-ledger.json.gz --ledger picons/radio-world/staging/batch-54-reviewed/visual-ledger.json.gz --ledger picons/radio-world/staging/batch-55-reviewed/visual-ledger.json.gz --ledger picons/radio-world/staging/batch-56-reviewed/visual-ledger.json.gz --ledger picons/radio-world/staging/batch-57-reviewed/visual-ledger.json.gz --ledger picons/radio-world/staging/batch-58-reviewed/visual-ledger.json.gz --ledger picons/radio-world/staging/batch-59-reviewed/visual-ledger.json.gz --ledger picons/radio-world/staging/batch-60-reviewed/visual-ledger.json.gz --ledger picons/radio-world/staging/batch-61-reviewed/visual-ledger.json.gz --ledger picons/radio-world/staging/batch-62-reviewed/visual-ledger.json.gz --ledger picons/radio-world/staging/batch-63-reviewed/visual-ledger.json.gz --ledger picons/radio-world/staging/batch-64-reviewed/visual-ledger.json.gz --ledger picons/radio-world/staging/batch-65-reviewed/visual-ledger.json.gz --ledger picons/radio-world/staging/batch-66-reviewed/visual-ledger.json.gz --ledger picons/radio-world/staging/batch-67-reviewed/visual-ledger.json.gz --ledger picons/radio-world/staging/batch-68-reviewed/visual-ledger.json.gz --ledger picons/radio-world/staging/batch-69-reviewed/visual-ledger.json.gz --ledger picons/radio-world/staging/batch-70-reviewed/visual-ledger.json.gz --ledger picons/radio-world/staging/batch-71-reviewed/visual-ledger.json.gz --index "$stage/countries.proposed.json" --selection "$stage/selection.json.gz"
          python3 picons/radio-world/tools/audit_png_admission.py --ledger picons/radio-world/staging/source-ledger-reviewed-20261107/visual-ledger.json.gz --ledger picons/radio-world/staging/visual-review-34-36/decisions.json.gz --ledger picons/radio-world/staging/batch-39-reviewed/visual-ledger.json.gz --ledger picons/radio-world/staging/batch-40-reviewed/visual-ledger.json.gz --ledger picons/radio-world/staging/batch-41-reviewed/visual-ledger.json.gz --ledger picons/radio-world/staging/batch-42-reviewed/visual-ledger.json.gz --ledger picons/radio-world/staging/batch-43-reviewed/visual-ledger.json.gz --ledger picons/radio-world/staging/batch-44-reviewed/visual-ledger.json.gz --ledger picons/radio-world/staging/batch-45-reviewed/visual-ledger.json.gz --ledger picons/radio-world/staging/batch-46-reviewed/visual-ledger.json.gz --ledger picons/radio-world/staging/batch-47-reviewed/visual-ledger.json.gz --ledger picons/radio-world/staging/batch-48-reviewed/visual-ledger.json.gz --ledger picons/radio-world/staging/batch-49-reviewed/visual-ledger.json.gz --ledger picons/radio-world/staging/batch-50-reviewed/visual-ledger.json.gz --ledger picons/radio-world/staging/batch-51-reviewed/visual-ledger.json.gz --ledger picons/radio-world/staging/batch-52-reviewed/visual-ledger.json.gz --ledger picons/radio-world/staging/batch-53-reviewed/visual-ledger.json.gz --ledger picons/radio-world/staging/batch-54-reviewed/visual-ledger.json.gz --ledger picons/radio-world/staging/batch-55-reviewed/visual-ledger.json.gz --ledger picons/radio-world/staging/batch-56-reviewed/visual-ledger.json.gz --ledger picons/radio-world/staging/batch-57-reviewed/visual-ledger.json.gz --ledger picons/radio-world/staging/batch-58-reviewed/visual-ledger.json.gz --ledger picons/radio-world/staging/batch-59-reviewed/visual-ledger.json.gz --ledger picons/radio-world/staging/batch-60-reviewed/visual-ledger.json.gz --ledger picons/radio-world/staging/batch-61-reviewed/visual-ledger.json.gz --ledger picons/radio-world/staging/batch-62-reviewed/visual-ledger.json.gz --ledger picons/radio-world/staging/batch-63-reviewed/visual-ledger.json.gz --ledger picons/radio-world/staging/batch-64-reviewed/visual-ledger.json.gz --ledger picons/radio-world/staging/batch-65-reviewed/visual-ledger.json.gz --ledger picons/radio-world/staging/batch-66-reviewed/visual-ledger.json.gz --ledger picons/radio-world/staging/batch-67-reviewed/visual-ledger.json.gz --ledger picons/radio-world/staging/batch-68-reviewed/visual-ledger.json.gz --ledger picons/radio-world/staging/batch-69-reviewed/visual-ledger.json.gz --ledger picons/radio-world/staging/batch-70-reviewed/visual-ledger.json.gz --ledger picons/radio-world/staging/batch-71-reviewed/visual-ledger.json.gz --index "$stage/countries.proposed.json" --production "$RUNNER_TEMP/production.json" --output "$stage/png-admission-proof.json"
          git diff --exit-code 2db89afad0f414fe7c4b1a6a1a836382d47090d3 -- picons/radio-world/catalog/countries.json 'picons/IPTV-*/catalog/release.json'
          git add "$stage/verification-proof.json" "$stage/downloader-proof.json" "$stage/production-preservation-proof.json" "$stage/candidate-preservation-proof.json" "$stage/png-admission-proof.json"
          git commit -m 'Verify staged batch71 with stable downloader and all prior PNGs [skip ci]'
          git push origin HEAD:refs/heads/work/radio-world-batch38-contrast-pass1-history-20261107

      - name: Export verified build checkpoint
        id: checkpoint
        run: echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
  independent_readback:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.build.outputs.checkpoint }}
          sparse-checkout: |
            picons/radio-world/staging/batch-71-reviewed
      - run: python3 -m pip install Pillow==13.0.0
      - name: Download every new ZIP on an independent runner
        run: |
          set -euo pipefail
          stage=picons/radio-world/staging/batch-71-reviewed
          python3 "$stage/helpers/independent_readback.py" 71 "${{ needs.build.outputs.checkpoint }}"
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add "$stage/results/independent-postwrite-audit.json" "$stage/SHA256SUMS.txt"
          git commit -m 'Verify batch71 independent27 ZIP readback and preserved PNG bytes [skip ci]'
          git push origin HEAD:refs/heads/work/radio-world-batch38-contrast-pass1-history-20261107
