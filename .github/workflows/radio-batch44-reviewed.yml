name: Preserve14 capacity-deferred RADIO BOB references; no ZIP or index
on:
  push:
    branches: [work/radio-world-batch38-contrast-pass1-history-20261107]
    paths: [.github/workflows/radio-batch44-reviewed.yml]
permissions:
  contents: write
concurrency:
  group: radio-prepared-capacity-existing-working-ref
  cancel-in-progress: false
jobs:
  preserve_prepared_assets:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: |
            picons/radio-world/tools
            picons/radio-world/catalog
            picons/radio-world/staging
      - run: python3 -m pip install Pillow==13.0.0
      - name: Save verified publisher originals and prepared PNGs
        run: python3 picons/radio-world/staging/prepared-radio-bob-capacity/helpers/prepare_inputs.py
      - name: Read back saved PNG hashes, dimensions and alpha; record no integration
        run: |
          set -euo pipefail
          stage=picons/radio-world/staging/prepared-radio-bob-capacity
          python3 "$stage/helpers/source_readback.py"
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add "$stage"
          git commit -m 'Preserve14 prepared references/126 PNGs; no ZIP,candidate index or production change [skip ci]'
          git push origin HEAD:refs/heads/work/radio-world-batch38-contrast-pass1-history-20261107
