name: Warder MASTER one-shot production

on:
  push:
    branches:
      - warder-master-production
    paths:
      - .github/workflows/warder-master-production.yml

permissions:
  contents: write

jobs:
  rebuild:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
        with:
          ref: warder-master-production
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install image processing dependencies
        run: python -m pip install --disable-pip-version-check pillow numpy scipy
      - name: Rebuild and validate complete catalog
        run: python tools/rebuild_master_catalog.py --root .
      - name: Commit validated production result and remove one-shot workflow
        run: |
          rm .github/workflows/warder-master-production.yml
          git config user.name "Warder Production"
          git config user.email "44697180+Evolution-by-Warder@users.noreply.github.com"
          git add -- picons reports/warder-master-production tools/rebuild_master_catalog.py .github/workflows/warder-master-production.yml
          git commit --quiet -m "Rebuild complete BLACK and WHITE master catalog"
          git push origin HEAD:warder-master-production
