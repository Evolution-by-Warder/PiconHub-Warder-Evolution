name: Promote PiconHub 0.1.38 stable release
on:
  push:
    branches: [main]
    paths: [.github/workflows/promote-approved-repair.yml, docs/PICONHUB-0.1.38-RELEASE.md]
permissions:
  contents: read
concurrency:
  group: approved-receiver-repair
  cancel-in-progress: false
jobs:
  promote:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: Evolution-by-Warder/PiconHub-Warder-Evolution
    steps:
      - uses: actions/checkout@v4
      - name: Verify immutable public IPK and checksum before promotion
        run: |
          set -euo pipefail
          mkdir /tmp/approved-repair
          gh release download 'v0.1.38' --pattern 'enigma2-plugin-extensions-piconhub_0.1.38_all.ipk' --pattern 'enigma2-plugin-extensions-piconhub_0.1.38_all.ipk.sha256' --dir /tmp/approved-repair
          test "$(stat -c %s '/tmp/approved-repair/enigma2-plugin-extensions-piconhub_0.1.38_all.ipk')" = '2883764'
          printf '%s  %s\n' 'e3ed6fb2568877dbce6fde1cbbf1f4150b0c28174a194fec31fbe82808812c1e' '/tmp/approved-repair/enigma2-plugin-extensions-piconhub_0.1.38_all.ipk' | sha256sum --check
          cd /tmp/approved-repair
          sha256sum --check 'enigma2-plugin-extensions-piconhub_0.1.38_all.ipk.sha256'
      - name: Promote existing release without rebuilding or replacing assets
        run: |
          set -euo pipefail
          gh release edit 'v0.1.38' --draft=false --prerelease=false --latest --title 'PiconHub 0.1.38' --notes-file docs/PICONHUB-0.1.38-RELEASE.md
          gh release view 'v0.1.38' --json tagName,isDraft,isPrerelease,assets
