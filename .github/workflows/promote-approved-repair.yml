name: Promote approved receiver repair
on:
  push:
    branches: [main]
    paths: [.github/workflows/promote-approved-repair.yml, docs/APPROVED-REPAIR-RELEASE.md]
permissions:
  contents: read
concurrency:
  group: approved-receiver-repair
  cancel-in-progress: false
jobs:
  promote:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: Evolution-by-Warder/PiconHub-Warder-Evolution
    steps:
      - uses: actions/checkout@v4
      - name: Verify immutable public IPK and checksum before promotion
        run: |
          set -euo pipefail
          mkdir /tmp/approved-repair
          gh release download 'v0.1.35' --pattern 'enigma2-plugin-extensions-piconhub_0.1.35_all.ipk' --pattern 'enigma2-plugin-extensions-piconhub_0.1.35_all.ipk.sha256' --dir /tmp/approved-repair
          test "$(stat -c %s '/tmp/approved-repair/enigma2-plugin-extensions-piconhub_0.1.35_all.ipk')" = '2879430'
          printf '%s  %s\n' '52cc24b4af666262f2faa70cb80b25c2c0a72c9bf13a3d744950c45a8c1c14b0' '/tmp/approved-repair/enigma2-plugin-extensions-piconhub_0.1.35_all.ipk' | sha256sum --check
          cd /tmp/approved-repair
          sha256sum --check 'enigma2-plugin-extensions-piconhub_0.1.35_all.ipk.sha256'
      - name: Promote existing release without rebuilding or replacing assets
        run: |
          set -euo pipefail
          gh release edit 'v0.1.35' --draft=false --prerelease=false --latest --notes-file docs/APPROVED-REPAIR-RELEASE.md
          gh release view 'v0.1.35' --json tagName,isDraft,isPrerelease,assets
