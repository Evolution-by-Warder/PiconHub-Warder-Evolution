name: Refresh Warder Radio Streams
on:
  schedule:
    - cron: '20 4 * * 0'
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/weekly-world-radio.yml'
      - 'picons/IPTV-SK-CZ/tools/update_world_radio.py'
      - 'picons/IPTV-SK-CZ/tools/test_world_radio.py'
      - 'picons/IPTV-SK-CZ/tools/laut_radio.py'
      - 'picons/IPTV-SK-CZ/tools/test_laut_radio.py'
      - 'picons/IPTV-SK-CZ/tools/global_radio.py'
      - 'picons/IPTV-SK-CZ/tools/country_catalogue.py'
      - 'picons/IPTV-SK-CZ/tools/test_country_radio.py'
      - 'picons/IPTV-SK-CZ/tools/test_global_radio.py'
      - 'picons/IPTV-SK-CZ/tools/station_identity.py'
      - 'picons/IPTV-SK-CZ/tools/stream_audit.py'
      - 'picons/IPTV-SK-CZ/tools/test_station_radio.py'
      - 'picons/IPTV-SK-CZ/catalog/source-radio.radio'
      - 'picons/IPTV-SK-CZ/tools/fetch_complete_radio.py'
      - 'picons/IPTV-SK-CZ/tools/test_fetch_complete_radio.py'
      - 'picons/IPTV-SK-CZ/bouquets/userbouquet.warder.sk-cz.radio'
permissions:
  contents: write
concurrency:
  group: warder-world-radio
  cancel-in-progress: true
jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      COUNTRY_PACKAGES_ONLY: ${{ github.event_name == 'push' && startsWith(github.event.head_commit.message, 'Build country catalogue packages:') }}
      REVIEWED_SK_CORRECTION: ${{ github.event_name == 'push' && startsWith(github.event.head_commit.message, 'Apply reviewed Slovak catalogue corrections:') }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 1
          sparse-checkout: |
            picons/IPTV-SK-CZ/bouquets
            picons/IPTV-SK-CZ/tools
            picons/IPTV-SK-CZ/catalog
          sparse-checkout-cone-mode: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.14'
      - name: Test country filtering, identity stability and failure handling
        run: python -m unittest discover -s picons/IPTV-SK-CZ/tools -p 'test_*radio.py' -v
      - name: Save published snapshot for the reviewed Slovak correction
        if: env.REVIEWED_SK_CORRECTION == 'true'
        run: cp picons/IPTV-SK-CZ/catalog/global/world-radio.receiver.json.gz /tmp/warder-radio-before.json.gz
      - name: Refresh compatible catalogue
        if: env.REVIEWED_SK_CORRECTION != 'true' && env.COUNTRY_PACKAGES_ONLY != 'true'
        continue-on-error: true
        run: python picons/IPTV-SK-CZ/tools/update_world_radio.py
      - name: Download complete supported source snapshots
        if: env.REVIEWED_SK_CORRECTION != 'true' && env.COUNTRY_PACKAGES_ONLY != 'true'
        run: python picons/IPTV-SK-CZ/tools/fetch_complete_radio.py
      - name: Compile master database and country catalogue
        if: env.COUNTRY_PACKAGES_ONLY != 'true'
        run: python picons/IPTV-SK-CZ/tools/global_radio.py
      - name: Audit stream addresses and bounded audio samples
        if: env.REVIEWED_SK_CORRECTION != 'true' && env.COUNTRY_PACKAGES_ONLY != 'true'
        run: |
          python picons/IPTV-SK-CZ/tools/stream_audit.py --input picons/IPTV-SK-CZ/catalog/global/world-radio.json.gz --output picons/IPTV-SK-CZ/catalog/global/stream-audit.json.gz --workers 64 --timeout 5 --budget-seconds 300
          python picons/IPTV-SK-CZ/tools/stream_audit.py --input picons/IPTV-SK-CZ/catalog/global/world-radio.json.gz --output picons/IPTV-SK-CZ/catalog/global/stream-audit.json.gz --workers 64 --timeout 5 --budget-seconds 300
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: radio-stream-audit
          path: picons/IPTV-SK-CZ/catalog/global/stream-audit.json.gz
          retention-days: 7
      - name: Apply corroborated stream failures and redirects
        if: env.COUNTRY_PACKAGES_ONLY != 'true'
        run: python picons/IPTV-SK-CZ/tools/global_radio.py --stream-checks picons/IPTV-SK-CZ/catalog/global/stream-audit.json.gz
      - name: Require exactly the two reviewed removals and no other receiver changes
        if: env.REVIEWED_SK_CORRECTION == 'true'
        run: |
          python - <<'PY'
          import gzip, json
          def read(path):
              with gzip.open(path, 'rt') as stream:
                  return {row['reference']: row for row in json.load(stream)}
          before = read('/tmp/warder-radio-before.json.gz')
          after = read('picons/IPTV-SK-CZ/catalog/global/world-radio.receiver.json.gz')
          expected = {'4097:0:2:74A2:61B7:ED:0:0:0:0', '4097:0:2:1514:72ED:ED:0:0:0:0'}
          assert before.keys() - after.keys() == expected, 'Unexpected removal; publication stopped'
          assert not after.keys() - before.keys(), 'Unreviewed addition; publication stopped'
          assert all(row == before[key] for key, row in after.items()), 'Unreviewed receiver change; publication stopped'
          print('Only the reviewed Patria duplicate and retired Pyramida were removed.')
          PY
      - name: Build deterministic country packages from the validated receiver catalogue
        run: python picons/IPTV-SK-CZ/tools/country_catalogue.py
      - name: Publish validated catalogues as one revision
        shell: bash
        run: |
          set -euo pipefail
          git add picons/IPTV-SK-CZ/bouquets/userbouquet.warder.radio picons/IPTV-SK-CZ/catalog/world-radio-update.json picons/IPTV-SK-CZ/catalog/source-radio.radio picons/IPTV-SK-CZ/catalog/global
          if git diff --cached --quiet; then
            echo 'Warder radio database is already current.'
            exit 0
          fi
          git config user.name 'Warder radio automation'
          git config user.email 'warder-radio@users.noreply.github.com'
          git commit -m 'Refresh central radio database and compiled country catalogue'
          git push origin HEAD:main
