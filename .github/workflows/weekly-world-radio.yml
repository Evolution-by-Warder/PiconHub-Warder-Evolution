name: Refresh Warder Radio Streams
on:
  schedule:
    - cron: '20 4 * * 0'
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/weekly-world-radio.yml'
      - 'picons/IPTV-SK-CZ/tools/update_world_radio.py'
      - 'picons/IPTV-SK-CZ/tools/test_world_radio.py'
      - 'picons/IPTV-SK-CZ/bouquets/userbouquet.warder.sk-cz.radio'
permissions:
  contents: write
concurrency:
  group: warder-world-radio
  cancel-in-progress: false
jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 1
          sparse-checkout: |
            picons/IPTV-SK-CZ/bouquets
            picons/IPTV-SK-CZ/tools
            picons/IPTV-SK-CZ/catalog/world-radio-update.json
          sparse-checkout-cone-mode: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.14'
      - name: Test country filtering, identity stability and failure handling
        run: python -m unittest discover -s picons/IPTV-SK-CZ/tools -p test_world_radio.py -v
      - name: Refresh temporary source and publish only verified output
        shell: bash
        run: |
          set -euo pipefail
          python picons/IPTV-SK-CZ/tools/update_world_radio.py
          git add picons/IPTV-SK-CZ/bouquets/userbouquet.warder.radio picons/IPTV-SK-CZ/catalog/world-radio-update.json
          if git diff --cached --quiet; then
            echo 'Warder radio list is already current.'
            exit 0
          fi
          git config user.name 'Warder radio automation'
          git config user.email 'warder-radio@users.noreply.github.com'
          git commit -m 'Refresh world radios while preserving Warder SK/CZ entries'
          git push origin HEAD:main
