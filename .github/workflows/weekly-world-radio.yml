name: Refresh Warder Radio Streams
on:
  schedule:
    - cron: '20 4 * * 0'
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/weekly-world-radio.yml'
      - 'picons/IPTV-SK-CZ/tools/update_world_radio.py'
      - 'picons/IPTV-SK-CZ/tools/test_world_radio.py'
      - 'picons/IPTV-SK-CZ/tools/laut_radio.py'
      - 'picons/IPTV-SK-CZ/tools/test_laut_radio.py'
      - 'picons/IPTV-SK-CZ/tools/global_radio.py'
      - 'picons/IPTV-SK-CZ/tools/test_global_radio.py'
      - 'picons/IPTV-SK-CZ/tools/station_identity.py'
      - 'picons/IPTV-SK-CZ/tools/stream_audit.py'
      - 'picons/IPTV-SK-CZ/tools/test_station_radio.py'
      - 'picons/IPTV-SK-CZ/catalog/source-radio.radio'
      - 'picons/IPTV-SK-CZ/tools/fetch_complete_radio.py'
      - 'picons/IPTV-SK-CZ/tools/test_fetch_complete_radio.py'
      - 'picons/IPTV-SK-CZ/bouquets/userbouquet.warder.sk-cz.radio'
permissions:
  contents: write
concurrency:
  group: warder-world-radio
  cancel-in-progress: true
jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 1
          sparse-checkout: |
            picons/IPTV-SK-CZ/bouquets
            picons/IPTV-SK-CZ/tools
            picons/IPTV-SK-CZ/catalog
          sparse-checkout-cone-mode: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.14'
      - name: Test country filtering, identity stability and failure handling
        run: python -m unittest discover -s picons/IPTV-SK-CZ/tools -p 'test_*radio.py' -v
      - name: Refresh compatible catalogue
        continue-on-error: true
        run: python picons/IPTV-SK-CZ/tools/update_world_radio.py
      - name: Download complete supported source snapshots
        run: python picons/IPTV-SK-CZ/tools/fetch_complete_radio.py
      - name: Compile master database and country catalogue
        run: python picons/IPTV-SK-CZ/tools/global_radio.py
      - name: Audit stream addresses and bounded audio samples
        run: python picons/IPTV-SK-CZ/tools/stream_audit.py --input picons/IPTV-SK-CZ/catalog/global/world-radio.json.gz --output picons/IPTV-SK-CZ/catalog/global/stream-audit.json.gz --workers 64 --timeout 5
      - name: Apply corroborated stream failures and redirects
        run: python picons/IPTV-SK-CZ/tools/global_radio.py --stream-checks picons/IPTV-SK-CZ/catalog/global/stream-audit.json.gz
      - name: Publish validated catalogues as one revision
        shell: bash
        run: |
          set -euo pipefail
          git add picons/IPTV-SK-CZ/bouquets/userbouquet.warder.radio picons/IPTV-SK-CZ/catalog/world-radio-update.json picons/IPTV-SK-CZ/catalog/source-radio.radio picons/IPTV-SK-CZ/catalog/global
          if git diff --cached --quiet; then
            echo 'Warder radio database is already current.'
            exit 0
          fi
          git config user.name 'Warder radio automation'
          git config user.email 'warder-radio@users.noreply.github.com'
          git commit -m 'Refresh central radio database and compiled country catalogue'
          git push origin HEAD:main
