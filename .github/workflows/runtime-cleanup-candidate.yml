name: Receiver runtime cleanup candidate
on:
  push:
    branches: [fix/receiver-runtime-cleanup]
    paths: ['plugin/**', '.github/workflows/runtime-cleanup-candidate.yml']
permissions:
  contents: write
concurrency:
  group: piconhub-runtime-cleanup-candidate
  cancel-in-progress: true
jobs:
  candidate:
    runs-on: ubuntu-latest
    env:
      PYTHONDONTWRITEBYTECODE: '1'
      PYTHONPATH: plugin/src
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: |
            plugin
            picons/DAB
            picons/IPTV-SK-CZ
      - uses: actions/setup-python@v5
        with:
          python-version: '3.9'
      - run: python -m unittest discover -s plugin/tests -q
      - name: Build twice and compare package bytes
        run: |
          python plugin/tools/build_ipk.py --output plugin/build --revision "$GITHUB_SHA"
          cp plugin/build/*.ipk /tmp/first.ipk
          python plugin/tools/build_ipk.py --output plugin/build --revision "$GITHUB_SHA"
          cmp /tmp/first.ipk plugin/build/*.ipk
      - uses: actions/upload-artifact@v4
        with:
          name: PiconHub-runtime-cleanup-candidate
          path: plugin/build/*
          retention-days: 30
      - name: Publish isolated prerelease without updating feeds
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          VERSION=$(cat plugin/src/Plugins/Extensions/WarderPiconHub/version.txt)
          test "$VERSION" = '0.1.31'
          gh release create "runtime-cleanup-${VERSION}" plugin/build/*.ipk plugin/build/*.sha256 \
            --target "$GITHUB_SHA" --prerelease --latest=false \
            --title "PiconHub ${VERSION}: receiver runtime cleanup" --notes-file plugin/RUNTIME-CLEANUP-2026-10-29.md
