name: Phase 1 full source QC
on:
  push:
    branches: [warder-master-production]
permissions:
  contents: write
jobs:
  source-qc:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: warder-master-production
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install --disable-pip-version-check pillow numpy
      - name: Apply conservative scanner fix
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('tools/source_qc_recovery.py')
          s=p.read_text()
          s=s.replace('FULL_CANVAS_OPAQUE_REVIEW = 0.90\n','FULL_CANVAS_OPAQUE_REVIEW = 0.90\nVISIBLE_RECT_FILL_REVIEW = 0.98\nVISIBLE_RECT_EDGE_REVIEW = 0.95\nVISIBLE_RECT_CORNER_REVIEW = 0.75\n')
          s=s.replace('    opaque = box >= OPAQUE\n','    opaque = box >= OPAQUE\n    box_visible = box > NEAR_TRANSPARENT\n')
          s=s.replace('    canvas_opaque_fraction = float(np.mean(a >= OPAQUE))\n','    canvas_opaque_fraction = float(np.mean(a >= OPAQUE))\n    visible_fill = float(np.mean(box_visible))\n    visible_edge = np.concatenate((box_visible[0, :], box_visible[-1, :],\n                                   box_visible[:, 0], box_visible[:, -1]))\n    visible_edge_fraction = float(np.mean(visible_edge)) if visible_edge.size else 0.0\n    visible_corners = np.array([box_visible[0,0], box_visible[0,-1],\n                                box_visible[-1,0], box_visible[-1,-1]], dtype=float)\n    visible_corner_fraction = float(np.mean(visible_corners))\n')
          s=s.replace('        "canvas_opaque_fraction": round(canvas_opaque_fraction, 6),\n','        "canvas_opaque_fraction": round(canvas_opaque_fraction, 6),\n        "bbox_visible_fill": round(visible_fill, 6),\n        "bbox_visible_edge_fraction": round(visible_edge_fraction, 6),\n        "bbox_visible_corner_fraction": round(visible_corner_fraction, 6),\n')
          needle='        reasons.append("suspected opaque rectangular background in transparent source")\n'
          addition='''        reasons.append("suspected opaque rectangular background in transparent source")
              # Some raster backgrounds are uniformly semi-transparent rather than alpha
              # 255. Their visible mask still forms a large, continuously filled rectangle
              # with present edges and corners. Treat this conservatively as REVIEW; never
              # infer that the rectangle is a legitimate logo badge automatically.
              if (area_fraction >= MIN_RECT_AREA and visible_fill >= VISIBLE_RECT_FILL_REVIEW
                      and visible_edge_fraction >= VISIBLE_RECT_EDGE_REVIEW
                      and visible_corner_fraction >= VISIBLE_RECT_CORNER_REVIEW):
                  reasons.append("suspected rectangular raster background in transparent source")
          '''
          addition='\n'.join(line[8:] if line.startswith('        ') else line for line in addition.splitlines())+'\n'
          s=s.replace(needle,addition)
          p.write_text(s)
          PY
          python -m py_compile tools/source_qc_recovery.py
      - name: Snapshot and run full SOURCE QC
        shell: bash
        run: |
          set -euo pipefail
          find picons -path '*/transparent/*.png' -type f -print0 | sort -z | xargs -0 sha256sum > /tmp/transparent.before
          sha256sum templates/picons/black-sablona.png templates/picons/white-sablona.png > /tmp/masters.before
          find picons \( -path '*/black/*.png' -o -path '*/white/*.png' \) -type f -print0 | sort -z | xargs -0 sha256sum > /tmp/variants.before
          set +e
          python tools/source_qc_recovery.py --root .
          rc=$?
          set -e
          test "$rc" -eq 0 -o "$rc" -eq 2
      - name: Validate complete audit
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import csv,json
          from pathlib import Path
          d=Path('reports/warder-master-production/source-qc')
          rows=list(csv.DictReader((d/'source-audit.csv').open()))
          recovery=list(csv.DictReader((d/'recovery-list.csv').open()))
          summary=json.loads((d/'summary.json').read_text())
          duplicates=json.loads((d/'duplicate-sha.json').read_text())
          actual=len(list(Path('picons').glob('*/*/transparent/*.png')))
          assert len(rows)==actual==summary['transparent_sources']
          assert len(recovery)==summary['recovery_items']
          sha='25d4857741b6329f8c3e813669f661c0b8ac9d248698470a42c98f2da1ba0efd'
          planb=[r for r in rows if r['satellite_position']=='80.0e' and r['provider']=='orion-express' and r['source_sha256']==sha]
          assert len(planb)==2 and all(r['source_status']=='SOURCE-REVIEW' and r['source_reason']=='suspected rectangular raster background in transparent source' for r in planb)
          assert sha in duplicates and len(duplicates[sha])==2
          PY
          find picons -path '*/transparent/*.png' -type f -print0 | sort -z | xargs -0 sha256sum > /tmp/transparent.after
          sha256sum templates/picons/black-sablona.png templates/picons/white-sablona.png > /tmp/masters.after
          find picons \( -path '*/black/*.png' -o -path '*/white/*.png' \) -type f -print0 | sort -z | xargs -0 sha256sum > /tmp/variants.after
          cmp /tmp/transparent.before /tmp/transparent.after
          cmp /tmp/masters.before /tmp/masters.after
          cmp /tmp/variants.before /tmp/variants.after
      - name: Commit Phase 1 only
        shell: bash
        run: |
          set -euo pipefail
          rm .github/workflows/phase1-source-qc.yml
          git config user.name 'Warder Evolution QC'
          git config user.email 'actions@users.noreply.github.com'
          git add tools/source_qc_recovery.py reports/warder-master-production/source-qc .github/workflows/phase1-source-qc.yml
          git commit -m 'Run full catalog Phase 1 SOURCE QC'
          git push origin HEAD:warder-master-production
