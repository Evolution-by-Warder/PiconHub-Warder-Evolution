name: Phase 1 full source QC
on:
  push:
    branches: [warder-master-production]
    paths: [.github/workflows/phase1-source-qc.yml]
permissions:
  contents: write
jobs:
  source-qc:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: warder-master-production
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install --disable-pip-version-check pillow numpy
      - name: Snapshot protected content
        shell: bash
        run: |
          set -euo pipefail
          find picons -path '*/transparent/*.png' -type f -print0 | sort -z | xargs -0 sha256sum > /tmp/transparent.before
          sha256sum templates/picons/black-sablona.png templates/picons/white-sablona.png > /tmp/masters.before
          find picons \( -path '*/black/*.png' -o -path '*/white/*.png' \) -type f -print0 | sort -z | xargs -0 sha256sum > /tmp/variants.before
      - name: Run full SOURCE QC
        shell: bash
        run: |
          set +e
          python tools/source_qc_recovery.py --root .
          rc=$?
          set -e
          test "$rc" -eq 0 -o "$rc" -eq 2
      - name: Validate reports and known PLAN B cases
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import csv, json
          from pathlib import Path
          d=Path('reports/warder-master-production/source-qc')
          required=['source-audit.csv','recovery-list.csv','summary.json','duplicate-sha.json']
          assert all((d/x).is_file() for x in required), required
          with (d/'source-audit.csv').open(encoding='utf-8',newline='') as f: rows=list(csv.DictReader(f))
          with (d/'recovery-list.csv').open(encoding='utf-8',newline='') as f: recovery=list(csv.DictReader(f))
          summary=json.loads((d/'summary.json').read_text())
          actual=len(list(Path('picons').glob('*/*/transparent/*.png')))
          assert len(rows)==actual==summary['transparent_sources'], (len(rows),actual,summary)
          assert len(recovery)==summary['recovery_items']
          planb=[r for r in rows if r['satellite_position'].lower()=='80.0e' and r['provider']=='orion-express' and r['source_status']!='PASS' and 'opaque' in r['source_reason'].lower()]
          assert len(planb)>=2, planb
          print(json.dumps({'validated_sources':actual,'plan_b_hits':planb},indent=2))
          PY
      - name: Verify protected content unchanged
        shell: bash
        run: |
          set -euo pipefail
          find picons -path '*/transparent/*.png' -type f -print0 | sort -z | xargs -0 sha256sum > /tmp/transparent.after
          sha256sum templates/picons/black-sablona.png templates/picons/white-sablona.png > /tmp/masters.after
          find picons \( -path '*/black/*.png' -o -path '*/white/*.png' \) -type f -print0 | sort -z | xargs -0 sha256sum > /tmp/variants.after
          cmp /tmp/transparent.before /tmp/transparent.after
          cmp /tmp/masters.before /tmp/masters.after
          cmp /tmp/variants.before /tmp/variants.after
      - name: Commit Phase 1 reports and remove one-shot workflow
        shell: bash
        run: |
          set -euo pipefail
          rm .github/workflows/phase1-source-qc.yml
          git config user.name 'Warder Evolution QC'
          git config user.email 'actions@users.noreply.github.com'
          git add reports/warder-master-production/source-qc .github/workflows/phase1-source-qc.yml
          git commit -m 'Run full catalog Phase 1 SOURCE QC'
          git push origin HEAD:warder-master-production
