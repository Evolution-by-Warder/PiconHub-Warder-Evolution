name: Build PiconHub manifests

on:
  push:
    branches: [main]
    paths:
      - 'picons/**'
      - 'manifests/build.py'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build manifests
        run: python3 manifests/build.py

      - name: Commit generated manifests
        run: |
          if git diff --quiet -- manifests; then
            echo "No manifest changes"
            exit 0
          fi
          git config user.name "PiconHub-Warder Bot"
          git config user.email "44697180+PiconHub-Warder@users.noreply.github.com"
          git add manifests
          git commit -m "Rebuild PiconHub v2 manifests"
          git push
