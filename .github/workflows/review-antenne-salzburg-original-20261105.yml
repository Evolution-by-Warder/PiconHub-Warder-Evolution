name: Warder Antenne Salzburg original station logo review (not production)
on:
  push:
    branches: [review/antenne-salzburg-original-20261105]
    paths:
      - '.github/workflows/review-antenne-salzburg-original-20261105.yml'
      - 'picons/IPTV-SK-CZ/tools/review_antenne_salzburg.py'
permissions:
  contents: write
concurrency:
  group: warder-original-radio-review-at-de
  cancel-in-progress: false
jobs:
  review:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          filter: blob:none
          sparse-checkout: |
            picons/IPTV-AT
            picons/IPTV-SK-CZ/tools
            picons/IPTV-SK-CZ/review
            plugin/artwork/templates/picons
            .github/workflows
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install deterministic preview rendering tools
        run: python3 -m pip install --quiet Pillow==13.0.0 CairoSVG==2.8.2 defusedxml==0.7.1
      - name: Verify pinned official logo vector hashes and render 1 x 9 preview variants
        run: python3 picons/IPTV-SK-CZ/tools/review_antenne_salzburg.py
      - name: Require original master immutability and review-only boundaries
        run: |
          test "$(python3 - <<'PY'
          import json
          d=json.load(open('picons/IPTV-SK-CZ/review/antenne-salzburg-20261105/manifest.json'))
          print(d['stage']=='review_not_production' and d['new_production_refs']==0 and
                len(d['sources'])==1 and
                all(len(x['renders'])==9 for x in d['sources']))
          PY
          )" = "True"
          if git status --short | grep -E '^( M|M |A ) +picons/IPTV-(AT|DE)/'; then
            echo "Production collection touched!" >&2; exit 1
          fi
          git status --short
      - name: Commit strictly nonproduction Warder review PNGs and provenance
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add picons/IPTV-SK-CZ/review/antenne-salzburg-20261105
          git diff --cached --quiet && exit 1
          git commit -m "Review 2 original broadcaster vectors in Warder 9-variant artwork"
          git push origin HEAD:review/antenne-salzburg-original-20261105
      - name: Upload preview sheets and manifests
        uses: actions/upload-artifact@v4
        with:
          name: warder-antenne-salzburg-radio-review
          path: picons/IPTV-SK-CZ/review/antenne-salzburg-20261105/
