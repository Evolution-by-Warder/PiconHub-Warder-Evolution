name: Render 27 review picons from official Polskie Radio Białystok brandkit
on:
  push:
    branches: [review/radio-bialystok-official-brandkit-20261104]
    paths:
      - '.github/workflows/review-radio-bialystok-warder-variants.yml'
      - 'picons/IPTV-SK-CZ/tools/review_radio_bialystok_warder.py'
permissions:
  contents: write
jobs:
  review:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          filter: blob:none
          sparse-checkout: |
            picons/IPTV-SK-CZ/review
            picons/IPTV-SK-CZ/tools
            plugin/artwork/templates/picons
            .github/workflows
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - run: python3 -m pip install --quiet Pillow==13.0.0
      - name: Render unchanged broadcaster PNG/JPG inside approved Warder 3x3 masters
        run: python3 picons/IPTV-SK-CZ/tools/review_radio_bialystok_warder.py
      - name: Preserve non-production review images and SHA-256 proof
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add picons/IPTV-SK-CZ/review/radio-bialystok-official-brandkit-20261104/
          if ! git diff --cached --quiet; then
            git commit -m "Preserve official Bialystok 27 Warder review PNGs and proofs"
            git push origin HEAD:review/radio-bialystok-official-brandkit-20261104
          fi
      - uses: actions/upload-artifact@v4
        with:
          name: warder-bialystok-27-original-review-picons
          path: picons/IPTV-SK-CZ/review/radio-bialystok-official-brandkit-20261104/
