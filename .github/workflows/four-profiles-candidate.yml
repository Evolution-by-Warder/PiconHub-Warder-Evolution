name: PiconHub four-profile test release
on:
  push:
    branches: [feature/four-profiles-20261101]
    paths: [plugin/**, .github/workflows/four-profiles-candidate.yml]
permissions:
  contents: write
concurrency:
  group: piconhub-four-profiles
  cancel-in-progress: true
jobs:
  test-release:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      PYTHONDONTWRITEBYTECODE: '1'
      PYTHONPATH: plugin/src
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: |
            plugin
            picons/DAB
            picons/IPTV-SK-CZ/catalog
      - uses: actions/setup-python@v5
        with:
          python-version: '3.9'
      - run: python -m pip install --quiet Pillow==11.3.0
      - run: python -m unittest discover -s plugin/tests -q
      - name: Build and inspect isolated RC package
        run: |
          set -euo pipefail
          python plugin/tools/prepare_install_test.py --version 0.1.36
          python plugin/tools/build_ipk.py --output plugin/build --revision "$GITHUB_SHA"
          cp plugin/build/enigma2-plugin-extensions-piconhub_0.1.36_all.ipk /tmp/first.ipk
          python plugin/tools/build_ipk.py --output plugin/build --revision "$GITHUB_SHA"
          cmp /tmp/first.ipk plugin/build/enigma2-plugin-extensions-piconhub_0.1.36_all.ipk
          python plugin/tools/verify_install_test.py
      - uses: actions/upload-artifact@v4
        with:
          name: PiconHub-0.1.36
          path: plugin/build/*
          retention-days: 30
      - name: Publish only the test IPK and checksum
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          PACKAGE=plugin/build/enigma2-plugin-extensions-piconhub_0.1.36_all.ipk
          TAG=v0.1.36
          if gh release view "$TAG" >/dev/null 2>&1; then
            mkdir -p /tmp/immutable
            gh release download "$TAG" --pattern "$(basename "$PACKAGE")" --dir /tmp/immutable
            cmp "$PACKAGE" "/tmp/immutable/$(basename "$PACKAGE")"
          else
            gh release create "$TAG" "$PACKAGE" "$PACKAGE.sha256" --target "$GITHUB_SHA" --prerelease --latest=false --title "PiconHub 0.1.36" --notes-file plugin/update/RELEASE-NOTES.md
          fi
