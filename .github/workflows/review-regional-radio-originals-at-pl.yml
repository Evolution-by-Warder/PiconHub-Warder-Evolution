name: Review regional AT/PL station original logos (3 broadcasters)
on:
  push:
    branches: ['review/warder-radio-katowice-poznan-steiermark-20261104']
    paths:
      - '.github/workflows/review-regional-radio-originals-at-pl.yml'
      - 'picons/IPTV-SK-CZ/tools/review_regional_radio_originals.py'
permissions:
  contents: write
jobs:
  review:
    runs-on: ubuntu-24.04
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@v4
        with:
          filter: blob:none
          fetch-depth: 0
          sparse-checkout: |
            picons/IPTV-AT/catalog
            picons/IPTV-PL/catalog
            picons/IPTV-SK-CZ/catalog
            picons/IPTV-SK-CZ/tools
            picons/IPTV-SK-CZ/review
            plugin/artwork/templates/picons
            .github/workflows
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - name: Install frozen raster/vector dependency versions
        run: python3 -m pip install --quiet Pillow==13.0.0 CairoSVG==2.8.2 defusedxml==0.7.1
      - name: Check authoritative broadcaster source links and produce non-production Warder review
        run: python3 picons/IPTV-SK-CZ/tools/review_regional_radio_originals.py
      - name: Keep original sources and hashes only on isolated review branch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add picons/IPTV-SK-CZ/review/official-regional-radio-20261104
          if ! git diff --cached --quiet; then
            git commit -m "Review original Katowice Poznan Steiermark logos in Warder 3x3 style"
            git push origin HEAD:review/warder-radio-katowice-poznan-steiermark-20261104
          fi
      - uses: actions/upload-artifact@v4
        with:
          name: warder-regional-radio-at-pl-originals
          path: picons/IPTV-SK-CZ/review/official-regional-radio-20261104/
