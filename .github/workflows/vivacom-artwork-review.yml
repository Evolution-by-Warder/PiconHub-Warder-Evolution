name: Build Vivacom Warder review sheet (no release)
on:
  push:
    branches: [main]
    paths: [plugin/tools/build_vivacom_review.py]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  review:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: main
          persist-credentials: false
          sparse-checkout: |
            picons/13.0e/vivacom
            plugin/artwork/templates/picons
            plugin/tools/build_vivacom_review.py
            .github/workflows/vivacom-artwork-review.yml
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - run: python -m pip install Pillow
      - run: python plugin/tools/build_vivacom_review.py
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: vivacom-kontrola
          path: review/vivacom-20261103/
          retention-days: 7
          if-no-files-found: error
