name: Stage incremental Warder Radio country packs
on:
  push:
    branches: [work/radio-world-batch26-20261106]
    paths: [.github/workflows/stage-radio-world-20261106.yml]
permissions:
  contents: write
jobs:
  stage:
    if: github.ref == 'refs/heads/work/radio-world-batch26-20261106'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          filter: blob:none
          sparse-checkout: |
            .github/workflows
            picons/radio-world
            picons/IPTV-SK-CZ/catalog/global
            picons/IPTV-AR
            picons/IPTV-DE
            picons/IPTV-GB
            picons/IPTV-SE
            picons/IPTV-UA
            picons/IPTV-US
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install Pillow==11.3.0
      - name: Verify all variants and deterministic country assembly
        run: |
          world=picons/IPTV-SK-CZ/catalog/global/search/2ae88890a953c2f68d3f20352ad56a7390645bd3ce189573dd94e50c8a65abfe.json.gz
          candidate="$RUNNER_TEMP/radio-candidate"
          python picons/radio-world/extend_country_packs.py build . "$world" "$candidate" picons/radio-world/staging/batch-24 picons/radio-world/staging/batch-25
          python picons/radio-world/extend_country_packs.py build . "$world" "$candidate-repeat" picons/radio-world/staging/batch-24 picons/radio-world/staging/batch-25
          cmp "$candidate/candidate.json" "$candidate-repeat/candidate.json"
          cp -a "$candidate/picons/." picons/
          cp "$candidate/candidate.json" picons/radio-world/staging/country-pack-checksums-batch25.json
      - name: Save payload then immutable downloader manifests
        run: |
          test "$(git branch --show-current)" = work/radio-world-batch26-20261106
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          for country in AR DE GB SE UA US; do
            git add -- "picons/IPTV-$country/packages"
          done
          git add -- picons/radio-world/staging/country-pack-checksums-batch25.json
          git commit -m 'Stage country payloads from Radio batches 24 and 25'
          python picons/radio-world/extend_country_packs.py manifests "$RUNNER_TEMP/radio-candidate" "$(git rev-parse HEAD)" .
          for country in AR DE GB SE UA US; do
            git add -- "picons/IPTV-$country/catalog/release.json"
          done
          git rm -- .github/workflows/stage-radio-world-20261106.yml
          git commit -m 'Pin downloader manifests for 119 staged Radio references'
          git push origin HEAD:refs/heads/work/radio-world-batch26-20261106
