name: Factory regression (no release)
on:
  push:
    branches: [factory-warder-development]
    paths:
      - 'factory/app/**'
      - '.github/workflows/factory-regression.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  windows-smoke:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Create disposable synthetic D drive workspace
        shell: pwsh
        run: |
          $root = 'D:\WARDER-PICON-FACTORY'
          if (Test-Path -LiteralPath $root) { throw "Refusing to modify existing runner workspace: $root" }
          New-Item -ItemType Directory -Path $root | Out-Null
          foreach ($name in @('00-STATE','01-SOURCES','02-ORIGINALS','03-REGISTRY','04-WORK','05-QA','06-OUTPUT','07-PUBLISH-STAGING','08-REPORTS','09-LOGS','10-TOOLS','11-APP','12-ARCHIVE')) {
            New-Item -ItemType Directory -Path (Join-Path $root $name) | Out-Null
          }
          Set-Content -LiteralPath (Join-Path $root '11-APP\.ci-synthetic-root') -Value 'Disposable GitHub Actions fixture'
          $preserve = @(
            @{ Path='00-STATE\vhannibal-state.json'; Content='{"status":"updated","imported_png":4}' },
            @{ Path='01-SOURCES\LOCAL-INBOX\existing-source.zip'; Content='synthetic-archive' },
            @{ Path='02-ORIGINALS\origin.png'; Content='immutable-original' },
            @{ Path='03-REGISTRY\warder-master-registry.json'; Content='approved-registry' },
            @{ Path='04-WORK\candidate.png'; Content='work-candidate' },
            @{ Path='05-QA\review-decisions.json'; Content='{"schema":1,"decisions":{}}' },
            @{ Path='06-OUTPUT\existing-approved.png'; Content='approved-output' },
            @{ Path='11-APP\.factory-data\chocholousek-positions.json'; Content='{"schema":1,"positions":["13.0E"]}' },
            @{ Path='12-ARCHIVE\history.dat'; Content='historical-data' }
          )
          $inventory = @()
          foreach ($entry in $preserve) {
            $file = Join-Path $root $entry.Path
            New-Item -ItemType Directory -Path (Split-Path -Parent $file) -Force | Out-Null
            Set-Content -LiteralPath $file -Value $entry.Content -NoNewline
            $inventory += @{ Path=$entry.Path; Sha256=(Get-FileHash -Algorithm SHA256 -LiteralPath $file).Hash }
          }
          $oldApp = Join-Path $root '11-APP\WARDER-PICON-FACTORY'
          New-Item -ItemType Directory -Path $oldApp | Out-Null
          Set-Content -LiteralPath (Join-Path $oldApp 'preinstall-unknown-file.txt') -Value 'preserve prior app payload'
          Set-Content -LiteralPath (Join-Path $oldApp 'engine.py') -Value '# synthetic Python source must remain in place' -NoNewline
          $inventory += @{ Path='11-APP\WARDER-PICON-FACTORY\preinstall-unknown-file.txt'; PreviousApp=$true; Sha256=(Get-FileHash -Algorithm SHA256 -LiteralPath (Join-Path $oldApp 'preinstall-unknown-file.txt')).Hash }
          $inventory += @{ Path='11-APP\WARDER-PICON-FACTORY\engine.py'; PreviousApp=$true; Sha256=(Get-FileHash -Algorithm SHA256 -LiteralPath (Join-Path $oldApp 'engine.py')).Hash }
          Copy-Item -LiteralPath $env:ComSpec -Destination (Join-Path $oldApp 'WARDER-PICON-FACTORY.exe')
          Set-Content -LiteralPath (Join-Path $oldApp 'legacy-workspace-config.json') -Value '{"inbox":"C:\\Users\\PC\\WARDER-PICONS\\01-SOURCES\\LOCAL-INBOX","version":"factory-v1.0.0"}' -NoNewline
          $inventory += @{ Path='11-APP\WARDER-PICON-FACTORY\WARDER-PICON-FACTORY.exe'; PreviousApp=$true; Sha256=(Get-FileHash -Algorithm SHA256 -LiteralPath (Join-Path $oldApp 'WARDER-PICON-FACTORY.exe')).Hash }
          $inventory += @{ Path='11-APP\WARDER-PICON-FACTORY\legacy-workspace-config.json'; PreviousApp=$true; Sha256=(Get-FileHash -Algorithm SHA256 -LiteralPath (Join-Path $oldApp 'legacy-workspace-config.json')).Hash }
          $inventory | ConvertTo-Json | Set-Content -LiteralPath (Join-Path $env:RUNNER_TEMP 'factory-preserve-hashes.json')
          $queue = @{ schema=1; count=0; items=@(); workstream_counts=@{IDENTITY_VERIFICATION=0; ARTWORK_REVIEW=0; TECHNICAL_QA=0} }
          $queueDir = Join-Path $root '05-QA\EXCEPTIONS'
          New-Item -ItemType Directory -Path $queueDir -Force | Out-Null
          $queue | ConvertTo-Json -Depth 4 | Set-Content -LiteralPath (Join-Path $queueDir 'review-queue-ci.json')
      - name: Install Factory dependencies
        run: python -m pip install -r factory/app/requirements-runtime.txt
      - name: Install Windows executable packager
        run: python -m pip install "PyInstaller>=6,<7"
      - name: Compile Windows Factory source
        run: python -m compileall -q factory/app
      - name: Run Factory tests on Windows
        working-directory: factory/app
        run: python -m unittest discover -p 'test_*.py' -v

      - name: Build standalone Windows GUI executable
        working-directory: factory/app
        shell: pwsh
        run: >-
          $commit = (git rev-parse HEAD).Trim();
          @{commit=$commit; workflow_run=$env:GITHUB_RUN_ID} | ConvertTo-Json | Set-Content -LiteralPath .factory-build.json;
          python -m PyInstaller --noconfirm --clean --onefile --windowed
          --name WARDER-PICON-FACTORY
          --add-data ".factory-version.json;."
          --add-data ".factory-build.json;."
          --add-data "templates;templates"
          engine.py;
          if ($LASTEXITCODE -ne 0) { throw "Standalone build failed" }
      - name: Smoke-test packaged Windows GUI
        shell: pwsh
        working-directory: factory/app
        env:
          WARDER_GUI_SMOKE_TEST: "1"
          WARDER_GUI_SMOKE_READY_FILE: ${{ runner.temp }}\factory-gui-ready.txt
        run: |
          Remove-Item $env:WARDER_GUI_SMOKE_READY_FILE -Force -ErrorAction SilentlyContinue
          $proc = Start-Process -FilePath "dist/WARDER-PICON-FACTORY.exe" -PassThru
          $ready = $false
          for ($i = 0; $i -lt 90; $i++) {
            if (Test-Path $env:WARDER_GUI_SMOKE_READY_FILE) { $ready = $true; break }
            if ($proc.HasExited) { break }
            Start-Sleep -Milliseconds 500
          }
          if (-not $ready) { if (-not $proc.HasExited) { Stop-Process -Id $proc.Id -Force }; throw "Packaged GUI did not signal startup" }
          $identity = Get-Content $env:WARDER_GUI_SMOKE_READY_FILE -Raw | ConvertFrom-Json
          $expectedExe = (Resolve-Path 'dist/WARDER-PICON-FACTORY.exe').Path
          if ($identity.build_commit -ne (git rev-parse HEAD).Trim()) { throw "GUI reports wrong build commit: $($identity.build_commit)" }
          $expectedVersion = (Get-Content '.factory-version.json' -Raw | ConvertFrom-Json).version
          if ($identity.installed_version -cne $expectedVersion) { throw "Packaged EXE reports wrong version: $($identity.installed_version), expected $expectedVersion" }
          if ($identity.executable_path -ine $expectedExe) { throw "GUI smoke ran a different executable: $($identity.executable_path)" }
          if ($identity.data_root -cne 'D:\WARDER-PICON-FACTORY' -or $identity.preflight -ne 'ok') { throw "GUI smoke did not use the authoritative D: workspace" }
          $proc.WaitForExit(15000) | Out-Null
          if (-not $proc.HasExited) { Stop-Process -Id $proc.Id -Force; throw "Packaged GUI did not close after smoke test" }
          if ($proc.ExitCode -ne 0) { throw "Packaged GUI exit code $($proc.ExitCode)" }
      - name: Build single-file self-extracting CMD application
        working-directory: factory/app
        run: |
          $version = python -c "import json;print(json.load(open('.factory-version.json'))['version'])"
          if ($LASTEXITCODE -ne 0) { throw "Unable to read Factory version" }
          $commit = (git rev-parse HEAD).Trim()
          if ($commit -ne $env:GITHUB_SHA) { throw "Built commit $commit does not match workflow trigger $env:GITHUB_SHA" }
          python package_windows_cmd.py --exe dist/WARDER-PICON-FACTORY.exe --output ../../SPUSTI-WARDER-PICON-FACTORY.cmd --version $version --commit $commit
          if ($LASTEXITCODE -ne 0) { throw "Unable to build one-click CMD package" }
      - name: Smoke-test single-CMD install and launch
        shell: pwsh
        env:
          WARDER_GUI_SMOKE_TEST: "1"
          WARDER_GUI_SMOKE_READY_FILE: ${{ runner.temp }}\factory-cmd-ready.txt
        run: |
          Remove-Item $env:WARDER_GUI_SMOKE_READY_FILE -Force -ErrorAction SilentlyContinue
          $launcher = Join-Path $env:GITHUB_WORKSPACE 'SPUSTI-WARDER-PICON-FACTORY.cmd'
          $installed = 'D:\WARDER-PICON-FACTORY\11-APP\WARDER-PICON-FACTORY\WARDER-PICON-FACTORY.exe'
          $appDir = Split-Path -Parent $installed
          $oldExeFixture = Join-Path $env:RUNNER_TEMP 'old-factory-exe-fixture.exe'
          Remove-Item $env:WARDER_GUI_SMOKE_READY_FILE -Force -ErrorAction SilentlyContinue
          Move-Item -LiteralPath $installed -Destination $oldExeFixture
          $firstInstall = Start-Process -FilePath $env:ComSpec -ArgumentList @('/c', "`"$launcher`"") -PassThru -Wait
          if ($firstInstall.ExitCode -ne 0) { throw "First EXE installation failed with exit code $($firstInstall.ExitCode)" }
          $ready = $false
          for ($i = 0; $i -lt 120; $i++) {
            if (Test-Path $env:WARDER_GUI_SMOKE_READY_FILE) { $ready = $true; break }
            Start-Sleep -Milliseconds 500
          }
          if (-not $ready) { throw "First installation did not launch the packaged GUI" }
          $firstIdentity = Get-Content $env:WARDER_GUI_SMOKE_READY_FILE -Raw | ConvertFrom-Json
          if ($firstIdentity.build_commit -ne (git rev-parse HEAD).Trim() -or $firstIdentity.data_root -cne 'D:\WARDER-PICON-FACTORY') { throw "First installation launched an unexpected build or data root" }
          Start-Sleep -Seconds 2
          Get-CimInstance Win32_Process -Filter "Name='WARDER-PICON-FACTORY.exe'" | Where-Object { $_.ExecutablePath -ieq $installed } | ForEach-Object { Stop-Process -Id $_.ProcessId -Force -ErrorAction SilentlyContinue }
          foreach ($entry in (Get-Content (Join-Path $env:RUNNER_TEMP 'factory-preserve-hashes.json') | ConvertFrom-Json | Where-Object { $_.PreviousApp -and $_.Path -notlike '*WARDER-PICON-FACTORY.exe' })) {
            $preservedFile = Join-Path 'D:\WARDER-PICON-FACTORY' $entry.Path
            if (-not (Test-Path -LiteralPath $preservedFile) -or (Get-FileHash -Algorithm SHA256 -LiteralPath $preservedFile).Hash -ne $entry.Sha256) { throw "First installation moved or modified existing Python/app data: $($entry.Path)" }
          }
          if (Get-ChildItem -LiteralPath $appDir -File -Filter 'WARDER-PICON-FACTORY.exe.previous-*' -ErrorAction SilentlyContinue) { throw "First installation created a rollback copy for an application that did not exist" }
          Copy-Item -LiteralPath $oldExeFixture -Destination $installed -Force
          $oldExeSha = (Get-FileHash -Algorithm SHA256 -LiteralPath $installed).Hash
          $oldProcess = Start-Process -FilePath $installed -ArgumentList '/c "ping 127.0.0.1 -n 40 > nul"' -PassThru -WindowStyle Hidden
          Start-Sleep -Milliseconds 500
          # The first-install assertion leaves this marker behind; isolate the refusal assertion.
          Remove-Item $env:WARDER_GUI_SMOKE_READY_FILE -Force -ErrorAction SilentlyContinue
          $env:WARDER_TEST_NO_PAUSE = '1'
          $blockedStdout = Join-Path $env:RUNNER_TEMP 'blocked-update-stdout.txt'
          $blockedStderr = Join-Path $env:RUNNER_TEMP 'blocked-update-stderr.txt'
          $blocked = Start-Process -FilePath $env:ComSpec -ArgumentList @('/c', "`"$launcher`"") -PassThru -Wait -RedirectStandardOutput $blockedStdout -RedirectStandardError $blockedStderr
          Remove-Item Env:\WARDER_TEST_NO_PAUSE -ErrorAction SilentlyContinue
          if ($blocked.ExitCode -eq 0) { Stop-Process -Id $oldProcess.Id -Force -ErrorAction SilentlyContinue; throw "Installer claimed success while the previous Factory executable was running" }
          if (Test-Path -LiteralPath $env:WARDER_GUI_SMOKE_READY_FILE) { Stop-Process -Id $oldProcess.Id -Force -ErrorAction SilentlyContinue; throw "Installer launched an application after refusing the update" }
          if (-not (Test-Path -LiteralPath $installed) -or (Get-FileHash -Algorithm SHA256 -LiteralPath $installed).Hash -ne $oldExeSha) { Stop-Process -Id $oldProcess.Id -Force -ErrorAction SilentlyContinue; throw "Blocked update changed the old executable" }
          $installerLog = 'D:\WARDER-PICON-FACTORY\09-LOGS\installer.log'
          if (-not (Test-Path -LiteralPath $installerLog) -or -not (Get-Content -LiteralPath $installerLog -Raw).Contains('older installed Factory is still running')) {
            $logText = if (Test-Path -LiteralPath $installerLog) { Get-Content -LiteralPath $installerLog -Raw } else { '(no installer log)' }
            $outText = if (Test-Path -LiteralPath $blockedStdout) { Get-Content -LiteralPath $blockedStdout -Raw } else { '(no stdout)' }
            $errText = if (Test-Path -LiteralPath $blockedStderr) { Get-Content -LiteralPath $blockedStderr -Raw } else { '(no stderr)' }
            Stop-Process -Id $oldProcess.Id -Force -ErrorAction SilentlyContinue
            throw "Installer did not record a running-app refusal. Exit=$($blocked.ExitCode); log=$logText; stdout=$outText; stderr=$errText"
          }
          Stop-Process -Id $oldProcess.Id -Force -ErrorAction SilentlyContinue
          Start-Sleep -Milliseconds 250
          $proc = Start-Process -FilePath $env:ComSpec -ArgumentList @('/c', "`"$launcher`"") -PassThru -Wait
          if ($proc.ExitCode -ne 0) {
            $log = 'D:\WARDER-PICON-FACTORY\09-LOGS\installer.log'
            if (Test-Path $log) { Get-Content $log }
            throw "One-click CMD failed with exit code $($proc.ExitCode)"
          }
          $ready = $false
          for ($i = 0; $i -lt 120; $i++) {
            if (Test-Path $env:WARDER_GUI_SMOKE_READY_FILE) { $ready = $true; break }
            Start-Sleep -Milliseconds 500
          }
          if (-not $ready) { throw "One-click CMD did not install and launch the GUI" }
          $identity = Get-Content $env:WARDER_GUI_SMOKE_READY_FILE -Raw | ConvertFrom-Json
          if ($identity.build_commit -ne (git rev-parse HEAD).Trim()) { throw "CMD launched a stale build: $($identity.build_commit)" }
          if ($identity.executable_path -ine 'D:\WARDER-PICON-FACTORY\11-APP\WARDER-PICON-FACTORY\WARDER-PICON-FACTORY.exe') { throw "CMD launched an executable from an unexpected path: $($identity.executable_path)" }
          if ($identity.data_root -cne 'D:\WARDER-PICON-FACTORY' -or $identity.preflight -ne 'ok') { throw "CMD-launched GUI did not use the authoritative D: workspace" }
          $version = python -c "import json;print(json.load(open('factory/app/.factory-version.json'))['version'])"
          if (-not (Test-Path $installed)) { throw "One-click CMD did not install the executable" }
          $expectedSha = (Get-FileHash -Algorithm SHA256 -LiteralPath 'factory/app/dist/WARDER-PICON-FACTORY.exe').Hash
          if ((Get-FileHash -Algorithm SHA256 -LiteralPath $installed).Hash -ne $expectedSha) { throw "Installed EXE is not the EXE packaged in the CMD" }
          $inventory = Get-Content (Join-Path $env:RUNNER_TEMP 'factory-preserve-hashes.json') | ConvertFrom-Json
          foreach ($entry in $inventory) {
            if ($entry.PreviousApp) { continue }
            $file = Join-Path 'D:\WARDER-PICON-FACTORY' $entry.Path
            if (-not (Test-Path -LiteralPath $file)) { throw "Installer removed existing data: $($entry.Path)" }
            $actual = (Get-FileHash -Algorithm SHA256 -LiteralPath $file).Hash
            if ($actual -ne $entry.Sha256) { throw "Installer modified existing data: $($entry.Path)" }
          }
           $oldExeEntry = $inventory | Where-Object { $_.PreviousApp -and $_.Path -like '*WARDER-PICON-FACTORY.exe' } | Select-Object -First 1
           $oldExeBackup = Get-ChildItem 'D:\WARDER-PICON-FACTORY\11-APP\WARDER-PICON-FACTORY' -File -Filter 'WARDER-PICON-FACTORY.exe.previous-*' | Select-Object -First 1
           if (-not $oldExeEntry -or -not $oldExeBackup -or (Get-FileHash -Algorithm SHA256 -LiteralPath $oldExeBackup.FullName).Hash -ne $oldExeEntry.Sha256) { throw "Installer failed to back up the existing executable" }
           foreach ($entry in ($inventory | Where-Object { $_.PreviousApp -and $_.Path -notlike '*WARDER-PICON-FACTORY.exe' })) {
             $preservedFile = Join-Path 'D:\WARDER-PICON-FACTORY' $entry.Path
             if (-not (Test-Path -LiteralPath $preservedFile) -or (Get-FileHash -Algorithm SHA256 -LiteralPath $preservedFile).Hash -ne $entry.Sha256) { throw "Installer moved or modified existing Python/app data: $($entry.Path)" }
           }
      - name: Smoke-test read-only user diagnostic
        shell: pwsh
        run: |
          $before = Get-Content (Join-Path $env:RUNNER_TEMP 'factory-preserve-hashes.json') | ConvertFrom-Json
          $env:WARDER_DIAG_NO_PAUSE = '1'
          $diagnostic = Join-Path $env:GITHUB_WORKSPACE 'factory/app/DIAGNOSTIKA-WARDER-PICON-FACTORY.cmd'
          & $env:ComSpec /c "`"$diagnostic`""
          Remove-Item Env:\WARDER_DIAG_NO_PAUSE -ErrorAction SilentlyContinue
          if ($LASTEXITCODE -ne 0) { throw "Read-only diagnostic script failed" }
          $report = Get-ChildItem -LiteralPath $env:TEMP -File -Filter 'WARDER-PICON-FACTORY-diagnostic-*.txt' | Sort-Object LastWriteTime -Descending | Select-Object -First 1
          if (-not $report) { throw "Read-only diagnostic did not save its report" }
          $diagnosticText = Get-Content -LiteralPath $report.FullName -Raw
          if (-not $diagnosticText.Contains('D:\WARDER-PICON-FACTORY') -or -not $diagnosticText.Contains('SHA256:')) { throw "Diagnostic report omits workspace or executable identity" }
          foreach ($entry in ($before | Where-Object { -not $_.PreviousApp })) {
            $file = Join-Path 'D:\WARDER-PICON-FACTORY' $entry.Path
            if ((Get-FileHash -Algorithm SHA256 -LiteralPath $file).Hash -ne $entry.Sha256) { throw "Read-only diagnostic changed existing data: $($entry.Path)" }
          }
      - name: Record Windows EXE build identity
        shell: pwsh
        run: |
          $exe = 'factory/app/dist/WARDER-PICON-FACTORY.exe'
          if (-not (Test-Path -LiteralPath $exe -PathType Leaf)) { throw 'Windows GUI EXE is missing after build and smoke tests' }
          $hash = (Get-FileHash -Algorithm SHA256 -LiteralPath $exe).Hash.ToLowerInvariant()
          $size = (Get-Item -LiteralPath $exe).Length
          $commit = (git rev-parse HEAD).Trim()
          if ($commit -ne $env:GITHUB_SHA) { throw "EXE identity mismatch: checked-out commit $commit differs from workflow trigger $env:GITHUB_SHA" }
          $version = (Get-Content 'factory/app/.factory-version.json' -Raw | ConvertFrom-Json).version
          $identity = [ordered]@{ version=$version; commit=$commit; workflow_run=$env:GITHUB_RUN_ID; sha256=$hash; bytes=$size; filename='WARDER-PICON-FACTORY.exe'; smoke_test='passed' }
          $identity | ConvertTo-Json | Set-Content -LiteralPath 'factory/app/dist/BUILD-IDENTITY.json' -Encoding utf8
          "### WARDER PICON FACTORY Windows build" | Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Append
          "Version: $version; commit: $commit; SHA-256: $hash; bytes: $size" | Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Append
      - name: Package Windows startup updater alongside tested EXE
        shell: pwsh
        run: |
          $target = 'factory/app/dist'
          Copy-Item 'factory/app/windows_exe_update.py' (Join-Path $target 'windows_exe_update.py')
          Copy-Item 'factory/app/windows_exe_startup.py' (Join-Path $target 'windows_exe_startup.py')
          Copy-Item 'factory/app/SPUSTI-WARDER-EXE.cmd' (Join-Path $target 'SPUSTI-WARDER-EXE.cmd')
          $identity = Get-Content (Join-Path $target 'BUILD-IDENTITY.json') -Raw | ConvertFrom-Json
          @{ version=$identity.version; commit=$identity.commit } | ConvertTo-Json | Set-Content -LiteralPath (Join-Path $target '.factory-installed-version.json') -Encoding utf8
          if (-not (Test-Path (Join-Path $target 'SPUSTI-WARDER-EXE.cmd'))) { throw 'Startup launcher missing' }
      - name: Upload standalone Windows GUI EXE (not a release)
        uses: actions/upload-artifact@v4
        with:
          name: WARDER-PICON-FACTORY-WINDOWS-EXE
          path: |
            factory/app/dist/WARDER-PICON-FACTORY.exe
            factory/app/dist/BUILD-IDENTITY.json
            factory/app/dist/windows_exe_update.py
            factory/app/dist/windows_exe_startup.py
            factory/app/dist/SPUSTI-WARDER-EXE.cmd
            factory/app/dist/.factory-installed-version.json
          if-no-files-found: error
          retention-days: 7
          include-hidden-files: true
      - name: Upload one-click Windows application (not a release)
        uses: actions/upload-artifact@v4
        with:
          name: WARDER-PICON-FACTORY-ONE-CLICK
          path: SPUSTI-WARDER-PICON-FACTORY.cmd
          retention-days: 7
      - name: Publish verified Windows release
        if: success()
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $ErrorActionPreference = 'Stop'
          $version = (Get-Content 'factory/app/.factory-version.json' -Raw | ConvertFrom-Json).version
          $identity = Get-Content 'factory/app/dist/BUILD-IDENTITY.json' -Raw | ConvertFrom-Json
          $exe = 'factory/app/dist/WARDER-PICON-FACTORY.exe'
          if ($identity.version -ne $version -or $identity.commit -ne $env:GITHUB_SHA -or $identity.smoke_test -ne 'passed') { throw 'Build identity mismatch' }
          $hash = (Get-FileHash -Algorithm SHA256 $exe).Hash.ToLowerInvariant()
          $size = (Get-Item $exe).Length
          if ($hash -ne $identity.sha256 -or $size -ne $identity.bytes) { throw 'EXE integrity mismatch' }
          gh release view $version -R $env:GITHUB_REPOSITORY 2>$null
          if ($LASTEXITCODE -eq 0) { throw 'Release exists: no overwrite' }
          gh release create $version $exe 'factory/app/dist/BUILD-IDENTITY.json' 'factory/app/dist/SPUSTI-WARDER-EXE.cmd' 'factory/app/dist/windows_exe_startup.py' 'factory/app/dist/windows_exe_update.py' --repo $env:GITHUB_REPOSITORY --target $env:GITHUB_SHA --title "WARDER PICON FACTORY $version" --notes "Windows tested executable with startup update support."
          if ($LASTEXITCODE -ne 0) { throw 'Release creation failed' }
          $assets = @{}
          foreach ($name in @('WARDER-PICON-FACTORY.exe','SPUSTI-WARDER-EXE.cmd','windows_exe_startup.py','windows_exe_update.py')) {
            $file = Join-Path 'factory/app/dist' $name
            $assets[$name] = @{ url="https://github.com/$env:GITHUB_REPOSITORY/releases/download/$version/$name"; size=(Get-Item $file).Length; sha256=(Get-FileHash -Algorithm SHA256 $file).Hash.ToLowerInvariant() }
          }
          $manifest = @{ schema=2; version=$version; commit=$env:GITHUB_SHA; assets=$assets } | ConvertTo-Json -Depth 5
          $encoded = [Convert]::ToBase64String([Text.Encoding]::UTF8.GetBytes($manifest))
          $path = 'factory/update/windows-exe-manifest.json'
          gh api -X PUT "repos/$env:GITHUB_REPOSITORY/contents/$path" -f "message=factory: publish verified $version EXE" -f branch=factory-warder-development -f "content=$encoded"
          if ($LASTEXITCODE -ne 0) { throw 'Manifest publishing failed' }
      - name: Remove disposable synthetic workspace
        if: always()
        shell: pwsh
        run: |
          $root = 'D:\WARDER-PICON-FACTORY'
          $marker = Join-Path $root '11-APP\.ci-synthetic-root'
          if (Test-Path -LiteralPath $marker) { Remove-Item -LiteralPath $root -Recurse -Force }
