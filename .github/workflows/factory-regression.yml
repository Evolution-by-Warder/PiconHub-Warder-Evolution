name: Factory regression (no release)
on:
  push:
    branches: [factory-warder-development]
    paths:
      - 'factory/app/**'
      - '.github/workflows/factory-regression.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  regression:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: factory-warder-development
      - name: Install runtime dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y python3-tk
          python -m pip install -r factory/app/requirements-runtime.txt
      - name: Compile Python source
        run: python -m compileall -q factory/app
      - name: Run all Factory regression tests
        run: cd factory/app && python -m unittest discover -p 'test_*.py' -v

      - name: Package tested Factory for Windows (no release)
        run: |
          python - <<'PY'
          from pathlib import Path
          from zipfile import ZIP_DEFLATED, ZipFile
          root = Path('factory/app')
          output = Path('warder-picon-factory-test-build.zip')
          with ZipFile(output, 'w', ZIP_DEFLATED) as archive:
              for file in sorted(root.rglob('*')):
                  if file.is_file() and not any(part in ('__pycache__', '.pytest_cache') for part in file.parts):
                      archive.write(file, file.relative_to(root))
          with ZipFile(output) as archive:
              assert archive.testzip() is None
              for required in ('engine.py', 'factory_launcher.py', 'live_png_test.py', 'SPUSTI-WARDER.cmd',
                               'templates/picons/black-sablona.png',
                               'templates/picons/white-sablona.png'):
                  assert required in archive.namelist(), required
          PY
      - name: Upload test build (not a GitHub Release)
        uses: actions/upload-artifact@v4
        with:
          name: warder-picon-factory-test-build
          path: warder-picon-factory-test-build.zip
          retention-days: 7

  windows-smoke:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: factory-warder-development
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install Factory dependencies
        run: python -m pip install -r factory/app/requirements-runtime.txt
      - name: Compile Windows Factory source
        run: python -m compileall -q factory/app
      - name: Run Factory tests on Windows
        working-directory: factory/app
        run: python -m unittest discover -p 'test_*.py' -v

      - name: Verify one-click Windows setup without launching GUI
        shell: cmd
        working-directory: factory/app
        env:
          WARDER_FACTORY_SETUP_ONLY: "1"
        run: call SPUSTI-WARDER.cmd
      - name: Check isolated runtime imports
        shell: cmd
        working-directory: factory/app
        run: .venv\Scripts\python.exe -c "import PIL, py7zr, tkinter; print('Windows runtime OK')"

      - name: Package Windows-tested source and launcher
        shell: python
        run: |
          from pathlib import Path
          from zipfile import ZipFile, ZIP_DEFLATED
          root = Path('factory/app')
          output = Path('WARDER-PICON-FACTORY-WINDOWS-TEST.zip')
          with ZipFile(output, 'w', ZIP_DEFLATED) as archive:
              for path in sorted(root.rglob('*')):
                  if path.is_file() and not any(part in ('.venv', '__pycache__', '.pytest_cache') for part in path.parts):
                      archive.write(path, path.relative_to(root))
          with ZipFile(output) as archive:
              assert archive.testzip() is None
              assert 'SPUSTI-WARDER.cmd' in archive.namelist()
              assert 'engine.py' in archive.namelist()
      - name: Upload Windows-tested package (not a release)
        uses: actions/upload-artifact@v4
        with:
          name: WARDER-PICON-FACTORY-WINDOWS-TEST
          path: WARDER-PICON-FACTORY-WINDOWS-TEST.zip
          retention-days: 7
