name: Import approved 68.5E artwork
on:
  push:
    branches: [release/gioppygio-685e-approved-20261022]
permissions:
  contents: write
jobs:
  import:
    if: contains(github.event.head_commit.message, 'Import approved 68.5E art')
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - run: python3 -m pip install 'Pillow==11.3.0'
      - name: Verify approved bytes and append missing runtime aliases
        run: python3 migration/gioppygio/68.5e-approved-20261022/import-approved.py
      - name: Commit verified PNGs
        run: |
          git config user.name 'Warder picon automation'
          git config user.email 'warder-picons@users.noreply.github.com'
          git add migration/gioppygio/68.5e-approved-20261022 picons/68.5e .transfer/gioppygio-685e
          git diff --cached --check
          git commit -m 'Add approved GG-free centered 68.5E artwork and missing runtime aliases'
          git push origin HEAD:release/gioppygio-685e-approved-20261022
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: approved-685e-publication-report
          path: migration/gioppygio/68.5e-approved-20261022/publication-report.json
