name: Radio batch 31 staging build only
on:
  push:
    branches: [work/radio-world-batch31-20261106]
    paths:
      - '.github/workflows/radio-batch31-build.yml'
      - 'picons/radio-world/staging/batch-31/sources.json'
      - 'picons/radio-world/staging/batch-31/verify_downloader.py'
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: |
            picons/radio-world
            picons/IPTV-SK-CZ/catalog/global
            plugin/artwork/templates/picons
      - uses: actions/checkout@v4
        with:
          repository: Evolution-by-Warder/Radio-Warder-Evolution
          ref: 3ab96a529de859d445a8d03ed1c37f9a5f5d6170
          path: _radio
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python3 -m pip install Pillow
      - name: Reproduce all nine variants and verify staging downloader
        run: |
          mkdir -p /tmp/radio31-masters
          cp plugin/artwork/templates/picons/white-sablona.png /tmp/radio31-masters/white.png
          cp plugin/artwork/templates/picons/black-sablona.png /tmp/radio31-masters/black.png
          batch=picons/radio-world/staging/batch-31
          world=picons/IPTV-SK-CZ/catalog/global/search/2ae88890a953c2f68d3f20352ad56a7390645bd3ce189573dd94e50c8a65abfe.json.gz
          python3 picons/radio-world/render_verified_batch.py "$batch" "$world" /tmp/radio31-masters
          sha256sum "$batch"/*.zip > /tmp/radio31-first.sha256
          python3 picons/radio-world/render_verified_batch.py "$batch" "$world" /tmp/radio31-masters
          sha256sum -c /tmp/radio31-first.sha256
          python3 picons/radio-world/verify_batch.py "$batch"
          python3 "$batch"/verify_downloader.py _radio "$world"
      - name: Save verified staging files to the same work branch
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add picons/radio-world/staging/batch-31
          if ! git diff --cached --quiet; then
            git commit -m "Save verified batch 31 staging PNG archives and downloader proof"
            git push origin HEAD:work/radio-world-batch31-20261106
          fi
      - uses: actions/upload-artifact@v4
        with:
          name: radio-batch31-verified
          path: picons/radio-world/staging/batch-31
