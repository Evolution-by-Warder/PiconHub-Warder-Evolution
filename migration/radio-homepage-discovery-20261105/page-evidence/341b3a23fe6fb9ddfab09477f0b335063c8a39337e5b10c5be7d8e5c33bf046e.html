            z-index: 100; 
            text-transform: uppercase; 
            font-size: clamp(8px, 1.8vw, 11px);

            letter-spacing: 1px;

        .close-vox { position: absolute; top: 20px; right: 25px; font-size: 40px; color: #fff; background: none; border: none; cursor: pointer; }

    const schedule = {

        3: [[&quot;00:00&quot;,&quot;Musicvox Overnight&quot;],[&quot;07:00&quot;,&quot;RFI Enlace&quot;],[&quot;07:30&quot;,&quot;Flashback&quot;],[&quot;10:00&quot;,&quot;Música Por Tandas&quot;],[&quot;12:00&quot;,&quot;Planeta 3&quot;],[&quot;13:00&quot;,&quot;Música Por Tandas&quot;],[&quot;17:00&quot;,&quot;Freeway&quot;],[&quot;19:00&quot;,&quot;Música Por Tandas&quot;],[&quot;20:00&quot;,&quot;Amplificador&quot;],[&quot;21:00&quot;,&quot;Música Por Tandas&quot;],[&quot;22:00&quot;,&quot;Musicvox Overnight&quot;]],

    function updateUI() {
        const bog = new Date(new Date().toLocaleString(&quot;en-US&quot;, {timeZone: &quot;America/Bogota&quot;}));
        const day = bog.getDay(), hm = bog.getHours().toString().padStart(2,&#39;0&#39;) + &quot;:&quot; + bog.getMinutes().toString().padStart(2,&#39;0&#39;);
        const today = schedule[day];
        let cShow = &quot;Musicvox FM&quot;, nShow = &quot;Música&quot;;
        for (let i = 0; i &lt; today.length; i++) { if (hm &gt;= today[i][0]) { cShow = today[i][1]; nShow = today[i+1] ? today[i+1][1] : schedule[(day+1)%7][0][1]; } }
        document.getElementById(&#39;current-show&#39;).innerText = cShow;
        document.getElementById(&#39;next-show&#39;).innerText = nShow;

        fetch(&quot;https://radio.juanjuiserver.com/api/nowplaying/musicvoxfm?t=&quot; + Date.now())
            .then(r =&gt; r.json()).then(d =&gt; {
                const s = d.now_playing.song;
                if(s.title !== currentTrack.title) {
                    currentTrack = { artist: s.artist, title: s.title };
                    document.getElementById(&#39;api-artist&#39;).innerText = (s.artist || &quot;MUSICVOX FM&quot;).toUpperCase();

                    document.getElementById(&#39;spotify-link&#39;).href = `https://open.spotify.com/search/${query}`;
                    
                    fetch(`https://itunes.apple.com/search?term=${query}&amp;entity=song&amp;limit=1`)
                        .then(res =&gt; res.json()).then(it =&gt; {
                            const img = document.getElementById(&#39;api-art&#39;);
                            if(it.results?.[0]) {
                                img.src = it.results[0].artworkUrl100.replace(&#39;100x100&#39;,&#39;600x600&#39;);
                            } else {
                                img.src = &quot;https://static.mytuner.mobi/media/tvos_radios/975/musicvox-fm.eb3bd43d.png&quot;;
                            }
                        }).catch(() =&gt; {
                            document.getElementById(&#39;api-art&#39;).src = &quot;https://static.mytuner.mobi/media/tvos_radios/975/musicvox-fm.eb3bd43d.png&quot;;
                        });
                }
            });
    }

    async function loadLyrics() {
        const modalBody = document.getElementById(&#39;ly-body&#39;);
        document.getElementById(&#39;ly-track&#39;).innerText = `${currentTrack.artist} - ${currentTrack.title}`;
        modalBody.innerHTML = &#39;&lt;p style=&quot;text-align:center; color:#aaa;&quot;&gt;Cargando letra...&lt;/p&gt;&#39;;

        const cleanArtist = currentTrack.artist.replace(/\(.*\)/g, &#39;&#39;).trim();
        const cleanTitle = currentTrack.title.replace(/\(.*\)/g, &#39;&#39;).trim();
        const query = encodeURIComponent(`${cleanArtist} ${cleanTitle}`);

        try {
            let res = await fetch(`https://lrclib.net/api/get?artist_name=${encodeURIComponent(cleanArtist)}&amp;track_name=${encodeURIComponent(cleanTitle)}`);
            if (res.ok) {
                const data = await res.json();
                if (data &amp;&amp; data.plainLyrics) {
                    modalBody.innerText = data.plainLyrics;
                    return;
                }
            }

            let searchRes = await fetch(`https://lrclib.net/api/search?q=${query}`);
            let searchData = await searchRes.json();
            if (searchData &amp;&amp; searchData.length &gt; 0 &amp;&amp; searchData[0].plainLyrics) {
                modalBody.innerText = searchData[0].plainLyrics;
                return;
            }

            modalBody.innerHTML = `
                &lt;div style=&quot;text-align: center; padding: 15px 0;&quot;&gt;
                    &lt;p style=&quot;color: #aaa; font-size: 0.9em; margin-bottom: 15px;&quot;&gt;La letra de esta canción no está disponible en la base abierta.&lt;/p&gt;
                    &lt;a href=&quot;https://www.google.com/search?q=${query}+letra&quot; target=&quot;_blank&quot; 
                       style=&quot;background: var(--btn-active); color: #000; padding: 10px 20px; border-radius: 15px; text-decoration: none; font-weight: bold; display: inline-block;&quot;&gt;
                        🔍 Buscar en Google
                    &lt;/a&gt;
                &lt;/div&gt;
            `;
        } catch {
            modalBody.innerHTML = `
                &lt;div style=&quot;text-align: center; padding: 15px 0;&quot;&gt;
                    &lt;p style=&quot;color: #aaa; font-size: 0.9em; margin-bottom: 15px;&quot;&gt;Error al conectar con el servidor de letras.&lt;/p&gt;
                    &lt;a href=&quot;https://www.google.com/search?q=${query}+letra&quot; target=&quot;_blank&quot; 
                       style=&quot;background: #fff; color: #000; padding: 10px 20px; border-radius: 15px; text-decoration: none; font-weight: bold; display: inline-block;&quot;&gt;
                        🔍 Buscar en Google
                    &lt;/a&gt;
                &lt;/div&gt;
            `;
        }
    }

    function openModal(id) { 
        document.getElementById(id).style.display = &#39;flex&#39;; 
        if(id === &#39;lyrics-modal&#39;) loadLyrics(); 
    }
    
    function closeModal(id) { document.getElementById(id).style.display = &#39;none&#39;; }
    
    function toggleStream() {
        if (stream.paused) { 
            stream.play(); isPlaying = true; 
            playBtn.classList.add(&#39;is-playing-btn&#39;); 
            document.getElementById(&#39;p-play&#39;).style.display=&#39;none&#39;; 
            document.getElementById(&#39;p-pause&#39;).style.display=&#39;block&#39;; 
        } else { 
            stream.pause(); isPlaying = false; 
            playBtn.classList.remove(&#39;is-playing-btn&#39;); 
            document.getElementById(&#39;p-play&#39;).style.display=&#39;block&#39;; 
            document.getElementById(&#39;p-pause&#39;).style.display=&#39;none&#39;; 
        }
    }

    function getAngle(x, y) { const r = cd.getBoundingClientRect(); return Math.atan2(y - (r.top + r.height/2), x - (r.left + r.width/2)) * 180 / Math.PI; }
    function handleStart(e) { isDragging = true; const ev = e.touches ? e.touches[0] : e; startAngle = getAngle(ev.clientX, ev.clientY) - currentRotation; cd.style.transition = &quot;none&quot;; }
    function handleMove(e) { if (!isDragging) return; const ev = e.touches ? e.touches[0] : e; currentRotation = getAngle(ev.clientX, ev.clientY) - startAngle; cd.style.transform = `rotate(${currentRotation}deg)`; }
    function handleEnd() { isDragging = false; }

    cd.addEventListener(&#39;mousedown&#39;, handleStart); window.addEventListener(&#39;mousemove&#39;, handleMove); window.addEventListener(&#39;mouseup&#39;, handleEnd);
    cd.addEventListener(&#39;touchstart&#39;, handleStart, {passive: false}); window.addEventListener(&#39;touchmove&#39;, handleMove, {passive: false}); window.addEventListener(&#39;touchend&#39;, handleEnd);

    function animate() { if (isPlaying &amp;&amp; !isDragging) { currentRotation += 0.8; cd.style.transform = `rotate(${currentRotation}deg)`; } requestAnimationFrame(animate); }
    animate();

    document.getElementById(&#39;volume-control&#39;).addEventListener(&#39;input&#39;, (e) =&gt; { stream.volume = e.target.value; });
    setInterval(updateUI, 10000); 
    updateUI();
