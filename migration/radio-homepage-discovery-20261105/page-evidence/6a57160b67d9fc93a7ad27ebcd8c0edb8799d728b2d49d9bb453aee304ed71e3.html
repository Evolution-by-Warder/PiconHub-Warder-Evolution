<!doctype html>
<html lang="fr" class="h-100">
<head>
<!-- Required meta tags -->
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">

<!-- Bootstrap CSS -->
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-1BmE4kWBq78iYhFldvKuhfTAU6auU8tT94WrHftjDbrCEXSU1oBoqyl2QvZ6jIW3" crossorigin="anonymous">
<link href="./scss/custom.css" rel="stylesheet">

<title>Player | KissWestCoast</title>
</head>
<body class="d-flex h-100">
	<div class="cover-container d-flex w-100 h-100 mx-auto flex-column">
		<header class="mb-5 mb-lg-auto">
			<span id="logo" class="float-end d-none d-md-block"></span>
			<div class="container mt-1 mb-3">
				<img src="/images/KFM_WC_SRM.png" />
			</div>
		</header>


		<div class="container mt-md-5 mt-lg-0">
			<div class="row">
				<div class="col col-lg-6 mx-auto text-center">
					<div class="bg-dark bg-gradient bg-opacity-10 p-3 py-md-4 px-md-5 rounded-3 shadow text-center bg-kiss">
						<div class="d-block">
							<span class="badge bg-danger align-middle fs-4 shadow mb-4">ON AIR</span>
						</div>
						<div class="row">
							<div class="col-12 col-md-6 order-2 order-md-1 px-5 px-md-0">
								<img id="albumArtwork" src="/images/pochetteVide.jpg" class="rounded" alt="Pochette de l'album">
							</div>

							<div class="col-12 col-md-6 order-1 order-md-2">
								<h6 id="title" class="align-middle display-6 fs-4"></h6>

								<audio id="player" controls class="d-none" preload="none" src="https://kisswestcoast.ice.infomaniak.ch/kisswestcoast-64.aac">
								<p>Votre navigateur ne prend pas en charge l'audio HTML5.
					  			Voici un <a href="https://kisswestcoast.ice.infomaniak.ch/kisswestcoast-64.aac" target="_blank">lien vers le fichier audio</a>
					  			à la place.</p>
								</audio>
								<i id="radioPlayer" onclick="playPause('player')" class="bi bi-play-circle"></i>
							</div>
						</div>
					</div>
				</div>
			</div>

		</div>
		
		<div>
			<div style="display:flex ; justify-content: center ; gap:10px ; margin:10px">
				<a href="https://apps.apple.com/app/kiss-fm-west-coast/id1628575213" target="_blank" title="Télécharger sur l'App Store"><img src="/images/logo_appstore.png" style="width:60px"></a>
				<a href="https://play.google.com/store/apps/details?id=com.icreo.kissfmwestcoast" target="_blank" title="Télécharger sur Google Play"><img src="/images/logo_googleplay.png" style="width:60px"></a>
			</div>
		</div>
		
		<footer class="container d-flex flex-wrap justify-content-between align-items-center py-3 mt-auto border-top">
			<div class="col-md-4 d-flex align-items-center">
				<a href="https://kissfm.fr" class=" me-2 mb-0 text-muted text-decoration-none lh-1">
					KissFM
				</a>
				<span class="text-muted align-middle">© 2026</span>
			</div>

			<ul class="nav col-md-4 justify-content-end list-unstyled d-flex">
				<li class="ms-3 align-middle fs-3"><a class="text-muted" href="https://kissfm.fr/contact/" target="_blank"><i class="bi bi-envelope-fill"></i></a></li>
			</ul>
		</footer>
	</div>
	<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/js/bootstrap.bundle.min.js" integrity="sha384-ka7Sk0Gln4gmtz2MlQnikT1wXgYsOg+OMhuP+IlRH9sENBO0LRn5q+8nbTov4+1p" crossorigin="anonymous"></script>
	<script src="https://ajax.googleapis.com/ajax/libs/jquery/3.6.0/jquery.min.js"></script>
	<script src="/scripts/script.js"></script>
</body>
</html>
