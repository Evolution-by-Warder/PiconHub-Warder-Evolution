<html>
    <head>
        <title>Radio Shadhin</title>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <link href="https://fonts.googleapis.com/css?family=Open+Sans" rel="stylesheet">
        <link rel="stylesheet" href="css/jplayer.blue.monday.css" >
        <script defer="defer" type="text/javascript" src="js/jquery-1.11.0.js"></script>
        <script defer="defer" type="text/javascript" src="js/jquery.jplayer.min.js"></script>
        <script defer="defer" type="text/javascript" src="js/custom.js"></script>
    </head>
    <body>
        <div id="jquery_jplayer_1" class="jp-jplayer"></div>
        <div id="jp_container_1" class="jp-audio" role="application" aria-label="media player">
            <div class="jp-type-single">
                <div class="jp-gui jp-interface">
                    <div class="jp-volume-controls">
                        <button class="jp-mute" role="button" tabindex="0">mute</button>
                        <button class="jp-volume-max" role="button" tabindex="0">max volume</button>
                        <div class="jp-volume-bar">
                            <div class="jp-volume-bar-value"></div>
                        </div>
                    </div>

                    <div class="controll_wrapper">
                        <div class="jp-controls">
                            <button class="jp-play" role="button" tabindex="0">play</button>
                        </div>
                    </div>
                </div>
                <div class="jp-details">
                    <div class="coming_soon">
                      <p>Keep listening to Radio Shadhin 92.4FM. We will be back soon.</p>
                    </div>
                    <div class="" aria-label="">
                        <ul class="sociala">
                            <li><a href=""><img src="images/social_icons/youtube.png" ></a></li>
                            <li><a href=""><img src="images/social_icons/google.png" ></a></a></li>
                            <li><a href=""><img src="images/social_icons/facebook.png" ></a></a></li>
                            <li><a href=""><img src="images/social_icons/twitter.png" ></a></a></li>
                        </ul>
                    </div>
                </div>

            </div>
        </div>
    </body>
</html>
