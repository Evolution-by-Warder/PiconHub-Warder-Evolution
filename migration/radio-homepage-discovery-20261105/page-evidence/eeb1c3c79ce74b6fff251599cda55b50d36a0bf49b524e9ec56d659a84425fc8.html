<p><strong>Sicherheitsmaßnahmen</strong><br>
Antenne trifft nach Maßgabe des Art 32 DSGVO (unter Berücksichtigung des Stands der Technik, der Implementierungskosten und der Art, des Umfangs, der Umstände und der Zwecke der Verarbeitung sowie der unterschiedlichen Eintrittswahrscheinlichkeit und Schwere des Risikos für die Rechte und Freiheiten natürlicher Personen) geeignete technische und organisatorische Maßnahmen, um ein dem Risiko angemessenes Schutzniveau zu gewährleisten. 
Zu diesen Maßnahmen gehören insbesondere die Sicherung der Vertraulichkeit, Integrität und Verfügbarkeit von Daten durch Kontrolle des physischen Zugangs zu den Daten, als auch des sie betreffenden Zugriffs, der Eingabe, Weitergabe, der Sicherung der Verfügbarkeit und ihrer Trennung. Zudem wurden Verfahren eingerichtet, die eine Wahrnehmung von Betroffenenrechten, Löschung von Daten und Reaktion auf Gefährdung der Daten gewährleisten. Der Schutz personenbezogener Daten wird bereits bei der Entwicklung bzw. Auswahl von Hardware, Software sowie Verarbeitungsprozessen entsprechend dem Prinzip des Datenschutzes durch Technikgestaltung und durch datenschutzfreundliche Voreinstellungen berücksichtigt (Art 25 DSGVO).

<p><strong>Übermittlung von Daten in Drittländer</strong><br>
Sofern Daten in einem Drittland (Drittland bedeutet ein Land außerhalb der Europäischen Union oder des Europäischen Wirtschaftsraums) verarbeitet werden oder dies im Rahmen der Inanspruchnahme von Diensten Dritter oder Offenlegung bzw. Übermittlung von Daten an Dritte geschieht, erfolgt dies nur, wenn es zur Erfüllung der vertraglichen und/oder vorvertraglichen Pflichten, auf Grundlage von Einwilligung, aufgrund einer rechtlichen Verpflichtung oder auf Grundlage von berechtigten Interessen geschieht. 
Vorbehaltlich gesetzlicher oder vertraglicher Berechtigung werden Daten in einem Drittland nur bei Vorliegen der besonderen Voraussetzungen der Art 44 ff DSGVO verarbeitet. Das bedeutet, dass die Verarbeitung zB auf Grundlage besonderer Garantien erfolgt wie der offiziell anerkannten Feststellung eines der EU entsprechenden Datenschutzniveaus (zB für die USA durch das „Privacy Shield“) oder unter Beachtung offiziell anerkannter spezieller vertraglicher Verpflichtungen („Standardvertragsklauseln“).</p>

<p><strong>Dauer der Speicherung bzw. Löschung von Daten</strong><br>

Rechte der Betroffenen</p>

<p><strong>Grundlage</strong><br>
Art 15 DSGVO "Auskunft": Der Nutzer bzw. der Betroffene hat das Recht, Auskunft darüber zu verlangen, ob personenbezogene Daten von ihm verarbeitet werden.
Art 16 DSGVO "Berichtigung": Der Nutzer bzw. der Betroffene hat das Recht, unverzüglich die Berichtigung unrichtiger personenbezogener Daten oder deren Vervollständigung zu verlangen. 
Art 17 DSGVO „Löschung": Der Nutzer bzw. der Betroffene hat das Recht zu verlangen, dass die personenbezogenen Daten unverzüglich gelöscht werden, sofern die in Art 17 Abs 1 DSGVO genannten Gründe erfüllt sind.
Art 18 DSGVO „Einschränkung" Der Nutzer bzw. der Betroffene hat das Recht zu verlangen, dass die Verarbeitung der personenbezogenen Daten eingeschränkt wird, sofern die in Art 18 Abs 1 DSGVO genannten Gründe erfüllt sind.
Art 21 DSGVO „Widerspruch":
Widerspruch Profiling: Der Nutzer bzw. Betroffene hat das Recht, jederzeit gegen die Verarbeitung seiner personenbezogenen Daten zum Zwecke des Profiling Widerspruch einzulegen.
Widerspruch Direktwerbung: Der Nutzer bzw. der Betroffene hat das Recht, jederzeit Widerspruch gegen die Verarbeitung seiner personenbezogenen Daten zum Zwecke der Direktwerbung einzulegen.</p>

<p>Art 20 DSGVO „Datenübertragbarkeit": Der Nutzer bzw. der Betroffene hat das Recht, seine personenbezogenen Daten in einem strukturierten, gängigen und maschinenlesbaren Format zu erhalten.</p>
