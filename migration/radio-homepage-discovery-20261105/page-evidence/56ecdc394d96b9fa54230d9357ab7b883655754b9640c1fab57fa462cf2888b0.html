    <style>/* Footer général */
.custom-footer {
  width: 100%;
  text-align: center;
  padding: 15px 0;
  position: fixed;
  bottom: 0;
  left: 0;
  z-index: 9999;
  font-family: Arial, sans-serif;
  box-shadow: 0 -2px 5px rgba(0,0,0,0.3);
}

.custom-footer a {
  display: inline-flex;
  align-items: center;
  gap: 6px;
  margin: 0 10px;
  padding: 8px 18px;
  border-radius: 25px;
  text-decoration: none;
  transition: background 0.3s ease, transform 0.2s ease;
  font-size: 14px;
}

/* ======= Fond personnalisé ======= */
body.page-minimal {
  background-color: #000f1f; /* couleur de fond */
  background-repeat: no-repeat;
  background-position: center;
  background-size: contain;
}



/* --- Thème sombre (dark) --- */
@media (prefers-color-scheme: dark) {
  .custom-footer {
    background-color: #22252f; /* fond du player */
    color: #f1f1f1;
  }

  .custom-footer a {
    background: #2C363D; /* boutons/emphase */
    color: #ffffff;
  }

  .custom-footer a:hover {
    background: #3a464f; /* version plus claire au hover */
    transform: scale(1.05);
  }
}

/* --- Thème clair (light) --- */
@media (prefers-color-scheme: light) {
  .custom-footer {
    background-color: #f9f9f9;
    color: #222222;
    box-shadow: 0 -2px 5px rgba(0,0,0,0.15);
  }

  .custom-footer a {
    background: #e0e0e0;
    color: #222222;
  }

  .custom-footer a:hover {
    background: #cccccc;
    transform: scale(1.05);
  }
}

/* Mobile */
@media (max-width: 600px) {
  .custom-footer a {
    margin: 5px 6px;
    padding: 6px 12px;
    font-size: 13px;
  }
}[data-bs-theme] body.page-minimal {
