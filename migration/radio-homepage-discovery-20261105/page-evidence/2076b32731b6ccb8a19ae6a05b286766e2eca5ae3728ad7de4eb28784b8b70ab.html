<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Reflex Radio - Écoutez en ligne</title>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600&display=swap" rel="stylesheet"/>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: 'Poppins', sans-serif;
      background: linear-gradient(135deg, #1d1f27, #3b3d4e);
      color: #fff;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      text-align: center;
      padding: 2rem;
    }

    .logo {
      font-size: 2.5rem;
      font-weight: 600;
      margin-bottom: 1rem;
      color: #f72585;
    }

    .message {
      font-size: 1.2rem;
      margin-bottom: 2rem;
      max-width: 600px;
      line-height: 1.6;
    }

    .btn {
      padding: 0.8rem 1.5rem;
      background-color: #7209b7;
      border: none;
      border-radius: 8px;
      color: white;
      font-size: 1rem;
      font-weight: 600;
      cursor: pointer;
      text-decoration: none;
      transition: background-color 0.3s ease;
    }

    .btn:hover {
      background-color: #560bad;
    }

    footer {
      margin-top: 3rem;
      font-size: 0.9rem;
      opacity: 0.6;
    }
  </style>
</head>
<body>
  <div class="logo">🎧 Reflex Radio</div>
  <div class="message">
    Notre serveur principal est momentanément indisponible.<br/>
    Pas de panique ! Vous pouvez toujours écouter Reflex Radio en ligne.
  </div>
  <a href="/player" class="btn" target="_blank" rel="noopener noreferrer">
    Écouter la radio maintenant
  </a>
  <footer>
    Reflex Radio — Tous droits réservés © 2025
  </footer>
</body>
</html>
