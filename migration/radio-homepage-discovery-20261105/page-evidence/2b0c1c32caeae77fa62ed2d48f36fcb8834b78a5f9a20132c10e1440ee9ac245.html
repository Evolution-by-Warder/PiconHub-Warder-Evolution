<link rel="icon" type="image/x-icon" href="https://media.boomboxradio.fr/favicon.ico">

<style>
html, body {
  margin: 0;
  min-height: 100%;
  font-family: Arial, sans-serif;
  color: white;
  background: #030306;
}

body {
  background:
    linear-gradient(rgba(0,0,0,.15), rgba(0,0,0,.25)),
    url("https://media.boomboxradio.fr/home-skyline.png") center center / cover no-repeat fixed;
}

.top-nav {
  position: fixed;
  top: 18px;
  left: 50%;
  transform: translateX(-50%);
  z-index: 50;
  width: calc(100% - 36px);
  max-width: 980px;
  padding: 10px 18px;
  border-radius: 999px;
  background: rgba(0,0,0,.42);
  border: 1px solid rgba(255,255,255,.14);
  backdrop-filter: blur(14px);
  box-shadow:
    0 12px 35px rgba(0,0,0,.35),
    0 0 28px rgba(255,0,105,.12);
  display: flex;
  align-items: center;
  justify-content: space-between;
}

.nav-logo {
  display: flex;
  align-items: center;
  text-decoration: none;
}

.nav-logo img {
  height: 54px;
  width: auto;
  object-fit: contain;
  filter:
    drop-shadow(0 0 12px rgba(255,0,105,.55))
    drop-shadow(0 0 18px rgba(0,200,255,.22));
}

.nav-links {
  display: flex;
  gap: 18px;
  align-items: center;
}

.nav-links a {
  color: rgba(255,255,255,.82);
  text-decoration: none;
  font-size: 13px;
  font-weight: 700;
  letter-spacing: 1px;
  text-transform: uppercase;
}

.nav-links a:hover {
  color: white;
  text-shadow:
    0 0 12px rgba(255,0,105,.75),
    0 0 18px rgba(0,200,255,.45);
}

.hero {
  min-height: 100vh;
  display: flex;
  align-items: center;
  justify-content: center;
  padding: 115px 22px 35px;
  text-align: center;
  position: relative;
  overflow: hidden;
}

.hero::before {
  content: "";
  position: absolute;
  inset: 0;
  background:
    radial-gradient(circle at center, rgba(255,0,105,.20), transparent 32%),
    radial-gradient(circle at bottom right, rgba(0,200,255,.22), transparent 35%);
  pointer-events: none;
}

.hero::after {
  content: "";
  position: absolute;
  inset: 0;
  background:
    radial-gradient(circle at 20% 30%, rgba(255,0,105,.18), transparent 18%),
    radial-gradient(circle at 80% 65%, rgba(0,200,255,.16), transparent 20%),
    radial-gradient(circle at 50% 80%, rgba(124,77,255,.10), transparent 22%);
  opacity: .75;
  pointer-events: none;
  animation: ambientMove 18s ease-in-out infinite alternate;
}

.content {
  position: relative;
  z-index: 3;
  width: 100%;
  max-width: 780px;
  padding: 35px 24px;
}

.logo {
  width: 90%;
  max-width: 430px;
  display: block;
  margin: 0 auto 18px;
  filter:
    drop-shadow(0 0 22px rgba(255,0,105,.75))
    drop-shadow(0 0 35px rgba(0,200,255,.25));
  animation: logoPulse 3.5s ease-in-out infinite;
}

.live {
  display: inline-block;
  margin: 0 auto 24px;
  padding: 9px 22px;
  border-radius: 999px;
  background: rgba(255,0,105,.18);
  border: 1px solid rgba(255,0,105,.45);
  color: #ff4f96;
  font-weight: bold;
  letter-spacing: 3px;
  animation: pulse 1.3s infinite;
}

.slogan {
  margin: 0 auto 30px;
  width: 100%;
  max-width: 720px;
  display: flex;
  justify-content: center;
}

.slogan img {
  width: 100%;
  max-width: 620px;
  height: auto;
  display: block;
  filter:
    drop-shadow(0 0 18px rgba(255,0,105,.22))
    drop-shadow(0 0 30px rgba(0,200,255,.12));
  animation: sloganFloat 5s ease-in-out infinite;
}

.now {
  margin: 28px auto;
  padding: 18px 22px;
  max-width: 560px;
  border-radius: 22px;
  background: rgba(5,5,12,.62);
  border: 1px solid rgba(255,0,105,.35);
  box-shadow:
    0 0 28px rgba(255,0,105,.22),
    0 0 38px rgba(0,200,255,.12);
  backdrop-filter: blur(12px);
  transition: box-shadow .4s ease, transform .4s ease;
}

.now-refresh {
  box-shadow:
    0 0 34px rgba(255,0,105,.38),
    0 0 52px rgba(0,200,255,.25);
  transform: scale(1.01);
}

.now span {
  display: block;
  color: #8eeaff;
  font-size: 13px;
  text-transform: uppercase;
  letter-spacing: 3px;
  margin-bottom: 12px;
}

.cover-wrap {
  width: 140px;
  height: 140px;
  margin: 0 auto 18px;
  border-radius: 24px;
  overflow: hidden;
  background: rgba(0,0,0,.45);
  box-shadow:
    0 0 28px rgba(255,0,105,.42),
    0 0 48px rgba(0,200,255,.22);
  animation: coverPulse 4s ease-in-out infinite;
}

.cover-wrap img {
  width: 100%;
  height: 100%;
  object-fit: cover;
  transition: opacity .45s ease;
}

#nowplaying {
  color: white;
  font-size: clamp(18px, 3vw, 24px);
  font-weight: 800;
  line-height: 1.35;
  text-shadow: 0 0 12px rgba(0,200,255,.55);
  transition: opacity .35s ease;
}

.eq {
  height: 46px;
  margin-top: 22px;
  display: flex;
  justify-content: center;
  align-items: flex-end;
  gap: 4px;
}

.eq span {
  width: 5px;
  border-radius: 999px;
  background: linear-gradient(to top, #ff0066, #00c8ff);
  animation: eqAnim 1s ease-in-out infinite;
}

.eq span:nth-child(1) { height: 12px; animation-delay: .1s; }
.eq span:nth-child(2) { height: 28px; animation-delay: .2s; }
.eq span:nth-child(3) { height: 18px; animation-delay: .3s; }
.eq span:nth-child(4) { height: 38px; animation-delay: .4s; }
.eq span:nth-child(5) { height: 22px; animation-delay: .5s; }
.eq span:nth-child(6) { height: 42px; animation-delay: .6s; }
.eq span:nth-child(7) { height: 16px; animation-delay: .7s; }
.eq span:nth-child(8) { height: 34px; animation-delay: .8s; }
.eq span:nth-child(9) { height: 26px; animation-delay: .9s; }
.eq span:nth-child(10) { height: 38px; animation-delay: 1s; }
.eq span:nth-child(11) { height: 20px; animation-delay: 1.1s; }
.eq span:nth-child(12) { height: 30px; animation-delay: 1.2s; }

.buttons {
  display: flex;
  justify-content: center;
  gap: 18px;
  flex-wrap: wrap;
  margin-top: 34px;
}

.btn {
  padding: 16px 32px;
  border-radius: 999px;
  text-decoration: none;
  color: white;
  font-weight: bold;
  background: linear-gradient(90deg, #ff0066, #7c4dff, #00c8ff);
}

.btn.secondary {
  background: rgba(0,0,0,.35);
  border: 1px solid rgba(255,255,255,.25);
}

.genres {
  margin: 40px auto 0;
  max-width: 760px;
  color: rgba(255,255,255,.82);
  font-size: 14px;
  line-height: 1.9;
}

.footer {
  text-align: center;
  padding: 22px 20px 34px;
  font-size: 12px;
  color: rgba(255,255,255,.35);
}

.footer a {
  color: rgba(255,255,255,.35);
  text-decoration: none;
  transition: .25s ease;
}

.footer a:hover {
  color: #ff0066;
}

@keyframes ambientMove {
  0% { transform: translate3d(-10px, -8px, 0) scale(1); filter: blur(0px); }
  100% { transform: translate3d(12px, 10px, 0) scale(1.04); filter: blur(2px); }
}

@keyframes eqAnim {
  0%,100% { transform: scaleY(.45); opacity: .6; }
  50% { transform: scaleY(1.25); opacity: 1; }
}

@keyframes coverPulse {
  0%,100% { transform: scale(1); }
  50% { transform: scale(1.03); }
}

@keyframes pulse {
  0%,100% { opacity: 1; }
  50% { opacity: .45; }
}

@keyframes logoPulse {
  0%,100% { transform: scale(1); }
  50% { transform: scale(1.035); }
}

@keyframes sloganFloat {
  0%,100% { transform: translateY(0); }
  50% { transform: translateY(-3px); }
}

@media (max-width: 700px) {
  body {
    background-attachment: scroll;
    background-position: center top;
  }

  .top-nav {
    top: 10px;
    width: calc(100% - 20px);
    padding: 8px 10px;
    border-radius: 22px;
  }

  .nav-logo img {
    height: 36px;
  }

  .nav-links {
    gap: 7px;
  }

  .nav-links a {
    font-size: 9px;
    letter-spacing: .4px;
  }

  .hero {
    min-height: auto;
    padding: 92px 14px 36px;
  }

  .content {
    padding: 18px 4px;
    max-width: 100%;
  }

  .logo {
    max-width: 280px;
    margin-bottom: 14px;
  }

  .live {
    padding: 7px 16px;
    font-size: 12px;
    letter-spacing: 2px;
    margin-bottom: 18px;
  }

  .now {
    margin: 22px auto;
    padding: 16px 14px;
    border-radius: 20px;
  }

  .cover-wrap {
    width: 105px;
    height: 105px;
    border-radius: 20px;
    margin-bottom: 14px;
  }

  #nowplaying {
    font-size: 17px;
  }

  .buttons {
    flex-direction: column;
    align-items: center;
    gap: 12px;
    margin-top: 26px;
  }

  .btn {
    width: 82%;
    max-width: 300px;
    padding: 14px 20px;
    font-size: 15px;
  }

  .genres {
    margin-top: 28px;
    font-size: 12px;
    line-height: 1.8;
    padding: 0 8px;
  }
}
</style>
</head>

<body>

<header class="top-nav">
  <a href="/" class="nav-logo">
    <img src="https://media.boomboxradio.fr/logo-player.png" alt="Boombox Radio">
  </a>

  <nav class="nav-links">
    <a href="/">Home</a>
    <a href="/about">About</a>
    <a href="/recently-played">Recently Played</a>
    <a href="/app">App</a>
    <a href="https://play.boomboxradio.fr/" target="_blank" rel="noopener">Listen</a>
    <a href="/contact">Contact</a>
  </nav>
</header>

<section class="hero">
  <div class="content">

    <img src="https://media.boomboxradio.fr/logo-player.png" class="logo" alt="Boombox Radio">

    <div class="live">● LIVE RADIO</div>

    <div class="slogan">
      <img src="https://media.boomboxradio.fr/slogan-boombox.png" alt="Yesterday's hits... the ultimate mix!">
    </div>

    <div class="now">
      <span>Now Playing</span>

      <div class="cover-wrap">
        <img id="cover" src="https://media.boomboxradio.fr/logo-boombox.png" alt="Current cover">
      </div>

      <div id="nowplaying">Chargement...</div>

      <div class="eq">
        <span></span><span></span><span></span><span></span>
        <span></span><span></span><span></span><span></span>
        <span></span><span></span><span></span><span></span>
      </div>
    </div>

    <div class="buttons">
      <a href="https://play.boomboxradio.fr/" class="btn" target="_blank" rel="noopener">▶ Listen Live</a>
      <a href="https://play.boomboxradio.fr/" class="btn secondary" target="_blank" rel="noopener">⬇ Install the App</a>
    </div>

    <div class="genres">
      Disco • Italo-Disco • Funk • Soul • Pop • Pop-Rock • Dance • Eurodance • House Music • Contemporary R&amp;B • Downtempo
    </div>

  </div>
</section>

<footer class="footer">
  © 2026 BOOMBOX RADIO® — All rights reserved ·
  <a href="/mentions-legales">Legal Notice</a>
</footer>

<script>
const fallbackCover = "https://media.boomboxradio.fr/logo-boombox.png";
const dynamicCover = "https://media.boomboxradio.fr/cover-current.jpg";
const nowPlayingUrl = "/nowplaying.txt";

let lastTitle = "";
let lastCoverRefresh = 0;
let coverUpdateTimer = null;

function freshUrl(url) {
  return url + "?nocache=" + Date.now();
}

function setCover(url) {
  const cover = document.getElementById("cover");

  if (!cover) return;

  cover.style.opacity = "0";

  setTimeout(() => {
    cover.src = url;
    cover.style.opacity = "1";
  }, 180);
}

function shouldShowFallbackCover(title) {
  const clean = String(title || "").trim().toLowerCase();

  return (
    !clean ||
    clean === "boombox radio - live" ||
    clean.includes("boombox") ||
    clean.includes("jingle") ||
    clean.includes("sweeper") ||
    clean.includes("liner") ||
    clean.includes("station id")
  );
}

function isServerError(text) {
  const clean = String(text || "").toLowerCase();

  return (
    clean.includes("<!doctype html") ||
    clean.includes("<html") ||
    clean.includes("500 internal server error") ||
    clean.includes("apache") ||
    clean.includes("nginx") ||
    clean.includes("server error")
  );
}

function updateCover() {
  const now = Date.now();

  // Anti-double appel rapproché : une seule mise à jour réelle par changement de titre.
  if (now - lastCoverRefresh < 1500) {
    return;
  }

  lastCoverRefresh = now;

  const coverUrl = freshUrl(dynamicCover);
  const fallbackUrl = freshUrl(fallbackCover);
  const tester = new Image();

  tester.onload = function () {
    // Sécurité : refuse une image manifestement invalide ou minuscule.
    if (
      tester.naturalWidth < 50 ||
      tester.naturalHeight < 50
    ) {
      setCover(fallbackUrl);
      return;
    }

    setCover(coverUrl);
  };

  tester.onerror = function () {
    console.warn("Cover loading failed");
    setCover(fallbackUrl);
  };

  tester.src = coverUrl;
}

async function updateNowPlaying() {
  const box = document.getElementById("nowplaying");
  const liveBox = document.querySelector(".now");

  if (!box) return;

  try {
    const response = await fetch(freshUrl(nowPlayingUrl), {
      cache: "no-store"
    });

    if (!response.ok) {
      throw new Error("HTTP error");
    }

    const rawText = await response.text();

    // Bloque les erreurs HTML/500.
    if (isServerError(rawText)) {
      console.warn("Server error detected");
      return;
    }

    const cleanTitle = String(rawText || "").trim();

    // Protection contre un contenu invalide.
    if (
      cleanTitle.length < 2 ||
      cleanTitle.length > 140
    ) {
      return;
    }

    const title = cleanTitle || "Boombox Radio - LIVE";

    // IMPORTANT : la pochette ne change QUE si le titre change.
    if (title !== lastTitle) {
      lastTitle = title;

      box.style.opacity = "0";

      setTimeout(() => {
        box.innerText = title;
        box.style.opacity = "1";
      }, 180);

      if (liveBox) {
        liveBox.classList.add("now-refresh");

        setTimeout(() => {
          liveBox.classList.remove("now-refresh");
        }, 700);
      }

      // Annule une éventuelle mise à jour de pochette encore programmée
      // pour le titre précédent.
      if (coverUpdateTimer) {
        clearTimeout(coverUpdateTimer);
        coverUpdateTimer = null;
      }

      if (shouldShowFallbackCover(title)) {
        setCover(freshUrl(fallbackCover));
      } else {
        // Laisse le temps au script/FTP de terminer l'upload de cover-current.jpg.
        // Ensuite la pochette reste verrouillée jusqu'au prochain changement de titre.
        coverUpdateTimer = setTimeout(() => {
          updateCover();
          coverUpdateTimer = null;
        }, 3000);
      }
    }

  } catch (error) {
    console.warn("NowPlaying fetch error:", error);

    if (!lastTitle) {
      box.innerText = "Boombox Radio - LIVE";
      setCover(freshUrl(fallbackCover));
    }

    // Si un titre est déjà affiché, on conserve aussi sa pochette actuelle.
    // Une erreur réseau temporaire ne doit plus l'écraser.
  }
}

document.addEventListener("DOMContentLoaded", function () {
  // Chargement initial.
  updateNowPlaying();

  // Deuxième contrôle rapide au démarrage pour récupérer un titre
  // qui aurait changé juste pendant le chargement de la page.
  setTimeout(updateNowPlaying, 4000);

  // Seul le titre est contrôlé périodiquement.
  // La pochette, elle, ne sera rechargée que lors d'un changement de titre.
  setInterval(updateNowPlaying, 15000);
});
</script>

</body>
