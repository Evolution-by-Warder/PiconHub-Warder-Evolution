    // Dekoriert eine URL, indem bestimmte Parameter hinzugefügt oder angepasst werden.
    function decorateURL(url) {
        let base;
        let query;
        let spliter = url.indexOf("?");
        if (spliter != -1) {
            base = url.substring(0, spliter);
            query = new URLSearchParams(url.substring(spliter + 1));
        } else {
            base = url;
            query = new URLSearchParams();
        }
        // Player-Schlüssel
        query.set("pkey", "web-liferadio-at");
        // Usercentrics TCF String
        query.set("tcstring", "DER TCF STRING WENN");
        // Adswizz listenerid auch als generischen Schlüssel setzen
        if (query.has("aw_0_awz.listenerid")) {
            query.set("listenerid", query.get("aw_0_awz.listenerid"));
        }
        return base + "?" + query.toString();
    }
</script>
