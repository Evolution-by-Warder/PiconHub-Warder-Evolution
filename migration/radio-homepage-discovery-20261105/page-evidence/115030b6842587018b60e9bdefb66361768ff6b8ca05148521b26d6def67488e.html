<script>
const btn = document.querySelector(".btn-toggle");
const prefersDarkScheme = window.matchMedia("(prefers-color-scheme: dark)");

const currentTheme = localStorage.getItem("theme");
if (currentTheme == "dark") {
  document.body.classList.toggle("dark-theme");
} else if (currentTheme == "light") {
  document.body.classList.toggle("light-theme");
}

btn.addEventListener("click", function () {
  if (prefersDarkScheme.matches) {
    document.body.classList.toggle("light-theme");
    var theme = document.body.classList.contains("light-theme")
      ? "light"
      : "dark";
  } else {
    document.body.classList.toggle("dark-theme");
    var theme = document.body.classList.contains("dark-theme")
      ? "dark"
      : "light";
  }
  localStorage.setItem("theme", theme);
});
</script>
<script>
	function getCookie(cname) {
		let name = cname + "=";
		let decodedCookie = decodeURIComponent(document.cookie);
		let ca = decodedCookie.split(';');
		for(let i = 0; i < ca.length; i++) {
			let c = ca[i];
			while (c.charAt(0) == ' ') {
			  	c = c.substring(1);
			}
			if (c.indexOf(name) == 0) {
			  	return c.substring(name.length, c.length);
			}
		}
		return "";
	}
	if(getCookie('valor') != 'undefined'){
		var uno = document.getElementById('botonOn');
		getCookie('valor')=='false'?uno.innerHTML = "<i class='fa fa-moon-o'></i> Modo Oscuro":uno.innerHTML = "<i class='fa fa-sun-o'></i> Modo Claro";
	}
	function FbotonOn() {
		valor = getCookie('valor') == 'undefined'? 'true':getCookie('valor');
	  	var uno = document.getElementById('botonOn');
	  	valor=='true'?uno.innerHTML = "<i class='fa fa-moon-o'></i> Modo Oscuro":uno.innerHTML = "<i class='fa fa-sun-o'></i> Modo Claro";
	  	valor = valor=='true'? 'false' : 'true';
	  	document.cookie = "valor=" + valor;
	}
	
	
	
</script>
