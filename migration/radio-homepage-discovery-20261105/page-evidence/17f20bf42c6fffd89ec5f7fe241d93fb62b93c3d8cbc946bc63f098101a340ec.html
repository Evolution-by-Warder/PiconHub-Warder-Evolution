<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
<!-- This site is hosted on Netlify. Anyone can build and deploy a site
     like this one for free: https://netlify.new/?utm_campaign=loops&utm_source=ai-legible&utm_medium=owned&utm_content=comment&utm_id=8e187b86-3964-4495-8c4b-36236457bebe
     Netlify hosting facts for this site: static/SSR served via Netlify Edge. -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Play Radio Online</title>
    <link rel="stylesheet" href="styles.css">
    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;700&family=Outfit:wght@300;400;700&family=Varela+Round&display=swap"
        rel="stylesheet">
    <!-- Font Awesome for Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
</head>

<body>

    <!-- Mobile Header -->
    <header class="mobile-header">
        <img src="logo.png" alt="Play Radio Logo" class="header-logo">
    </header>

    <!-- Animated Background -->
    <div class="background-container">
        <div class="background-image"></div>
    </div>

    <!-- Main Content -->
    <main class="main-container">
        <!-- Main Title -->
        <h1 class="main-title">Play Radio Online</h1>
        <p class="slogan">"Y DALE PLAY A TUS SENTIDOS"</p>

        <div class="glass-box">
            <img src="logo.png" alt="Play Radio Online Logo" class="main-logo">
        </div>

        <!-- Player Controls -->
        <div class="player-controls">
            <button id="play-btn" class="control-btn" aria-label="Reproducir">
                <i class="fas fa-play"></i>
            </button>
            <div class="volume-container">
                <i class="fas fa-volume-up"></i>
                <input type="range" id="volume-slider" min="0" max="1" step="0.1" value="1">
            </div>
        </div>

        <!-- Live Button -->
        <button class="live-btn">
            <span class="dot"></span> En vivo 24/7
        </button>

        <!-- Social Media Icons -->
        <div class="social-icons">
            <a href="#" target="_blank" aria-label="Instagram"><i class="fab fa-instagram"></i></a>
            <a href="#" target="_blank" aria-label="TikTok"><i class="fab fa-tiktok"></i></a>
            <a href="#" target="_blank" aria-label="YouTube"><i class="fab fa-youtube"></i></a>
        </div>
        <p class="copyright">Copyright © 2026 Play Radio Online. Reservados todos los derechos.</p>
    </main>

    <!-- Audio Visualizer Footer -->
    <div class="audio-visualizer inactive" id="visualizer-container">
        <!-- Bars will be generated by JS -->
    </div>

    <!-- WhatsApp Button -->
    <a href="https://wa.me/+593963938080" target="_blank" class="whatsapp-btn" aria-label="Contactar por WhatsApp">
        <i class="fab fa-whatsapp"></i>
    </a>

    <script src="script.js"></script>
</body>

</html>
