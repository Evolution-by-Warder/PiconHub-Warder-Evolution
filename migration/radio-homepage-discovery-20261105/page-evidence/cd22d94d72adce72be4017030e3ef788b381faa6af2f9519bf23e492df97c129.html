 definido su identidad como artista multidisciplinaria.\\n\\nEs graduada en estudios de Humanidades, formación que ha enriquecido su sensibilidad artística y su visión sobre la comunicación, la cultura y las expresiones creativas.\\n\\nTony Negrón es fundadora y manager de La Latina Radio, multiplataforma de broadcasting media en el que ha desempeñado un papel fundamental en su desarrollo y crecimiento. Asimismo, se desempeña como productora y realizadora de espacios radiales, liderando la creación de contenidos orientados a informar, entretener y fortalecer los vínculos con la comunidad latina.\\n\\nAdemás de su faceta musical, es la creadora de “Chimickui Land”, una línea de arte que refleja su imaginación, creatividad y pasión por las expresiones visuales. Sus obras se distinguen por el uso del color, la originalidad y elementos que evocan sus raíces dominicanas y puertorriqueñas.\\n\\nCon una carrera en constante evolución, Tony Negrón continúa consolidándose como artista, productora y gestora cultural, promoviendo el talento latino y contribuyendo al fortalecimiento de espacios dedicados a la cultura, la comunicación y el arte. Su compromiso con la excelencia y la innovación la convierten en una figura inspiradora dentro de la comunidad artística y de los medios de comunicación."},"D":{"A?":"O","A":{"k":{"A?":"D","A":2},"v":{"A?":"O","A":{"A":{"A?":"D","A":2},"B":{"A?":"S","A":{"A":"YAD1aU3sLnI","B":0,"C":"B"}}}}}},"F":{"A?":"P","A":{"C":"#a0a6b4","D":0.0,"F":false,"J":false,"G":false,"H":false}},"G":{"A?":"A","A":"normal"},"H":{"A?":"A","A":"normal"},"K":{"A?":"C","A":14.0}}},"member-1-card":{"A?":"O","A":{"E":{"A?":"P","A":{"C":"#242938","D":0.0,"F":false,"J":false,"G":false,"H":false}}}},"member-1-name":{"A?":"O","A":{"A":{"A?":"A","A":"Antonia Negrón"},"D":{"A?":"O","A":{"k":{"A?":"D","A":2},"v":{"A?":"O","A":{"A":{"A?":"D","A":2},"B":{"A?":"S","A":{"A":"YAFdJpU7Kkk","B":0,"C":"B"}}}}}},"F":{"A?":"P","A":{"C":"#ffffff","D":0.0,"F":false,"J":false,"G":false, n integral le ha permitido combinar el arte, la producción audiovisual y la comunicación como herramientas para transmitir historias y generar experiencias culturales.\\n\\nComo fundador y director de La Latina Radio, ha liderado la construcción de un medio de broadcasting media y comunicación digital que integra periodismo, radiodifusión y streaming digital, producción audiovisual, fotografía, diseño gráfico, gestión de redes sociales y cobertura de eventos culturales y comunitarios.\\n\\nDesde esta plataforma ha impulsado la promoción de artistas, organizaciones, emprendedores y proyectos comunitarios, brindando espacios para visibilizar el talento y las iniciativas que forman parte de la diversidad latina en Canadá y Estados Unidos. Su trabajo se caracteriza por una comunicación independiente, responsable y orientada al interés público, basada en la información, la cultura y el respeto por la libertad de expresión.\\n\\nCon una visión innovadora sobre el futuro de los medios, Orlando Morales continúa desarrollando proyectos que combinan tecnología, creatividad y comunicación para fortalecer los vínculos entre las comunidades, preservar la identidad cultural latina y crear nuevos espacios de encuentro a través de los medios digitales.\\n\\nSu compromiso con la comunicación nace desde la convicción de que los medios no solo transmiten información, sino que también construyen memoria, representan historias y sirven como puente entre culturas.\\n\\n Filosofía de vida: “Lo que no se ve hoy, se verá mañana”\\n\\n"},"D":{"A?":"O","A":{"k":{"A?":"D","A":2},"v":{"A?":"O","A":{"A":{"A?":"D","A":2},"B":{"A?":"S","A":{"A":"YAD1aU3sLnI","B":0,"C":"B"}}}}}},"F":{"A?":"P","A":{"C":"#a0a6b4","D":0.0,"F":false,"J":false,"G":false,"H":false}},"G":{"A?":"A","A":"normal"},"H":{"A?":"A","A":"normal"},"K":{"A?":"C","A":14.0}}},"member-2-card":{"A?":"O","A":{"E":{"A?":"P","A":{"C":"#242938","D":0.0,"F":false,"J":false,"G":false,"H":false}}}},"member-2-name":{"A?":"O","A":{"A":{"A?":"A" inmigración.\\n\\nEs CEO & Founder de MIA CANADA MAGAZINE, medio de comunicación multicultural dedicado a promover el emprendimiento, la cultura, el liderazgo y las historias de éxito.\\n\\nTambién es fundadora de Premios Alas Doradas, iniciativa que reconoce la excelencia, el talento y las contribuciones de líderes que generan un impacto positivo en la sociedad.\\n\\nAdemás, es CEO y fundadora de International Women Entrepreneurs of Canada (IWE Canada), organización sin ánimo de lucro comprometida con el empoderamiento femenino, el emprendimiento y el fortalecimiento de las comunidades.\\n\\nSu trayectoria refleja una visión empresarial orientada a conectar culturas, crear oportunidades, impulsar talentos y fortalecer el liderazgo multicultural en Canadá.\\n\\nMás de cuatro décadas conectando destinos, personas y culturas; transformando experiencias en oportunidades e inspirando liderazgo."},"D":{"A?":"O","A":{"k":{"A?":"D","A":2},"v":{"A?":"O","A":{"A":{"A?":"D","A":2},"B":{"A?":"S","A":{"A":"YAD1aU3sLnI","B":0,"C":"B"}}}}}},"F":{"A?":"P","A":{"C":"#a0a6b4","D":0.0,"F":false,"J":false,"G":false,"H":false}},"G":{"A?":"A","A":"normal"},"H":{"A?":"A","A":"normal"},"K":{"A?":"C","A":14.0}}},"member-3-card":{"A?":"O","A":{"E":{"A?":"P","A":{"C":"#242938","D":0.0,"F":false,"J":false,"G":false,"H":false}}}},"member-3-name":{"A?":"O","A":{"A":{"A?":"A","A":"Dora Vélez "},"D":{"A?":"O","A":{"k":{"A?":"D","A":2},"v":{"A?":"O","A":{"A":{"A?":"D","A":2},"B":{"A?":"S","A":{"A":"YAFdJpU7Kkk","B":0,"C":"B"}}}}}},"F":{"A?":"P","A":{"C":"#ffffff","D":0.0,"F":false,"J":false,"G":false,"H":false}},"G":{"A?":"A","A":"bold"},"H":{"A?":"A","A":"normal"},"K":{"A?":"C","A":22.0}}},"member-3-photo":{"A?":"O","A":{"I":{"A?":"O","A":{"k":{"A?":"D","A":3},"v":{"A?":"O","A":{"A":{"A?":"D","A":3},"B":{"A?":"P","A":{"B":{"A":{"A?":"d","A":"MAHYpzzWsRY","B":1},"E":0.0,"C":{}},"D":0.0,"F":false,"J":false,"G":false,"H":false}}}}}},"J":{"A?":"A","A":"Portrait of Dora Vélez in a black blazer"}}},"me
