/* BOTON HAMBURGUESA */
.menu-toggle {
	position: fixed;
	top: 28px;
	left: 18px;
	z-index: 9999;

	width: 54px;
	height: 54px;

	border-radius: 18px;

	background: linear-gradient(
		180deg,
		rgba(255,255,255,0.14),
		rgba(255,255,255,0.05)
	);

	border: 1px solid rgba(255,255,255,0.10);

	display: flex;
	align-items: center;
	justify-content: center;

	cursor: pointer;

	color: #ffffff;
	font-size: 22px;

	backdrop-filter: blur(14px);
	-webkit-backdrop-filter: blur(14px);

	box-shadow:
		0 10px 30px rgba(0,0,0,0.45),
		inset 0 1px 0 rgba(255,255,255,0.08);

	transition:
		transform 0.25s ease,
		background 0.25s ease,
		opacity 0.25s ease;
}

.menu-toggle:hover {
	transform: scale(1.05);
	background: linear-gradient(
		180deg,
		rgba(255,255,255,0.18),
		rgba(255,255,255,0.08)
	);
}

.menu-toggle.hidden {
	opacity: 0;
	pointer-events: none;
	transform: scale(0.9);
}

/* OVERLAY */
.menu-overlay {
	position: fixed;
	inset: 0;
	background: rgba(0,0,0,0.6);
	z-index: 9997;
	display: none;
}

/* MENU */
.sidebar {
	position: fixed;
	top: 0;
	left: -320px;
	width: 300px;
	height: 100%;

	background: rgba(15,15,15,0.92);

	backdrop-filter: blur(18px);
	-webkit-backdrop-filter: blur(18px);

	color: #fff;
	z-index: 9998;

	transition: left 0.3s ease;

	overflow-y: auto;

	box-shadow: 4px 0 20px rgba(0,0,0,0.5);

	/* FIREFOX */
	scrollbar-width: thin;
	scrollbar-color: rgba(255,255,255,0.25) transparent;
}

.sidebar.open {
	left: 0;
}

.menu-overlay.open {
	display: block;
}

/* SCROLLBAR MODERNA */

.sidebar::-webkit-scrollbar {
	width: 10px;
}

.sidebar::-webkit-scrollbar-track {
	background: rgba(255,255,255,0.03);
	border-radius: 20px;
}

		rgba(255,255,255,0.12)
	);

	border: 2px solid transparent;
	background-clip: padding-box;
}

.sidebar::-webkit-scrollbar-thumb:hover {
	background: linear-gradient(
		180deg,
		rgba(255,255,255,0.45),
		rgba(255,255,255,0.20)
	);
}

.sidebar-content {

.logo-menu {

.menu-section {

.menu-title {
	font-size: 16px;
	font-weight: bold;
	margin-bottom: 15px;

	border-bottom: 1px solid rgba(255,255,255,0.1);
	padding-bottom: 8px;

.social-links,

.social-links a,

.social-links a:hover,

	// CTRL + SHIFT + I

<script>

function toggleMenu() {

	const sidebar = document.getElementById('sidebar');
	const overlay = document.getElementById('menuOverlay');
	const button = document.querySelector('.menu-toggle');

	sidebar.classList.toggle('open');
	overlay.classList.toggle('open');

	if (sidebar.classList.contains('open')) {
		button.classList.add('hidden');
	} else {
		button.classList.remove('hidden');
	}
}

</script>

<script>

let ultimoTitulo = "";

function actualizarPlayerInfo() {

	const titleEl = document.querySelector('.lunaradiotexttitlespan');
	const coverEl = document.querySelector('#lunaradiocoverwrapper2');

	if (!titleEl || !coverEl) return;

	const texto = titleEl.textContent.trim();

	if (!texto || texto === ultimoTitulo) return;

	ultimoTitulo = texto;

	let artista = "";
	let cancion = texto;

	if (texto.includes(" - ")) {
		[artista, cancion] = texto.split(" - ");
	}

	const bg = coverEl.style.backgroundImage;
	const match = bg.match(/url\(["']?(.*?)["']?\)/);

	const imagen = match ? match[1] : "";

	document.title = texto + " - En Vivo";

	// evitar usar el logo por defecto
	const usarArtwork =
		imagen &&
		!imagen.includes("logo.jpg") &&
		!imagen.includes("noimage") &&
		!imagen.includes("default");

	if ('mediaSession' in navigator) {

		navigator.mediaSession.metadata = new MediaMetadata({
			title: cancion,
			artist: artista,
			album: "",
			artwork: usarArtwork ? [
				{
					src: imagen,
					sizes: '512x512',
					type: 'image/jpg'
				}
			] : []
		});

	}
}

setInterval(actualizarPlayerInfo, 2000);

</script>
