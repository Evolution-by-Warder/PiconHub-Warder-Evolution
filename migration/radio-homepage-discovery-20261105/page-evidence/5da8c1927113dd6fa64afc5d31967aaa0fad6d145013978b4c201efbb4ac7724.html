r o fim da guerra dos EUA e de Israel contra o Irã.\n🗒️ Tem alguma sugestão de reportagem? Envie para o g1\nNa véspera, os contratos futuros do Brent, referência internacional, fecharam em queda de 8,7%, a US$ 94,62 por barril, enquanto os contratos futuros do West Texas Intermediate (WTI), referência dos EUA, caíram 8,3%, para US$ 88,12. Ambos fecharam no menor nível desde 31 de agosto.\nJá nesta quinta-feira (5), o Brent tinha queda de 2,24% perto das 9h15, cotado a US$ 96,74, enquanto o WTI subia 1,87% no mesmo horário, a US$ 89,77 por barril.\nAgora no g1\nTrump agora enfrenta uma escolha entre buscar uma saída negociada ou partir para uma escalada mais arriscada do conflito.\nEnfraquecido e diante de um Congresso controlado pelos democratas, o presidente tem maior incentivo para buscar um acordo, afirmaram duas fontes próximas a governos do Golfo. Um ataque em grande escala ao Irã parece menos provável, disseram elas.\nNo entanto, um acordo que permita ao Irã reivindicar uma vitória clara e faça Trump parecer derrotado pode tanto levar a uma reação imprudente quanto favorecer a moderação, disseram analistas do Golfo.\nTrump disse ao jornal britânico Financial Times, na terça-feira (3), que os EUA não tinham planos imediatos de atacar o Irã. Na quarta-feira (4), reconheceu que a guerra teve influência na ampla derrota de seu partido nas eleições de meio de mandato, nas quais os democratas conquistaram o controle da Câmara dos Deputados e do Senado.\n“O controle democrata do Congresso também poderia restringir os gastos militares dos EUA no Oriente Médio e aumentar a possibilidade de um acordo de paz em um prazo mais curto”, disse Dennis Kissler, vice-presidente sênior de operações da empresa de serviços financeiros norte-americana BOK Financial, à Reuters.\nSegundo ele, o aumento das exportações de petróleo do Oriente Médio, somado às declarações de Trump de que não há planos imediatos para atacar o Irã, aumenta a pressão sobre os preços.\nO vice-presidente dos EUA, JD Vance, distanciou-se na quarta-feira da decisão de entrar em guerra, questionou se o conflito valeu a pena e atribuiu a ele a derrota republicana nas eleições, que deram aos democratas o controle do Congresso.\nO líder supremo do Irã, o aiatolá Mojtaba Khamenei, afirmou em comunicado que a hostilidade dos EUA persistiria independentemente de qual partido estivesse no poder. Os houthis, do Iêmen, disseram ter atacado o Aeroporto Internacional Rei Khalid, em Riade. As autoridades sauditas não confirmaram o ataque.\nCatar tenta evitar nova escalada\nO Catar intensificou os esforços de mediação para evitar uma nova escalada do conflito após as eleições nos EUA. Uma alta autoridade iraniana disse à Reuters, na terça-feira, que o Irã e os Estados Unidos ainda estão longe de chegar a um acordo para encerrar a guerra.\n“As eleições estão dando aos investidores que apostam na queda dos preços um motivo para duvidar da continuidade do conflito no Irã. [...] Estou mais preocupado com a possibilidade de vermos uma escalada antes de uma resolução”, disse Carl Larry, que lidera a equipe de negociação e risco para a América do Norte na Enverus, à Reuters.\nAs exportações dos países do Golfo de petróleo, condensado e produtos refinados, excluindo o gás liquefeito de petróleo, atingiram média de 17,1 milhões de barris por dia em outubro, segundo dados de rastreamento de navios da Vortexa. O volume ficou abaixo dos 18,9 milhões de barris por dia registrados em setembro, mas ainda corresponde a cerca de três quartos do nível anterior à guerra.\nOs Emirados Árabes Unidos avaliam construir um terceiro oleoduto para transportar petróleo sem passar pelo Estreito de Ormuz, informou a Bloomberg, citando fontes a par do assunto. O objetivo seria reduzir drasticamente a dependência do país dessa rota.\nNos EUA, os estoques de petróleo bruto, gasolina e destilados caíram na semana passada, segundo a Administração de Informação de Energia dos Estados Unidos (EIA).  ","pubdate":"2026-11-05 09:30:05","source":"","guid":"https://g1.globo.com/economia/noticia/2026/11/05/petroleo-abaixo-de-us-100-apos-reves-de-trump-elevar-apostas-no-fim-da-guerra-com-ira.ghtml","created_at":"2026-11-05 09:30:05","updated_at":"2026-11-05 09:30:05"},{"id":2,"title":"Hemoal realiza coleta de sangue itinerante em Coruripe, no Litoral Sul do estado","link":"https://g1.globo.com/al/alagoas/noticia/2026/11/05/hemoal-realiza-coleta-de-sangue-itinerante-em-coruripe-no-litoral-sul-do-estado.ghtml","description":"        Coleta de sangue acontece no bairro Tércio Wanderley\nOlival Santos/Ascom Hemoal\nO Hemocentro de Alagoas (Hemoal) realiza, nesta quinta-feira (19), uma coleta de sangue itinerante em Coruripe, no Litoral Sul de Alagoas. A ação acontece das 9h às 16h, na Unidade de Coleta e Transfusão, no bairro Tércio Wanderley.\nDe acordo com o Hemoal, a iniciativa tem como objetivo reforçar os estoques de sangue do hemocentro. O material coletado é utilizado em maternidades e hospitais que precisam realizar transfusões sanguíneas.\nCritérios para doação\nAgora no g1\nDe acordo com o Ministério da Saúde (MS), os candidatos à doação de sangue precisam atender a alguns critérios. Entre eles estão:\nTer entre 16 e 69 anos;\nPesar, no mínimo, 50 kg;\nApresentar um documento oficial de identificação original com foto.\nPessoas diagnosticadas com doença de Chagas, Aids ou sífilis não podem doar sangue. A restrição também se aplica a quem teve hepatite após os 11 anos de idade. Gestantes e mulheres que estão amamentando também não podem realizar a doação.\nAlém disso, os voluntários não podem ter ingerido bebidas alcoólicas nas 12 horas anteriores à doação e precisam ter dormido pelo menos seis horas na noite anterior.  ","pubdate":"2026-11-05 09:30:05","source":"","guid":"https://g1.globo.com/al/alagoas/noticia/2026/11/05/hemoal-realiza-coleta-de-sangue-itinerante-em-coruripe-no-litoral-sul-do-estado.ghtml","created_at":"2026-11-05 09:30:05","updated_at":"2026-11-05 09:30:05"},{"id":3,"title":"Moradores cobram obras de contenção após alerta para risco de deslizamentos em Itaperuna","link":"https://g1.globo.com/rj/norte-fluminense/noticia/2026/11/05/moradores-cobram-obras-de-contencao-apos-alerta-para-risco-de-deslizamentos-em-itaperuna.ghtml","description":"        De acordo com o morador, o trecho continua oferecendo riscos e a circulação de ônibus foi interrompida por causa da possibilidade de novos deslizamentos.\nLili Bustilho\nUm alerta da Defesa Civil para a possibilidade de temporais e deslizamentos de terra em Itaperuna, no Noroeste Fluminense, devido aos efeitos do El Niño, chama a atenção para os riscos enfrentados por moradores de áreas de encosta.\nNo Morro do Cristo, moradores cobram a conclusão de obras de contenção e mais ações preventivas por parte do poder público.\nHá cerca de cinco anos, durante um temporal, parte da encosta cedeu e o muro de uma casa desabou enquanto a família estava no imóvel. Desde então, a família deixou a residência e vivem em outro endereço por meio do aluguel social. Segundo o morador, a reconstrução do muro chegou a começar, mas não foi concluída.\n“Começaram a fazer o muro, fizeram uma parte, mas falta a outra parte, que são as laterais. E a parte de baixo também desceu, que é o que sustenta a rua”, contou.\n📱 Siga o canal do g1 Norte Fluminense no WhatsApp.\nAgora no g1\nDe acordo com o morador, o trecho continua oferecendo riscos e a circulação de ônibus foi interrompida por causa da possibilidade de novos deslizamentos.\n“Hoje nem passa mais ônibus. Por quê? Por causa do perigo de o ônibus ser muito pesado e deslizar, descer com as pessoas dentro. Então, hoje nós estamos sem condução pública por causa desse deslizamento que aconteceu. Desde aquela época, há cerca de cinco anos, o perigo ainda existe”, afirmou.\nAlém das obras, ele pede que a Defesa Civil amplie as ações de orientação nos bairros para ensinar os moradores a agir em períodos de chuva forte. Segundo ele, as informações divulgadas apenas pelas redes sociais não alcançam toda a população.\n“Como é que as pessoas vão fazer para se preparar se elas não sabem como fazer? Muitos não têm acesso às redes sociais. Então, alguém da área, Defesa Civil, ou sei lá quem que seja, precisa preparar os moradores, não só do nosso bairro, mas da cidade toda”, disse.\nO morador também reclama da falta frequente de água na região e afirma que o problema afeta principalmente famílias com crianças e idosos.\n“Tem moradores, tem criança. A falta d'água aqui é constante. Tem mulheres com criança pequena, tem idosas que precisam. E a conta d'água, a maioria que vocês veem está todo mundo certinho, ninguém deve nada à Cedae”, relatou.\nA Defesa Civil orienta moradores de áreas de encosta a ficarem atentos a sinais como rachaduras em paredes, surgimento de água no terreno e movimentação de terra. Quem precisar de vistoria pode entrar em contato pelo telefone (22) 3824-6334. Para receber alertas por SMS, basta enviar o CEP para o número 40199.\nO que diz a Prefeitura\nA Prefeitura de Itaperuna informou que a empresa responsável pela obra não concluiu o aterramento da área e pode sofrer sanções administrativas. Segundo o município, está sendo avaliada a possibilidade de a Secretaria de Obras finalizar a intervenção com recursos remanescentes do contrato.\nA administração também afirmou que a Defesa Civil segue monitorando a área e atualizando o mapa de risco das encostas. Já a retomada da circulação de ônibus depende de uma obra de contenção na Rua Severino Ribeiro, que aguarda licitação.\nSobre a família citada, a prefeitura informou que ela continua recebendo aluguel social e que o benefício será mantido enquanto persistirem as condições de risco e vulnerabilidade identificadas pelas equipes técnicas.  ","pubdate":"2026-11-05 09:30:05","source":"","guid":"https://g1.globo.com/rj/norte-fluminense/noticia/2026/11/05/moradores-cobram-obras-de-contencao-apos-alerta-para-risco-de-deslizamentos-em-itaperuna.ghtml","created_at"
