<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8" />
<title>Radio Varde</title>
<meta http-equiv="Content-Type" content="text/html; charset=iso-8859-1" />
<link href="/varde/dist/skin/blue.monday/css/jplayer.blue.monday.min.css" rel="stylesheet" type="text/css" />
<script type="text/javascript" src="/varde/lib/jquery.min.js"></script>
<script type="text/javascript" src="/varde/dist/jplayer/jquery.jplayer.min.js"></script>
<script type="text/javascript">
//<![CDATA[
$(document).ready(function(){

	$("#jquery_jplayer_1").jPlayer({
		ready: function (event) {
			$(this).jPlayer("setMedia", {
				title: "Radio Varde - Din lokale taleradio",
				mp3: "http://stream.wlmm.dk:80/radiovardemp3",
				
			}).jPlayer("play");
		},
		swfPath: "/varde/dist/jplayer",
		supplied: "mp3",
		wmode: "window",
		useStateClassSkin: true,
		autoBlur: false,
		smoothPlayBar: true,
		keyEnabled: true,
		remainingDuration: false,
		toggleDuration: true
	});
});
//]]>
</script>
<style>
body {
	width: 452px; 
	margin: 0 auto;
	}
</style>

</head>
<body>
<div id="jquery_jplayer_1" class="jp-jplayer"></div>
<div id="logo" class="center">
    <div class="logo" style="width:420px;">
        <img src="logo.png" width="420px" height="210px" />
    </div> </div>

<div id="jp_container_1" class="jp-audio" role="application" aria-label="media player">
	<div class="jp-type-single">
		<div class="jp-gui jp-interface">
			<div class="jp-controls">
				<button class="jp-play" role="button" tabindex="0">play</button>
				<button class="jp-stop" role="button" tabindex="0">stop</button>
			</div>

			<div class="jp-volume-controls">
				<button class="jp-mute" role="button" tabindex="0">mute</button>
				<button class="jp-volume-max" role="button" tabindex="0">max volume</button>
				<div class="jp-volume-bar">
					<div class="jp-volume-bar-value"></div>
				</div>
			</div>

		</div>

		<div class="jp-details">
			<div class="jp-title" aria-label="title"></div>
		</div>
		<div class="jp-no-solution">
			<span>Update Required</span>
			To play the media you will need to either update your browser to a recent version or update your <a href="http://get.adobe.com/flashplayer/" target="_blank">Flash plugin</a>.
		</div>
	</div>
</div>

</body>

</html>
