<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
<!-- This site is hosted on Netlify. Anyone can build and deploy a site
     like this one for free: https://netlify.new/?utm_campaign=loops&utm_source=ai-legible&utm_medium=owned&utm_content=comment&utm_id=23729594-8839-4dd7-8d68-c3d8635d628e
     Netlify hosting facts for this site: static/SSR served via Netlify Edge. -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Rajshahi FM - Online Radio</title>
    <link rel="icon" type="image/png" sizes="16x16" href="favicon-16x16.png">
    <link rel="icon" type="image/png" sizes="32x32" href="favicon-32x32.png">
    <link rel="stylesheet" href="style.css">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.6.0/css/all.min.css"/>
</head>

<body class="bg-dark">

    <div class="container mt-5">
        <div class="row justify-content-center">
            <div class="col-12 col-sm-8 col-md-6 col-lg-4">
                <div class="card rounded-0">
                    <div class="card-body text-center">
                        <!-- Logo Section -->
                        <div class="logo mb-3">
                            <img src="logo.jpg" alt="Rajshahi FM" class="img-fluid">
                        </div>
                        <!-- Live Indicator -->
                        <div class="live mb-2">
                            <div class="spinner-grow text-danger-emphasis me-2" style="width: 10px; height: 10px;" role="status"></div>
                            <span class="text-danger-emphasis">LIVE</span>
                        </div>
                        <!-- Audio Player -->
                        <div class="player mt-3">
                            <audio controls>
                                <source src="https://stream.zeno.fm/nxfshdayjrdvv" type="audio/mpeg">
                                Your browser does not support the audio element.
                            </audio>
                        </div>
                        <!-- Description -->
                        <div class="mt-4">
                            <p class="text">Keep listening to Rajshahi FM live online. Follow us on our social media.</p>
                            <!-- Social Media Links -->
                            <div class="social mt-3 mb-4">
                                <a href="https://facebook.com/rajshahifmonline"><i class="fa-brands fa-facebook-f fa-2x me-2" style="color: #bd327c;"></i></a>
                                <a href="#"><i class="fa-brands fa-instagram fa-2x me-2" style="color: #bd327c;"></i></a>
                                <a href="#"><i class="fa-brands fa-x-twitter fa-2x" style="color: #bd327c;"></i></a>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>


    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
