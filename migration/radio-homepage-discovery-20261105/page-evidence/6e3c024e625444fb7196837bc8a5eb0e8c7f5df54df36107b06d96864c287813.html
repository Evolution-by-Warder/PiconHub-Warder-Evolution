.esv-social-buttons {
    position: fixed;
    bottom: 18px;
    left: 50%;
    transform: translateX(-50%);
    z-index: 99999;

    width: auto;
    max-width: 95vw;
    margin: 0;
    padding: 10px 14px;

    background: rgba(20, 24, 32, 0.96);
    border: 1px solid rgba(255, 255, 255, 0.15);
    border-radius: 14px;

    box-shadow: 0 8px 30px rgba(0, 0, 0, 0.55);

    text-align: center;
    box-sizing: border-box;

    backdrop-filter: blur(8px);
    -webkit-backdrop-filter: blur(8px);
}

.esv-social-title {
    font-size: 13px;
    font-weight: 600;
    margin-bottom: 7px;
    color: #ffffff;
}

.esv-social-links {
    display: flex;
    justify-content: center;
    align-items: center;
    gap: 8px;
    flex-wrap: nowrap;
}

.esv-social-button {
    display: inline-flex;
    align-items: center;
    justify-content: center;
    gap: 6px;

    padding: 9px 14px;

    border-radius: 8px;

    color: #ffffff !important;
    text-decoration: none !important;

    font-weight: 600;
    font-size: 13px;

    white-space: nowrap;

    transition: all 0.2s ease;

    box-shadow: 0 2px 6px rgba(0, 0, 0, 0.25);
}

.esv-social-button:hover {
    transform: translateY(-2px);
    box-shadow: 0 5px 12px rgba(0, 0, 0, 0.4);
    color: #ffffff !important;
}

/* TikTok 3.0 */
.esv-tiktok-3 {
    background: linear-gradient(135deg, #111111, #333333);
    border: 1px solid #555555;
}

/* TikTok principal */
.esv-tiktok {
    background: linear-gradient(135deg, #111111, #222222);
    border: 1px solid #555555;
}

/* Donaciones */
.esv-donation {
    background: linear-gradient(135deg, #1989e8, #075da8);
    border: 1px solid #43a9ff;
}

.esv-social-icon {
    font-size: 16px;
}

/* =========================================================
   CELULARES
   ========================================================= */

@media (max-width: 700px) {

    .esv-social-buttons {
        bottom: 10px;
        width: calc(100% - 20px);
        max-width: 500px;
        padding: 9px;
    }

    .esv-social-title {
        font-size: 12px;
        margin-bottom: 6px;
    }

    .esv-social-links {
        gap: 5px;
    }

    .esv-social-button {
        flex: 1;
        padding: 8px 6px;
        font-size: 11px;
    }

    .esv-social-icon {
        font-size: 14px;
    }
