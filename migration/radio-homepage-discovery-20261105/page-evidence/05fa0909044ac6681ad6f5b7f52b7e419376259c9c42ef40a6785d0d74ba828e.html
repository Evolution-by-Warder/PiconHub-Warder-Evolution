<style>
  /* ================= Reproductor IQ Radio — estilos aislados ================= */
  #iqPlayerWidget{
    position:relative;
    width:100%;
    font-family:"Segoe UI","Helvetica Neue",Arial,sans-serif;
    color:#fff;
    box-sizing:border-box;
  }
  #iqPlayerWidget *, #iqPlayerWidget *::before, #iqPlayerWidget *::after{ box-sizing:border-box; }

  #iqPlayerWidget .player-bar{
    width:100%;
    background:linear-gradient(180deg,#161616 0%,#000 85%);
    border:1px solid #2a2a2a;
    border-radius:0;
    padding:8px 18px 10px;
    position:relative;
    margin:0;
  }

  #iqPlayerWidget .bar-top{
    position:relative;
    display:flex;
    justify-content:center;
    align-items:flex-start;
    margin:0 0 6px;
    min-height:56px;
  }
  #iqPlayerWidget .titulo{
    position:absolute;
    left:0; top:4px;
    font-size:13px;
    font-weight:600;
    color:#e8e8e8;
    letter-spacing:.5px;
  }
  #iqPlayerWidget .titulo span{ display:block; font-size:10px; font-weight:400; color:#9a9a9a; margin-top:3px; }

  #iqPlayerWidget .logo-link{ display:inline-flex; line-height:0; cursor:pointer; }
  #iqPlayerWidget .logo-iq{
    height:72px; width:auto; transition:opacity .15s;
    animation: iqp-heartbeat 1s ease-in-out 3;
    transform-origin:center center;
  }
  #iqPlayerWidget .logo-link:hover .logo-iq{ opacity:.75; }
  @keyframes iqp-heartbeat{
    0%   { transform:scale(1); }
    14%  { transform:scale(1.18); }
    28%  { transform:scale(1); }
    42%  { transform:scale(1.18); }
    70%  { transform:scale(1); }
    100% { transform:scale(1); }
  }

  #iqPlayerWidget .live-badge{
    position:absolute;
    right:0; top:4px;
    display:flex; align-items:center; gap:6px;
    background:rgba(242,178,27,.12);
    border:1px solid #f2b21b;
    color:#f2b21b;
    font-size:10px; font-weight:700;
    letter-spacing:1.5px;
    padding:4px 10px;
    border-radius:999px;
  }
  #iqPlayerWidget .live-dot{
    width:7px; height:7px; border-radius:50%;
    background:#f2b21b;
    animation:iqp-pulso 1.2s ease-in-out infinite;
  }
  @keyframes iqp-pulso{
    0%,100%{ opacity:1; transform:scale(1); }
    50%{ opacity:.35; transform:scale(.75); }
  }

  #iqPlayerWidget .bar-controls{
    display:flex;
    align-items:center;
    gap:16px;
    flex-wrap:wrap;
    min-height:48px;
  }

  #iqPlayerWidget .btn-play{
    width:44px; height:44px;
    border-radius:50%;
    border:none;
    cursor:pointer;
    background:radial-gradient(circle at 35% 30%,#ffcf4d,#f2b21b 70%);
    display:flex; justify-content:center; align-items:center;
    flex-shrink:0;
    box-shadow:0 5px 16px rgba(242,178,27,.35);
    transition:transform .15s;
    padding:0;
  }
  #iqPlayerWidget .btn-play:hover{ transform:scale(1.07); }
  #iqPlayerWidget .btn-play:active{ transform:scale(.94); }
  #iqPlayerWidget .btn-play svg{ width:18px; height:18px; fill:#111; }
  #iqPlayerWidget .btn-play .icon-pause{ display:none; }
  #iqPlayerWidget .playing .btn-play .icon-play{ display:none; }
  #iqPlayerWidget .playing .btn-play .icon-pause{ display:block; }

  #iqPlayerWidget .volume{
    display:flex;
    align-items:center;
    gap:9px;
    flex:0 1 220px;
    min-width:150px;
  }
  #iqPlayerWidget .volume svg{ width:19px; height:19px; fill:#9a9a9a; flex-shrink:0; }
  #iqPlayerWidget .volume input[type="range"]{
    -webkit-appearance:none;
    appearance:none;
    width:100%;
    height:5px;
    border-radius:5px;
    background:linear-gradient(to right,#f2b21b var(--vol,80%),#333 var(--vol,80%));
    outline:none;
    cursor:pointer;
    margin:0; padding:0; border:none;
  }
  #iqPlayerWidget .volume input[type="range"]::-webkit-slider-thumb{
    -webkit-appearance:none;
    width:15px; height:15px;
    border-radius:50%;
    background:#fff;
    border:3px solid #f2b21b;
    box-shadow:0 2px 6px rgba(0,0,0,.5);
  }
  #iqPlayerWidget .volume input[type="range"]::-moz-range-thumb{
    width:9px; height:9px;
    border-radius:50%;
    background:#fff;
    border:3px solid #f2b21b;
  }

  #iqPlayerWidget .status{
    font-size:11px;
    color:#9a9a9a;
    letter-spacing:1px;
    white-space:nowrap;
    width:235px;
    flex-shrink:0;
    overflow:hidden;
  }

  #iqPlayerWidget .spectrum{
    margin-left:auto;
    width:240px;
    height:40px;
    flex-shrink:0;
    display:block;
    cursor:pointer;
  }

  /* --- Botones de reacción (ocultos temporalmente) --- */
  #iqPlayerWidget .reactions-zone{
    display:none;
    padding:12px 22px 18px;
  }
  #iqPlayerWidget .reactions-title{
    text-align:center;
    font-size:10px;
    letter-spacing:2.5px;
    color:#9a9a9a;
    text-transform:uppercase;
    margin-bottom:10px;
  }
  #iqPlayerWidget .reactions{
    display:flex;
    justify-content:center;
    gap:20px;
  }
  #iqPlayerWidget .reaction-btn{
    width:46px; height:46px;
    border-radius:50%;
    border:2px solid transparent;
    background:#2b2b2b;
    cursor:pointer;
    padding:0;
    display:flex; justify-content:center; align-items:center;
    transition:transform .12s,border-color .2s,box-shadow .2s;
  }
  #iqPlayerWidget .reaction-btn svg{ width:100%; height:100%; display:block; }
  #iqPlayerWidget .reaction-btn:hover{
    transform:scale(1.12);
    border-color:#f2b21b;
    box-shadow:0 0 18px rgba(242,178,27,.4);
  }
  #iqPlayerWidget .reaction-btn:active{ transform:scale(.9); }

  /* --- Reacciones flotantes (estilo TikTok Live) --- */
  #iqPlayerWidget .float-layer{
    position:absolute;
    inset:0;
    pointer-events:none;
    overflow:hidden;
    z-index:10;
  }
  #iqPlayerWidget .float-emoji{
    position:absolute;
    bottom:80px;
    width:36px; height:36px;
    will-change:transform,opacity;
    animation:
      iqp-subir var(--dur,3s) cubic-bezier(.2,.6,.3,1) forwards,
      iqp-vaiven var(--sway-dur,1.4s) ease-in-out infinite alternate;
    filter:drop-shadow(0 3px 8px rgba(0,0,0,.6));
  }
  #iqPlayerWidget .float-emoji svg{ width:100%; height:100%; }
  @keyframes iqp-subir{
    0%   { transform:translateY(0) scale(.4); opacity:0; }
    8%   { opacity:1; transform:translateY(-8%) scale(1.15); }
    15%  { transform:translateY(-14%) scale(1); }
    80%  { opacity:.9; }
    100% { transform:translateY(-300px) scale(.85); opacity:0; }
  }
  @keyframes iqp-vaiven{
    from{ margin-left:calc(var(--sway,18px) * -1); }
    to  { margin-left:var(--sway,18px); }
  }

  @media (max-width:760px){
    #iqPlayerWidget .titulo{ position:static; order:-1; width:100%; text-align:center; margin-bottom:6px; }
    #iqPlayerWidget .bar-top{ flex-direction:column; align-items:center; }
    #iqPlayerWidget .live-badge{ top:0; }
    #iqPlayerWidget .spectrum{ margin:10px auto 0; flex-basis:100%; width:100%; max-width:340px; }
    #iqPlayerWidget .status{ width:100%; text-align:center; }
  }
</style>

<audio id="radio" preload="none" crossorigin="anonymous"></audio>

<script>
(function(){
  // Stream oficial IQ Radio 105.5 FM: HTTPS directo con CORS (Centova / hostingtico).
  // Conexión directa desde el navegador: ya NO usa USA Streams (rtvhd.net) ni el proxy stream.php.
  var STREAM_URL = "https://centova.hostingtico.com:7002/stream";

  var audio   = document.getElementById("radio");
  var btnPlay = document.getElementById("btnPlay");
  var volume  = document.getElementById("volume");
  var card    = document.getElementById("playerCard");
  var cont    = document.getElementById("iqPlayerWidget");
  var layer   = document.getElementById("floatLayer");
  var status  = document.getElementById("status");
  var canvas  = document.getElementById("spectrum");
  var ctx2d   = canvas.getContext("2d");

  audio.volume = volume.value / 100;

  /* ============ Espectro de audio (Web Audio API) ============ */
  var audioCtx = null, analyser = null, freqData = null;
  var fakeMode = false, zeroFrames = 0;

  function initAnalyser(){
    if (audioCtx) { audioCtx.resume(); return; }
    try {
      audioCtx = new (window.AudioContext || window.webkitAudioContext)();
      var src = audioCtx.createMediaElementSource(audio);
      analyser = audioCtx.createAnalyser();
      analyser.fftSize = 128;                 // 64 barras de frecuencia
      analyser.smoothingTimeConstant = 0.82;
      src.connect(analyser);
      analyser.connect(audioCtx.destination);
      freqData = new Uint8Array(analyser.frequencyBinCount);
    } catch(e) {
      fakeMode = true; // sin Web Audio: animación simulada
    }
  }

  var BARS = 32;
  var fakeVals = new Array(BARS).fill(0);

  // Colores del espectro: rojo (defecto) → amarillo → blanco (cambia al tocarlo)
  // La elección se guarda y se restaura la próxima vez que se abre el reproductor
  var PALETAS = [
    ["#d81e1e", "#ff5a4d"],   // rojo
    ["#f2b21b", "#ffcf4d"],   // amarillo
    ["#e8e8e8", "#ffffff"]    // blanco
  ];
  var paletaActual = 0;
  try {
    var guardada = parseInt(localStorage.getItem("iqradio-color-espectro"), 10);
    if (guardada >= 0 && guardada < PALETAS.length) paletaActual = guardada;
  } catch(e) {}
  canvas.addEventListener("click", function(){
    paletaActual = (paletaActual + 1) % PALETAS.length;
    try { localStorage.setItem("iqradio-color-espectro", paletaActual); } catch(e) {}
  });

  function drawSpectrum(){
    requestAnimationFrame(drawSpectrum);
    var w = canvas.width, h = canvas.height;
    ctx2d.clearRect(0, 0, w, h);

    var barW = w / BARS;
    var playing = !audio.paused;
    var colores = PALETAS[paletaActual];
    var grad = ctx2d.createLinearGradient(0, h, 0, 0);
    grad.addColorStop(0, colores[0]);
    grad.addColorStop(1, colores[1]);
    ctx2d.fillStyle = grad;

    for (var i = 0; i < BARS; i++) {
      var v; // 0..1
      if (!playing) {
        v = 0.1;
      } else if (analyser && !fakeMode) {
        analyser.getByteFrequencyData(freqData);
        v = freqData[Math.floor(i * freqData.length / BARS / 1.6)] / 255;
      } else {
        // Animación simulada si el navegador bloquea el análisis del stream
        fakeVals[i] += (Math.random() * 0.9 - fakeVals[i]) * 0.25;
        v = fakeVals[i];
      }
      // Píldoras centradas verticalmente (crecen hacia arriba y abajo)
      var pw = barW * 0.42;                       // ancho de la píldora
      var bh = Math.max(pw, v * h * 0.96);        // alto (mínimo: un punto redondo)
      var x = i * barW + (barW - pw) / 2;
      var y = (h - bh) / 2;
      ctx2d.beginPath();
      roundRect(x, y, pw, bh, pw / 2);
      ctx2d.fill();
    }

    // Si el stream no entrega datos (CORS), pasar a modo simulado
    if (playing && analyser && !fakeMode) {
      var sum = 0;
      for (var j = 0; j < freqData.length; j++) sum += freqData[j];
      zeroFrames = (sum === 0) ? zeroFrames + 1 : 0;
      if (zeroFrames > 120) fakeMode = true; // ~2 segundos sin señal
    }
  }

  function roundRect(x, y, w, h, r){
    ctx2d.moveTo(x + r, y);
    ctx2d.arcTo(x + w, y, x + w, y + h, r);
    ctx2d.arcTo(x + w, y + h, x, y + h, r);
    ctx2d.arcTo(x, y + h, x, y, r);
    ctx2d.arcTo(x, y, x + w, y, r);
    ctx2d.closePath();
  }
  drawSpectrum();

  /* ============ Reproducir / pausar + búfer y reconexión ============ */
  // NOTA: el navegador controla el tamaño del búfer del <audio> en vivo y no se
  // puede agrandar por API. Para que el audio no se corte, un "vigilante" detecta
  // cuando el sonido deja de avanzar y reconecta al instante si el servidor está
  // bien, o reintenta con espera progresiva si el servidor está caído.
  var deseaEscuchar = false;   // intención del usuario (quiere estar escuchando)
  var reintentos    = 0;
  var reconTimer    = null;
  var watchdog      = null;
  var ultTiempo = 0, ultAvance = 0;

  function fuente(){
    // Cache-buster: evita reusar una conexión muerta al reconectar
    return STREAM_URL + (STREAM_URL.indexOf("?") >= 0 ? "&" : "?") + "_=" + Date.now();
  }

  function conectar(){
    clearTimeout(reconTimer); reconTimer = null;
    audio.src = fuente();
    audio.load();
    var p = audio.play();
    if (p && p.catch) p.catch(programarReconexion);
  }

  function programarReconexion(){
    if (!deseaEscuchar || reconTimer) return;
    reintentos++;
    // 1er corte: reintento casi inmediato (hipo de red). Si el servidor sigue
    // caído, la espera crece: 0.4s, 0.8s, 1.6s, 3.2s… hasta 6s máximo.
    var espera = Math.min(6000, 400 * Math.pow(2, Math.min(reintentos - 1, 4)));
    status.textContent = (reintentos > 5)
        ? "SEÑAL INTERRUMPIDA · REINTENTANDO…"
        : "RECONECTANDO…";
    reconTimer = setTimeout(function(){
      reconTimer = null;
      if (deseaEscuchar) conectar();
    }, espera);
  }

  function iniciarWatchdog(){
    clearInterval(watchdog);
    ultTiempo = audio.currentTime; ultAvance = Date.now();
    watchdog = setInterval(function(){
      if (!deseaEscuchar) return;
      if (audio.currentTime > ultTiempo + 0.05) {
        ultTiempo = audio.currentTime; ultAvance = Date.now();
        reintentos = 0;                       // fluye bien: reinicia el contador
      } else if (Date.now() - ultAvance > 8000) {
        ultAvance = Date.now();
        programarReconexion();                // 8s sin avanzar → búfer agotado
      }
    }, 2000);
  }

  btnPlay.addEventListener("click", function(){
    if (!deseaEscuchar) {
      deseaEscuchar = true;
      reintentos = 0;
      card.classList.add("playing");
      status.textContent = "CONECTANDO…";
      initAnalyser();
      iniciarWatchdog();
      conectar();
    } else {
      deseaEscuchar = false;
      clearTimeout(reconTimer);  reconTimer = null;
      clearInterval(watchdog);
      audio.pause();
      audio.removeAttribute("src");
      audio.load();
      card.classList.remove("playing");
      status.textContent = "TOCA ▶ PARA ESCUCHAR";
    }
  });

  audio.addEventListener("playing", function(){
    reintentos = 0;
    ultTiempo = audio.currentTime; ultAvance = Date.now();
    status.textContent = "TRANSMITIENDO EN VIVO · 105.5 FM";
  });
  audio.addEventListener("waiting", function(){
    if (deseaEscuchar) status.textContent = "CARGANDO BÚFER…";
  });
  audio.addEventListener("stalled", function(){
    // 'stalled' también se dispara durante la carga inicial normal, así que solo
    // informamos; la reconexión real la decide el watchdog (8s sin avanzar).
    if (deseaEscuchar && !audio.paused) status.textContent = "CARGANDO BÚFER…";
  });
  audio.addEventListener("error", function(){ if (deseaEscuchar) programarReconexion(); });
  audio.addEventListener("ended", function(){ if (deseaEscuchar) programarReconexion(); });

  /* ============ Volumen ============ */
  volume.addEventListener("input", function(){
    audio.volume = this.value / 100;
    this.style.setProperty("--vol", this.value + "%");
  });

  /* ============ Reacciones flotantes estilo TikTok Live ============ */
  document.querySelectorAll(".reaction-btn").forEach(function(btn){
    btn.addEventListener("click", function(){
      // Ráfaga de 1 a 3 copias por clic, como en los directos
      var copies = 1 + Math.floor(Math.random() * 3);
      for (var i = 0; i < copies; i++) {
        setTimeout(launchReaction.bind(null, btn), i * 120);
      }
    });
  });

  function launchReaction(btn){
    var el = document.createElement("div");
    el.className = "float-emoji";
    el.innerHTML = btn.querySelector("svg").outerHTML;

    // Nace sobre el botón pulsado, con un poco de dispersión horizontal
    var contRect = cont.getBoundingClientRect();
    var btnRect  = btn.getBoundingClientRect();
    var x = btnRect.left - contRect.left + btnRect.width / 2 - 22;
    x += (Math.random() * 30 - 15);
    el.style.left = x + "px";
    el.style.bottom = (contRect.bottom - btnRect.top - 10) + "px";

    // Cada reacción sube con duración, vaivén y tamaño distintos
    var dur = (2.6 + Math.random() * 1.8).toFixed(2);
    el.style.setProperty("--dur", dur + "s");
    el.style.setProperty("--sway", (10 + Math.random() * 22).toFixed(0) + "px");
    el.style.setProperty("--sway-dur", (1 + Math.random() * .9).toFixed(2) + "s");
    var size = 28 + Math.random() * 16;
    el.style.width = el.style.height = size + "px";

    layer.appendChild(el);
    setTimeout(function(){ el.remove(); }, dur * 1000 + 100);
  }
})();
</script>
