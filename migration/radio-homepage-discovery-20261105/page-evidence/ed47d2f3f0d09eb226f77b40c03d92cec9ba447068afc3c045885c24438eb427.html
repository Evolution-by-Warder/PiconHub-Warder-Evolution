<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Smoothjazzbrasil</title>
  <link href="https://fonts.cdnfonts.com/css/tt-commons" rel="stylesheet"/>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      background: linear-gradient(135deg, #FF8C00 0%, #FF4500 50%, #FF6A00 100%);
      font-family: 'TT Commons', 'Nunito', 'Poppins', sans-serif;
      text-align: center;
      padding: 20px;
    }

    .container {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 30px;
    }

    .titulo {
      font-size: 100px;
      font-weight: 700;
      color: #ffffff;
      letter-spacing: -2px;
      line-height: 1.1;
      text-shadow: 0 4px 24px rgba(0,0,0,0.18);
    }

    .subtitulo {
      font-size: 60px;
      font-weight: 400;
      color: rgba(255, 255, 255, 0.92);
      line-height: 1.2;
      text-shadow: 0 2px 12px rgba(0,0,0,0.14);
    }

    @media (max-width: 768px) {
      .titulo { font-size: 52px; }
      .subtitulo { font-size: 32px; }
    }
  </style>
</head>
<body>
  <div class="container">
    <h1 class="titulo">Smoothjazzbrasil</h1>
    <p class="subtitulo">Temporariamente fora do ar.</p>
  </div>
</body>
</html>
