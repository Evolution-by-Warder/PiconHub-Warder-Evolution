    <style>
        .live-pulse {
            width: 20px;
            height: 20px;
            background-color: rgba(255, 0, 0, 1);
            border-radius: 50%;
            font-size: 10px;
            line-height: 20px;
            color: #FFF;
            text-align: center
            animation: live_animate 3s linear infinite;
        }
        .live-pulse>a, .live-pulse > a:visited, .live-pulse > a:link, .live-pulse > a:hover {

        @keyframes live_animate {
            0% {

            }
            
            40% {
                box-shadow: 0 0 0 10px rgba(255, 0, 0, 0.7), 0 0 0 0 rgba(255, 0, 0, 0.7);
            }

            80% {
                box-shadow: 0 0 0 10px rgba(255, 0, 0, 0.7), 0 0 0 30px rgba(255, 0, 0, 0);
            }

            100% {
