<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#FAF36B">
  <meta name="description" content="Radio Accordéon la radio des passionnés du musette et du rétro">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Radio Accordéon">
  <link rel="manifest" href="manifest.json">
  <link rel="icon" href="assets/icon-192.png" type="image/png">
  <link rel="apple-touch-icon" href="assets/icon-192.png">
  <link rel="stylesheet" href="css/styles.css">
  <title>Radio Accordéon</title>
</head>
<body>
<div id="app">
  <header class="mobile-topbar">
    <button class="icon-btn" id="menuButton" aria-label="Ouvrir le menu">☰</button>
    <button class="icon-btn" id="searchButton" aria-label="Recherche">⌕</button>
  </header>

  <aside class="desktop-sidebar" aria-label="Navigation principale">
    <a class="desktop-brand" href="#/" aria-label="Accueil Radio Accordéon">
      <img src="assets/logo-radio-accordeon.png" alt="Radio Accordéon">
    </a>
    <nav>
      <a href="#/" data-route="/"><span>⌂</span>Accueil</a>
      <a href="#/favoris" data-route="/favoris"><span>★</span>Favoris</a>
      <a href="#/recherche"><span>⌕</span>Rechercher</a>
      <a href="#/emissions" data-route="/emissions"><span>▣</span>Émissions</a>
      <a href="#/apropos" data-route="/apropos"><span>ⓘ</span>À propos</a>
    </nav>
  </aside>

  <aside class="drawer" id="drawer" aria-hidden="true">
    <div class="drawer-head">
      <a class="brand brand-dark" href="#/"><img src="assets/logo-radio-accordeon.png" alt="Radio Accordéon"></a>
      <button class="icon-btn" id="closeMenu" aria-label="Fermer le menu">×</button>
    </div>
    <nav class="drawer-nav">
      <a href="#/">⌂ <span>Accueil</span></a>
      <a href="#/favoris">★ <span>Favoris</span></a>
      <a href="#/recherche">⌕ <span>Rechercher</span></a>
      <a href="#/emissions">▣ <span>Émissions</span></a>
      <a href="#/apropos">ⓘ <span>À propos</span></a>
    </nav>
    <div class="drawer-install" id="installPanel">
      <b>Radio Accordéon</b><span>radioaccordeon.fr</span>
      <button class="yellow-btn" id="installButton">Installer l'application</button>
    </div>
  </aside>
  <div class="scrim" id="scrim"></div>

  <main id="main-content"></main>

  <section class="player" id="player" aria-label="Lecteur Radio Accordéon">
    <div class="player-main">
      <div class="cover-mini" id="coverArt"><img src="images/radio-accordeon-cover.jpg" alt="Radio Accordéon"></div>
      <div class="player-copy"><strong id="playerTitle">Accordéon en direct</strong><span id="playerSubtitle">Radio Accordéon</span></div>
    </div>
    <div class="player-controls">
      <button class="player-btn" id="volumeButton" aria-label="Couper le son">🔊</button>
      <input id="volumeSlider" class="volume-slider" type="range" min="0" max="1" step="0.01" value="0.8" aria-label="Volume">
      <button class="play-btn" id="playButton" aria-label="Écouter Radio Accordéon">▶</button>
    </div>
    <a class="legal-link" href="legal.html">Mentions Légales</a>
    <div class="store-badges" aria-label="Télécharger l'application">
      <a href="https://apps.apple.com/fr/app/radio-accord%C3%A9on/id1183418052" target="_blank" rel="noopener noreferrer"><img src="assets/appstore.png" alt="Disponible sur l’App Store"></a>
      <a href="https://play.google.com/store/apps/details?id=com.mediadixradio.radioaccordeon&pli=1" target="_blank" rel="noopener noreferrer"><img src="assets/google-play.png" alt="Disponible sur Google Play"></a>
    </div>
    <div class="live-line"><span></span> DIRECT • <b id="connectionText">Prêt à écouter</b></div>
    <audio id="radioAudio" preload="none" playsinline></audio>
  </section>

  <nav class="bottom-nav" aria-label="Navigation mobile">
    <a href="#/" data-route="/"><span>⌂</span><small>Accueil</small></a>
    <a href="#/favoris" data-route="/favoris"><span>★</span><small>Favoris</small></a>
    <a href="#/recherche"><span>⌕</span><small>Rechercher</small></a>
    <a href="#/emissions" data-route="/emissions"><span>▣</span><small>Émissions</small></a>
    <a href="#/apropos" data-route="/apropos"><span>ⓘ</span><small>À propos</small></a>
  </nav>
</div>
<script src="js/nowplaying.js"></script>
<script src="js/app.js"></script>
</body>
</html>
